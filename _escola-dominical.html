<style>

  background: linear-gradient(140deg, var(--hero-b) 0%, var(--hero-a) 100%);
}

.edm-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-2); border-radius: var(--r-3); background: var(--bg-glass-strong); border: 1px solid var(--border); }
.edm-av { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 800; background: var(--teal-dim); color: var(--teal); }
.edm-info { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; color: inherit; font-family: inherit; cursor: pointer; }
.edm-nome { display: block; font-size: var(--fs-sm); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edm-pts { display: block; font-size: var(--fs-xs); font-weight: 600; color: var(--success); }
.edm-pts.off { color: var(--danger); }
.edm-tag { font-size: var(--fs-xs); font-weight: 800; color: var(--gold); }
.edm-tgs { display: flex; gap: var(--sp-1); flex-shrink: 0; }
.edm-tg { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--text-dim); border: 1px solid var(--border-strong); background: transparent; transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.edm-tg i, .edm-tg svg { width: 18px; height: 18px; stroke-width: 2.2; }
.edm-tg:disabled { opacity: .4; cursor: default; }
.edm-tg.on { color: #fff; border-color: var(--c); background: var(--c); }
.edm-tg.edm-c-ok, .edm-tg.edm-c-bib, .edm-tg.edm-c-rev { --c: inherit; }
.edm-tg.t-pres { --c: var(--success); } .edm-tg.t-bib { --c: var(--cyan); } .edm-tg.t-rev { --c: var(--gold); }
.edm-bar { position: sticky; bottom: calc(var(--sp-3) + env(safe-area-inset-bottom, 0px)); z-index: 40; margin-top: var(--sp-4); padding: var(--sp-3); border-radius: var(--r-4); background: var(--bg-elevated); border: 1px solid var(--border); box-shadow: var(--shadow-lg); max-width: 640px; margin-left: auto; margin-right: auto; }
.edm-bar-top { display: grid; grid-template-columns: auto 1fr; gap: var(--sp-3); margin-bottom: var(--sp-3); align-items: start; }
.edm-bar .field { margin: 0; }
.edm-step { display: flex; align-items: center; border: 1px solid var(--border-strong); border-radius: var(--r-pill); height: 44px; }
.edm-step button { width: 44px; height: 44px; border: 0; background: none; color: var(--teal); font-size: var(--fs-lg); font-weight: 800; cursor: pointer; }
.edm-step b { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.edm-vazio { text-align: center; padding: var(--sp-6) var(--sp-4); color: var(--text-muted); font-size: var(--fs-sm); }
.edm-extra { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); width: 100%; padding: var(--sp-3); margin-bottom: var(--sp-2); border-radius: var(--r-2); border: 1px solid var(--border-strong); background: transparent; color: var(--text); font-family: inherit; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }
.edm-extra.on { border-color: var(--teal); background: var(--teal-dim); color: var(--teal); }

.edm-fab {
  position: fixed; z-index: 60; right: var(--gutter); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--sp-4));
  width: 56px; height: 56px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  color: var(--on-teal, #fff); background: var(--teal); box-shadow: var(--shadow-lg), 0 10px 22px -10px var(--teal-glow);
  transition: transform var(--dur) var(--ease);
}
.edm-fab i, .edm-fab svg { width: 26px; height: 26px; stroke-width: 2.4; }
.edm-fab:active { transform: scale(.95); }
@media (min-width: 1024px) { .edm-fab { bottom: var(--sp-6); } }
.edm-toolbar { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.edm-toolbar .field { margin: 0; }
.edm-card { width: 100%; text-align: left; font-family: inherit; color: inherit; cursor: pointer; }
.edm-card .edm-av { background: var(--gold-dim); color: var(--gold); }
.edm-meta { display: block; font-size: var(--fs-xs); font-weight: 600; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edm-count { font-size: var(--fs-lg); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--teal); text-align: right; }
.edm-count small { display: block; font-size: var(--fs-xs); font-weight: 600; color: var(--text-muted); }
.edm-form-btns { display: flex; gap: var(--sp-2); width: 100%; }
.edm-form-btns .btn-danger { margin-right: auto; }

.edm-gear { position: absolute; top: var(--sp-3); right: var(--gutter); width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center; cursor: pointer; }
.edm-gear i, .edm-gear svg { width: 20px; height: 20px; }
.edm-sec { display: flex; align-items: baseline; justify-content: space-between; margin: var(--sp-4) 0 var(--sp-2); font-size: var(--fs-md); font-weight: 800; }
.edm-sec a, .edm-sec button { font-size: var(--fs-sm); font-weight: 700; color: var(--teal); background: none; border: 0; cursor: pointer; font-family: inherit; padding: 0; }
.edm-bento { display: grid; grid-template-columns: 1.2fr 1fr; gap: var(--sp-2); }
.edm-feat { position: relative; overflow: hidden; border-radius: var(--r-3); padding: var(--sp-4); color: #fff; background: linear-gradient(135deg, var(--hero-b), var(--hero-a)); box-shadow: var(--shadow-md); }
.edm-feat i, .edm-feat svg.edm-ghost { position: absolute; right: -10px; bottom: -12px; width: 84px; height: 84px; opacity: .16; transform: rotate(-12deg); }
.edm-feat small { font-size: var(--fs-xs); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--hero-gold, #E8C27A); }
.edm-feat b { display: block; font-size: var(--fs-2xl); font-weight: 800; line-height: 1.1; margin-top: var(--sp-2); font-variant-numeric: tabular-nums; }
.edm-feat span { font-size: var(--fs-sm); opacity: .85; }
.edm-mini-col { display: grid; gap: var(--sp-2); }
.edm-mini { border-radius: var(--r-3); padding: var(--sp-2) var(--sp-3); background: var(--bg-glass-strong); border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.edm-mini span { font-size: var(--fs-xs); font-weight: 700; color: var(--text-muted); }
.edm-mini b { font-size: var(--fs-lg); font-weight: 800; font-variant-numeric: tabular-nums; }
.edm-alerta { display: flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-3); padding: var(--sp-3); border-radius: var(--r-3); background: var(--gold-dim); border: 1px solid var(--gold); }
.edm-alerta > div { flex: 1; min-width: 0; font-size: var(--fs-sm); font-weight: 700; }
.edm-alerta small { display: block; font-size: var(--fs-xs); font-weight: 600; color: var(--text-muted); }
.edm-panelc { border-radius: var(--r-3); padding: var(--sp-3); background: var(--bg-glass-strong); border: 1px solid var(--border); }
.edm-pres { display: flex; align-items: center; gap: var(--sp-4); }
.edm-ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
.edm-ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.edm-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: var(--fs-lg); font-weight: 800; }
.edm-bars { flex: 1; display: flex; align-items: flex-end; gap: var(--sp-1); height: 92px; }
.edm-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: var(--sp-1); }
.edm-bar-col i { display: block; width: 100%; max-width: 20px; border-radius: var(--r-1); background: var(--teal-dim); min-height: 4px; }
.edm-bar-col:last-child i { background: var(--teal); }
.edm-bar-col span { font-size: var(--fs-xs); color: var(--text-muted); }
.edm-medal { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--text-dim); }
.edm-medal.m1 { background: var(--gold); } .edm-medal.m2 { background: #94A3B8; } .edm-medal.m3 { background: #C2865A; }
.edm-valor { font-size: var(--fs-sm); font-weight: 800; padding: var(--sp-1) var(--sp-2); border-radius: var(--r-pill); background: var(--teal-dim); color: var(--teal); white-space: nowrap; }
.edm-prog { flex: 1; height: 8px; border-radius: var(--r-pill); background: var(--teal-dim); overflow: hidden; }
.edm-prog i { display: block; height: 100%; background: var(--teal); border-radius: var(--r-pill); }
.edm-seg { display: grid; grid-template-columns: 1fr 1fr; padding: var(--sp-1); gap: var(--sp-1); border-radius: var(--r-pill); background: var(--bg-glass-strong); border: 1px solid var(--border); margin-bottom: var(--sp-3); }
.edm-seg button { height: 36px; border: 0; border-radius: var(--r-pill); background: none; color: var(--text-muted); font-family: inherit; font-size: var(--fs-sm); font-weight: 700; cursor: pointer; }
.edm-seg button.on { background: var(--teal); color: var(--on-teal, #fff); }
.edm-pts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); }
@media (prefers-reduced-motion: reduce) { .edm-tg, .edm-fab { transition: none; } }
</style>

<script>
// ══ Escola Dominical — estado e telas ═══════════════════
var EDM_TELAS = [['visao', 'layout-grid', 'Visão geral'], ['chamada', 'clipboard-check', 'Chamada'], ['turmas', 'users-round', 'Turmas'], ['alunos', 'graduation-cap', 'Alunos'], ['professores', 'book-user', 'Professores'], ['aulas', 'calendar-days', 'Aulas'], ['ranking', 'trophy', 'Ranking']];
var EDM_TITULOS = { visao: 'Visão geral', chamada: 'Chamada', turmas: 'Turmas', alunos: 'Alunos', professores: 'Professores', aulas: 'Aulas', ranking: 'Ranking' };
// Professor só lança chamada e consulta alunos; o resto é da secretaria/admin.
function edmTelasDoPerfil() {
  var prof = App.session && App.session.perfil === 'professor';
  return EDM_TELAS.filter(function (t) { return !prof || ['visao', 'chamada', 'alunos', 'ranking'].indexOf(t[0]) !== -1; });
}
function edmPodeEditar() { return !!App.session && App.session.perfil !== 'professor'; }
var EDM = {
  tela: 'chamada', classes: [], aulas: [], classeId: '', aulaId: '',
  modo: 'presenca', modoRanking: 'presenca', vg: null, rk: { modo: '', turma: '', tri: '', lista: [] }, alunos: [], todosAlunos: [], professores: [], filtroTurma: '', busca: '', extras: [], pontos: { presenca: 1, biblia: 2, revista: 2 },
  visitantes: 0, oferta: '', obs: '', jaLancada: false, salvando: false, extraAluno: null
};

function _edmEsc(s) { return escHtml(s == null ? '' : String(s)); }
function _edmResp(r, ctx) {
  if (!r) { showToast('Sem resposta do servidor (' + ctx + ').', 'error'); return false; }
  if (!r.success) {
    var msg = r.error || 'Erro desconhecido';
    if (/Sess|xpirada|utorizado/.test(msg)) { showToast('Sessão expirada. Faça login novamente.', 'error'); setTimeout(function () { navigateTo('login'); }, 1500); return false; }
    showToast(msg, 'error'); return false;
  }
  return true;
}
function _edmIni(n) { var p = String(n || '?').trim().split(/\s+/); return ((p[0][0] || '?') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
function _edmData(v) {
  if (!v) return null;
  var s = String(v), d;
  if (s.indexOf('/') !== -1) { var p = s.split(' ')[0].split('/'); d = new Date(+p[2], +p[1] - 1, +p[0]); }
  else d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function _edmDataCurta(v) {
  var d = _edmData(v); if (!d) return '';
  var m = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  return d.getDate() + ' ' + m[d.getMonth()];
}
function _edmRotuloAula(a) { return 'Lição ' + a.NumLicao + (a.Data ? ' · ' + _edmDataCurta(a.Data) : ''); }
function _edmPts(a) {
  if (!a.presente) return 0;
  var t = EDM.pontos.presenca + (a.biblia ? EDM.pontos.biblia : 0) + (a.revista ? EDM.pontos.revista : 0);
  (a.pontosExtras || []).forEach(function (e) { t += Number(e.pontos) || 0; });
  return t;
}
function _edmOrdenarAulas(lista) {
  return lista.slice().sort(function (a, b) {
    var da = _edmData(a.Data), db = _edmData(b.Data);
    return (db ? db.getTime() : 0) - (da ? da.getTime() : 0) || (Number(b.NumLicao) || 0) - (Number(a.NumLicao) || 0);
  });
}
function _edmNum(v) { var n = parseFloat(String(v || '').replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; }

function renderEscolaDominical() {
  if (!App.session) { navigateTo('login'); return; }
  EDM.tela = edmPodeEditar() ? 'visao' : 'chamada';
  var telas = edmTelasDoPerfil();
  var atalhos = telas.length > 1 ? '<nav class="edm-atalhos no-print" aria-label="Seções da Escola Dominical">' + telas.map(function (t) {
    return '<button type="button" class="hm-mod' + (EDM.tela === t[0] ? ' active' : '') + '" data-tela="' + t[0] + '" onclick="edmIr(\'' + t[0] + '\')">' +
      '<div class="hm-mod-icon"><i data-lucide="' + t[1] + '"></i></div><div class="hm-mod-name">' + t[2] + '</div></button>';
  }).join('') + '</nav>' : '';
  renderView(
    '<div class="edm-hero">' +
      '<svg class="edm-hero-art" viewBox="0 0 100 100" aria-hidden="true"><rect x="42" y="4" width="16" height="92" rx="6" fill="#fff"/><rect x="18" y="30" width="64" height="16" rx="6" fill="#fff"/></svg>' +
      '<div class="edm-hero-kicker">Escola Dominical</div>' +
      '<button type="button" class="edm-gear" id="edm-gear" onclick="edmAjustes()" aria-label="Ajustes" title="Ajustes" style="display:none"><i data-lucide="settings-2"></i></button>' +
      '<div class="edm-hero-title" id="edm-titulo">' + EDM_TITULOS[EDM.tela] + '</div>' +
      '<div class="edm-hero-sub" id="edm-sub">Carregando…</div>' +
    '</div>' + atalhos +
    '<div id="edm-panel" class="page"><div class="edm-vazio"><div class="loader-spinner" style="margin:0 auto"></div></div></div>' +
    '<div class="modal-overlay" id="modal-edm-aula" onclick="if(event.target===this)edmFecharModal(\'modal-edm-aula\')"><div class="modal-box">' +
      '<div class="modal-header"><div><h3>Nova aula</h3><div class="modal-sub">Registre a lição do domingo</div></div></div>' +
      '<div class="modal-body">' +
        '<div class="field"><label for="edm-aula-data">Data</label><input type="date" id="edm-aula-data"></div>' +
        '<div class="field"><label for="edm-aula-tri">Trimestre</label><select id="edm-aula-tri"><option value="1">1º trimestre</option><option value="2">2º trimestre</option><option value="3">3º trimestre</option><option value="4">4º trimestre</option></select></div>' +
        '<div class="field"><label for="edm-aula-num">Número da lição</label><input type="number" id="edm-aula-num" min="1" inputmode="numeric" placeholder="Ex.: 7"></div>' +
      '</div>' +
      '<div class="modal-footer"><button class="btn btn-secondary" onclick="edmFecharModal(\'modal-edm-aula\')">Cancelar</button><button class="btn btn-primary" id="edm-aula-salvar" onclick="edmSalvarAula()">Salvar aula</button></div>' +
    '</div></div>' +
    '<div class="modal-overlay" id="modal-edm-form" onclick="if(event.target===this)edmFecharModal(\'modal-edm-form\')"><div class="modal-box">' +
      '<div class="modal-header"><div><h3 id="edm-form-titulo"></h3></div></div>' +
      '<div class="modal-body" id="edm-form-corpo"></div>' +
      '<div class="modal-footer" id="edm-form-rodape"></div>' +
    '</div></div>' +
    '<div class="modal-overlay" id="modal-edm-extras" onclick="if(event.target===this)edmFecharModal(\'modal-edm-extras\')"><div class="modal-box">' +
      '<div class="modal-header"><div><h3>Pontos extras</h3><div class="modal-sub" id="edm-extras-sub"></div></div></div>' +
      '<div class="modal-body" id="edm-extras-body"></div>' +
      '<div class="modal-footer"><button class="btn btn-primary btn-full" onclick="edmFecharModal(\'modal-edm-extras\')">Concluir</button></div>' +
    '</div></div>'
  );
  setTimeout(function () { if (window.lucide) lucide.createIcons(); edmIr(EDM.tela); }, 0);
}
function edmIr(t) {
  EDM.tela = t;
  var bs = document.querySelectorAll('.edm-atalhos .hm-mod');
  for (var i = 0; i < bs.length; i++) {
    var on = bs[i].getAttribute('data-tela') === t;
    bs[i].classList.toggle('active', on);
    if (on && bs[i].scrollIntoView) { try { bs[i].scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} }
  }
  var ti = document.getElementById('edm-titulo');
  if (ti) ti.textContent = EDM_TITULOS[t] || '';
  var gear = document.getElementById('edm-gear'); if (gear) gear.style.display = (edmPodeEditar() && (t === 'chamada' || t === 'ranking')) ? '' : 'none';
  var painel = document.getElementById('edm-panel');
  if (painel) painel.innerHTML = '<div class="edm-vazio"><div class="loader-spinner" style="margin:0 auto"></div></div>';
  if (t === 'chamada') edmCarregar(); else if (t === 'visao') edmCarregarVisao(); else if (t === 'ranking') edmCarregarRanking(); else edmCarregarCadastros();
}
function edmAbrirModal(id) { var m = document.getElementById(id); if (m) m.classList.add('open'); }
function edmFecharModal(id) { var m = document.getElementById(id); if (m) m.classList.remove('open'); }

// ── Dados ───────────────────────────────────────────────
function edmCarregar() {
  google.script.run
    .withFailureHandler(function (e) { showToast((e && e.message) || 'Erro ao carregar a Escola Dominical.', 'error'); })
    .withSuccessHandler(function (r) {

      showToast('Ajustes salvos.', 'success');
      EDM.alunos = []; EDM.rk.modo = ''; edmIr(EDM.tela);
    })
    .ed_salvarConfigEbd(App.session.token, dados);
}
