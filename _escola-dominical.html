<script>
// ══ Escola Dominical — estado e telas ═══════════════════
var EDM_TELAS = [['visao', 'layout-grid', 'Visão geral'], ['chamada', 'clipboard-check', 'Aulas e Chamada'], ['turmas', 'users-round', 'Turmas'], ['alunos', 'graduation-cap', 'Alunos'], ['professores', 'book-user', 'Professores'], ['relatorios', 'bar-chart-3', 'Relatórios'], ['ranking', 'trophy', 'Ranking']];
var EDM_TITULOS = { visao: 'Visão geral', chamada: 'Aulas e Chamada', turmas: 'Turmas', alunos: 'Alunos', professores: 'Professores', relatorios: 'Relatórios', ranking: 'Ranking' };
// Professor só lança chamada e consulta alunos; o resto é da secretaria/admin.
function edmTelasDoPerfil() {
  var prof = App.session && App.session.perfil === 'professor';
  return EDM_TELAS.filter(function (t) { return !prof || ['visao', 'chamada', 'alunos', 'relatorios', 'ranking'].indexOf(t[0]) !== -1; });
}
function edmPodeEditar() { return !!App.session && App.session.perfil !== 'professor'; }
var EDM = {
  tela: 'chamada', classes: [], aulas: [], classeId: '', aulaId: '',
  modo: 'presenca', modoRanking: 'presenca', vg: null, relAulaId: '', rel: null, rk: { modo: '', turma: '', tri: '', lista: [] }, alunos: [], todosAlunos: [], professores: [], filtroTurma: '', busca: '', extras: [], pontos: { presenca: 1, biblia: 2, revista: 2 },
  visitantes: 0, ofertaC: 0, obs: '', jaLancada: false, salvando: false, extraAluno: null,
  nivel: 'hist', hist: null, freq: null, relAula: null, editando: false, podeEditarCh: false, turmaNome: '', aulaInfo: {}
};

function _edmEsc(s) { return escHtml(s == null ? '' : String(s)); }
function _edmResp(r, ctx) {
  if (!r) { showToast('Sem resposta do servidor (' + ctx + ').', 'error'); return false; }
  if (!r.success) {
    var msg = r.error || 'Erro desconhecido';
    if (/Sess|xpirada|utorizado/.test(msg)) { showToast('Sessão expirada. Faça login novamente.', 'error'); setTimeout(function () { navigateTo('login'); }, 1500); return false; }
    showToast(msg, 'error'); return false;
  }
  return true;
}
function _edmIni(n) { var p = String(n || '?').trim().split(/\s+/); return ((p[0][0] || '?') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
function _edmData(v) {
  if (!v) return null;
  var s = String(v), d;
  if (s.indexOf('/') !== -1) { var p = s.split(' ')[0].split('/'); d = new Date(+p[2], +p[1] - 1, +p[0]); }
  else d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function _edmDataCurta(v) {
  var d = _edmData(v); if (!d) return '';
  var m = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  return d.getDate() + ' ' + m[d.getMonth()];
}
function _edmRotuloAula(a) { return 'Lição ' + a.NumLicao + (a.Data ? ' · ' + _edmDataCurta(a.Data) : ''); }
function _edmPts(a) {
  if (!a.presente) return 0;
  var t = EDM.pontos.presenca + (a.biblia ? EDM.pontos.biblia : 0) + (a.revista ? EDM.pontos.revista : 0);
  (a.pontosExtras || []).forEach(function (e) { t += Number(e.pontos) || 0; });
  return t;
}
function _edmOrdenarAulas(lista) {
  return lista.slice().sort(function (a, b) {
    var da = _edmData(a.Data), db = _edmData(b.Data);
    return (db ? db.getTime() : 0) - (da ? da.getTime() : 0) || (Number(b.NumLicao) || 0) - (Number(a.NumLicao) || 0);
  });
}
function _edmNum(v) { var n = parseFloat(String(v || '').replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; }

function renderEscolaDominical() {
  if (!App.session) { navigateTo('login'); return; }
  EDM.tela = edmPodeEditar() ? 'visao' : 'chamada';
  var telas = edmTelasDoPerfil();
  var atalhos = telas.length > 1 ? '<nav class="edm-atalhos no-print" aria-label="Seções da Escola Dominical">' + telas.map(function (t) {
    return '<button type="button" class="hm-mod' + (EDM.tela === t[0] ? ' active' : '') + '" data-tela="' + t[0] + '" onclick="edmIr(\'' + t[0] + '\')">' +
      '<div class="hm-mod-icon"><i data-lucide="' + t[1] + '"></i></div><div class="hm-mod-name">' + t[2] + '</div></button>';
  }).join('') + '</nav>' : '';
  renderView(
    '<div class="edm-hero">' +
      '<svg class="edm-hero-art" viewBox="0 0 100 100" aria-hidden="true"><rect x="42" y="4" width="16" height="92" rx="6" fill="#fff"/><rect x="18" y="30" width="64" height="16" rx="6" fill="#fff"/></svg>' +
      '<div class="edm-hero-kicker">Escola Dominical</div>' +
      '<button type="button" class="edm-gear" id="edm-gear" onclick="edmAjustes()" aria-label="Ajustes" title="Ajustes" style="display:none"><i data-lucide="settings-2"></i></button>' +
      '<div class="edm-hero-title" id="edm-titulo">' + EDM_TITULOS[EDM.tela] + '</div>' +
      '<div class="edm-hero-sub" id="edm-sub">Carregando…</div>' +
    '</div>' + atalhos +
    '<div id="edm-panel" class="page"><div class="edm-vazio"><div class="loader-spinner" style="margin:0 auto"></div></div></div>' +
    '<div class="modal-overlay" id="modal-edm-form" onclick="if(event.target===this)edmFecharModal(\'modal-edm-form\')"><div class="modal-box">' +
      '<div class="modal-header"><div><h3 id="edm-form-titulo"></h3></div></div>' +
      '<div class="modal-body" id="edm-form-corpo"></div>' +
      '<div class="modal-footer" id="edm-form-rodape"></div>' +
    '</div></div>' +
    '<div class="modal-overlay" id="modal-edm-extras" onclick="if(event.target===this)edmFecharModal(\'modal-edm-extras\')"><div class="modal-box">' +
      '<div class="modal-header"><div><h3>Pontos extras</h3><div class="modal-sub" id="edm-extras-sub"></div></div></div>' +
      '<div class="modal-body" id="edm-extras-body"></div>' +
      '<div class="modal-footer"><button class="btn btn-primary btn-full" onclick="edmFecharModal(\'modal-edm-extras\')">Concluir</button></div>' +
    '</div></div>'
  );
  setTimeout(function () { if (window.lucide) lucide.createIcons(); edmIr(EDM.tela); var n = document.querySelector('.edm-atalhos'); if (n) { n.addEventListener('scroll', edmAtalhosDica, { passive: true }); edmAtalhosDica(); } }, 0);
}
function edmAtalhosDica() {
  var n = document.querySelector('.edm-atalhos'); if (!n) return;
  n.classList.toggle('mais-esq', n.scrollLeft > 4);
  n.classList.toggle('mais-dir', n.scrollLeft + n.clientWidth < n.scrollWidth - 4);
}
function edmIr(t) {
  EDM.tela = t;
  var bs = document.querySelectorAll('.edm-atalhos .hm-mod');
  for (var i = 0; i < bs.length; i++) {
    var on = bs[i].getAttribute('data-tela') === t;
    bs[i].classList.toggle('active', on);
  }
  var ativo = document.querySelector('.edm-atalhos .hm-mod.active'), caixa = document.querySelector('.edm-atalhos');
  if (ativo && caixa) caixa.scrollLeft = Math.max(0, ativo.offsetLeft - (caixa.clientWidth - ativo.offsetWidth) / 2);
  edmAtalhosDica();
  var ti = document.getElementById('edm-titulo');
  if (ti) ti.textContent = EDM_TITULOS[t] || '';
  var gear = document.getElementById('edm-gear'); if (gear) gear.style.display = (edmPodeEditar() && (t === 'chamada' || t === 'ranking')) ? '' : 'none';
  var painel = document.getElementById('edm-panel');
  if (painel) painel.innerHTML = '<div class="edm-vazio"><div class="loader-spinner" style="margin:0 auto"></div></div>';
  if (t === 'chamada') edmCarregar(); else if (t === 'visao') edmCarregarVisao(); else if (t === 'ranking') edmCarregarRanking(); else if (t === 'relatorios') edmCarregarRelatorios(); else edmCarregarCadastros();
}
function edmAbrirModal(id) { var m = document.getElementById(id); if (m) m.classList.add('open'); }
function edmFecharModal(id) { var m = document.getElementById(id); if (m) m.classList.remove('open'); }

// ── Dados e navegação da Chamada: histórico do trimestre → turmas da aula → chamada da turma ──
function _edmCarga() { return '<div class="edm-vazio"><div class="loader-spinner" style="margin:0 auto"></div></div>'; }
function edmCarregar() {
  EDM.nivel = 'hist'; EDM.editando = false;
  edmCarregarHist();
}
function edmCarregarHist() {
  var painel = document.getElementById('edm-panel'); if (painel && !EDM.hist) painel.innerHTML = _edmCarga();
  google.script.run
    .withFailureHandler(function (e) { showToast((e && e.message) || 'Erro ao carregar as aulas.', 'error'); })
    .withSuccessHandler(function (r) {
      if (!_edmResp(r, 'histórico')) return;
      EDM.hist = r.data || { aulas: [] };
      edmRender();
    })
    .ed_getHistoricoChamadas(App.session.token, {});
}
function edmAbrirAula(id) {
  EDM.aulaId = id; EDM.nivel = 'aula'; EDM.relAula = null;
  var painel = document.getElementById('edm-panel'); if (painel) painel.innerHTML = _edmCarga();
  edmRender();
  google.script.run
    .withFailureHandler(function (e) { showToast((e && e.message) || 'Erro ao carregar a aula.', 'error'); })
    .withSuccessHandler(function (r) {
      if (!_edmResp(r, 'aula')) return;
      EDM.relAula = r.data; edmRender();
    })
    .ed_getRelatorioAula(App.session.token, id);
}
function edmAbrirTurma(classeId) {
  EDM.classeId = classeId; EDM.nivel = 'turma'; EDM.editando = false; EDM.alunos = [];
  edmCarregarChamada();
}
function edmVoltar() {
  if (EDM.nivel === 'turma') { EDM.nivel = 'aula'; EDM.editando = false; edmAbrirAula(EDM.aulaId); }
  else { EDM.nivel = 'hist'; EDM.aulaId = ''; edmCarregarHist(); }
}
function edmCarregarChamada() {
  var painel = document.getElementById('edm-panel'); if (painel) painel.innerHTML = _edmCarga();
  google.script.run
    .withFailureHandler(function (e) { showToast((e && e.message) || 'Erro ao carregar a chamada.', 'error'); })
    .withSuccessHandler(function (r) {
      if (!_edmResp(r, 'chamada')) return;
      var d = r.data || {};
      EDM.alunos = d.alunos || []; EDM.extras = d.extras || []; EDM.jaLancada = !!d.jaLancada;
      EDM.pontos = d.pontos || EDM.pontos;
      EDM.modo = d.modo || 'presenca';
      EDM.histPres = d.historicoPresenca || {}; EDM.licoes = d.licoes || [];
      EDM.podeEditarCh = !!d.podeEditar; EDM.turmaNome = d.turmaNome || ''; EDM.aulaInfo = d.aula || {};
      var ti = d.turmaInfo || {};
      EDM.visitantes = Number(ti.numVisitantes) || 0;
      EDM.ofertaC = Math.round((Number(ti.totalOferta) || 0) * 100);
      EDM.obs = ti.observacoes || '';
      // Chamada ainda não lançada e com permissão: já abre para marcar; lançada: só leitura até tocar em Editar.
      EDM.editando = !EDM.jaLancada && EDM.podeEditarCh;
      edmRender();
    })
    .ed_getChamada(App.session.token, EDM.aulaId, EDM.classeId);
}

// Oferta em padrão bancário: os dígitos entram pela direita (1000 → 10,00).
function _edmFmtCent(c) {
  c = Math.max(0, Math.floor(Number(c) || 0));
  var r = Math.floor(c / 100), cs = c % 100;
  return String(r).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + (cs < 10 ? '0' : '') + cs;
}
function edmOferta(el) {
  var d = String(el.value || '').replace(/\D/g, '').replace(/^0+/, '').slice(0, 9);
  EDM.ofertaC = d ? parseInt(d, 10) : 0;
  el.value = _edmFmtCent(EDM.ofertaC);
  try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
}

function _edmStatus(st, txt) {
  return '<span class="edm-st edm-st-' + st + '">' + (st === 'ok' ? '<i data-lucide="check-circle-2"></i>' : st === 'pend' ? '<i data-lucide="alert-circle"></i>' : '<i data-lucide="clock"></i>') + _edmEsc(txt) + '</span>';
}
function _edmVoltarBtn(rot) { return '<button type="button" class="edm-voltar" onclick="edmVoltar()"><i data-lucide="chevron-left"></i> ' + _edmEsc(rot) + '</button>'; }

function edmRender() {
  if (EDM.tela !== 'chamada') return;
  var painel = document.getElementById('edm-panel'); if (!painel) return;
  var sub = document.getElementById('edm-sub'), ti = document.getElementById('edm-titulo');
  var h = '';
  if (EDM.nivel === 'hist') {
    var hs = EDM.hist || { aulas: [] };
    if (ti) ti.textContent = 'Aulas e Chamada';
    if (sub) sub.textContent = hs.trimestre ? hs.trimestre + 'º trimestre ' + hs.ano + (hs.pendentes ? ' · ' + hs.pendentes + (hs.pendentes === 1 ? ' aula com pendência' : ' aulas com pendências') : ' · tudo em dia') : 'Nenhuma aula cadastrada';
    if (hs.podeCriarAula) h += '<button type="button" class="edm-nova" onclick="edmFormAula()"><span><i data-lucide="plus"></i></span><div><b>Nova aula</b><small>Cadastre a lição do domingo</small></div></button>';
    if (!hs.aulas.length) {
      h += '<div class="edm-vazio">' + (hs.podeCriarAula ? 'Nenhuma aula neste trimestre. Toque em “Nova aula” para começar.' : 'Nenhuma aula cadastrada ainda. Peça à secretaria.') + '</div>';
    } else {
      h += '<div class="edm-lista-head"><span>Aulas do trimestre · ' + hs.aulas.length + '</span><span class="edm-dica">Toque para ver as turmas</span></div>';
      h += hs.aulas.map(function (a) {
        var st = a.status === 'ok' ? _edmStatus('ok', 'OK') : a.futura ? _edmStatus('fut', 'Agendada') : _edmStatus('pend', '!');
        return '<div class="edm-row edm-aulacard"><button type="button" class="edm-aulabtn" onclick="edmAbrirAula(\'' + _edmEsc(a.id) + '\')">' +
          '<div class="edm-av edm-av-lic">L' + _edmEsc(a.numLicao) + '</div>' +
          '<div class="edm-info"><span class="edm-nome">' + _edmEsc(hs.trimestre + 'º Trim. — Lição ' + a.numLicao) + (a.hoje ? ' <span class="edm-tag">Hoje</span>' : '') + '</span>' +
          '<span class="edm-meta">' + _edmEsc(_edmData(a.data) ? _edmData(a.data).toLocaleDateString('pt-BR') : '') + (a.titulo ? ' · ' + _edmEsc(a.titulo) : '') + ' · ' + a.lancadas + '/' + a.turmas + ' turmas</span></div>' + st + '</button>' +
          (hs.podeCriarAula ? '<button type="button" class="edm-kebab" onclick="edmMenuAula(\'' + _edmEsc(a.id) + '\')" aria-label="Opções da aula"><i data-lucide="more-vertical"></i></button>' : '') + '</div>';
      }).join('');
    }
  } else if (EDM.nivel === 'aula') {
    var rel = EDM.relAula;
    if (ti) ti.textContent = rel ? 'Lição ' + rel.aula.numLicao : 'Aula';
    if (sub) sub.textContent = rel ? rel.aula.trimestre + 'º trimestre' + (rel.aula.data ? ' · ' + _edmDataCurta(rel.aula.data) : '') : '';
    h += _edmVoltarBtn('Aulas do trimestre');
    if (!rel) { h += _edmCarga(); }
    else if (!rel.turmas.length) { h += '<div class="edm-vazio">Nenhuma turma disponível.</div>'; }
    else {
      var pend = rel.turmas.filter(function (t) { return !t.lancada; }).length;
      h += '<div class="edm-lista-head"><span>Turmas · ' + rel.turmas.length + '</span><span class="edm-dica">' + (pend ? pend + (pend === 1 ? ' pendente' : ' pendentes') : 'Todas lançadas') + '</span></div>';
      h += rel.turmas.map(function (t) {
        return '<button type="button" class="edm-row edm-card" onclick="edmAbrirTurma(\'' + _edmEsc(t.classeId) + '\')">' +
          '<div class="edm-av">' + _edmEsc(_edmIni(t.nome)) + '</div>' +
          '<div class="edm-info"><span class="edm-nome">' + _edmEsc(t.nome) + '</span><span class="edm-meta">' + (t.lancada ? t.presentes + ' de ' + t.matriculados + ' presentes · ' + t.percentual + '%' : 'Chamada não lançada') + '</span></div>' +
          (t.lancada ? _edmStatus('ok', 'OK') : _edmStatus('pend', '!')) + '</button>';
      }).join('');
      h += '<div class="edm-rel-acoes"><button class="btn btn-secondary" onclick="EDM.relAulaId=EDM.aulaId;edmIr(\'relatorios\')"><i data-lucide="bar-chart-3" class="ic-16"></i> Relatório geral da aula</button></div>';
    }
  } else {
    var ai = EDM.aulaInfo || {};
    if (ti) ti.textContent = EDM.turmaNome || 'Turma';
    if (sub) sub.textContent = 'Lição ' + (ai.numLicao || '') + (ai.data ? ' · ' + _edmDataCurta(ai.data) : '') + (EDM.editando ? ' · editando' : EDM.jaLancada ? ' · lançada' : '');
    h += _edmVoltarBtn('Turmas da aula');
    if (!EDM.alunos.length) {
      h += '<div class="edm-vazio">Esta turma não tem alunos.</div>';
    } else {
      if (!EDM.jaLancada && !EDM.podeEditarCh) h += '<div class="edm-aviso">Chamada ainda não lançada. O professor só pode lançá-la no dia da aula; peça à secretaria.</div>';
      if (EDM.jaLancada && !EDM.editando) {
        h += '<div class="edm-leit">' + (EDM.podeEditarCh
          ? '<button class="btn btn-secondary btn-sm" onclick="edmEditar()"><i data-lucide="pencil" class="ic-16"></i> Editar chamada</button>'
          : '<span class="edm-dica">Somente leitura' + (App.session.perfil === 'professor' ? ' · edição só no dia da aula (secretaria/admin depois)' : '') + '</span>') + '</div>';
      }
      h += '<div class="edm-chips" id="edm-chips"></div>' +
        '<div class="edm-lista-head"><span id="edm-total"></span><span class="edm-dica" id="edm-dica"></span></div>' +
        '<div id="edm-lista"></div>';
      if (EDM.editando) {
        h += '<div class="edm-bar"><div class="edm-bar-top">' +
          '<div class="field"><label>Visitantes</label><div class="edm-step"><button onclick="edmVisit(-1)" aria-label="Menos visitantes">−</button><b id="edm-vis">' + EDM.visitantes + '</b><button onclick="edmVisit(1)" aria-label="Mais visitantes">+</button></div></div>' +
          '<div class="field"><label for="edm-oferta">Oferta (R$)</label><input type="text" inputmode="numeric" autocomplete="off" id="edm-oferta" placeholder="0,00" value="' + _edmFmtCent(EDM.ofertaC) + '" oninput="edmOferta(this)"></div>' +
          '</div><button class="btn btn-primary btn-full" id="edm-salvar" onclick="edmSalvar()"><i data-lucide="check" class="ic-16"></i> <span>' + (EDM.jaLancada ? 'Atualizar chamada' : 'Salvar chamada') + '</span></button></div>';
      } else {
        h += '<div class="edm-resumo"><div><small>Visitantes</small><b>' + EDM.visitantes + '</b></div><div><small>Oferta</small><b>R$ ' + _edmFmtCent(EDM.ofertaC) + '</b></div></div>';
      }
    }
  }
  painel.innerHTML = h;
  if (EDM.nivel === 'turma') edmPintar();
  if (window.lucide) lucide.createIcons();
}
function edmEditar() { EDM.editando = true; edmRender(); }
function edmMenuAula(id) {
  var a = _edmAulaPorId(id); if (!a) return;
  document.getElementById('edm-form-titulo').textContent = 'Lição ' + a.NumLicao;
  document.getElementById('edm-form-corpo').innerHTML =
    '<button type="button" class="edm-extra" onclick="edmFormAula(\'' + _edmEsc(id) + '\')"><span><i data-lucide="pencil" class="ic-16"></i> Editar aula</span></button>' +
    '<button type="button" class="edm-extra" onclick="EDM.editId=\'' + _edmEsc(id) + '\';edmFecharModal(\'modal-edm-form\');edmExcluirAula()"><span style="color:var(--danger)"><i data-lucide="trash-2" class="ic-16"></i> Excluir aula</span></button>';
  document.getElementById('edm-form-rodape').innerHTML = '<button class="btn btn-secondary btn-full" onclick="edmFecharModal(\'modal-edm-form\')">Fechar</button>';
  edmAbrirModal('modal-edm-form');
  if (window.lucide) lucide.createIcons();
}

// Frequência do aluno no trimestre: uma bolinha por lição (✓ presente, ✕ ausente, tracejada = sem registro) + resumo e barra.
// vivo (opcional): { licao, presente, lancada } — a lição aberta na chamada acompanha a marcação feita agora.
function _edmLinhaFreq(alunoId, hist, licoes, vivo) {
  if (!licoes || !licoes.length) return '';
  hist = hist || {};
  var pres = 0, tot = 0;
  var segs = licoes.map(function (n) {
    var est = Object.prototype.hasOwnProperty.call(hist, n) ? (hist[n] ? 'p' : 'a') : 'v';
    var atual = vivo && n === vivo.licao;
    if (atual) est = vivo.presente ? 'p' : (vivo.lancada ? 'a' : 'v');
    if (est !== 'v') tot++;
    if (est === 'p') pres++;
    var tip = 'Lição ' + n + ' — ' + (est === 'p' ? 'Presente' : est === 'a' ? 'Ausente' : 'Sem registro');
    return '<span class="edm-tl-seg' + (atual ? ' cur' : '') + '" title="' + tip + '"><small>' + n + '</small><i class="edm-tl-dot ' + est + '">' + (est === 'p' ? '✓' : est === 'a' ? '✕' : '') + '</i></span>';
  }).join('');
  var pct = tot ? Math.round(pres * 100 / tot) : 0; // % sobre as lições já registradas, não sobre as futuras
  var cor = pct >= 75 ? 'var(--success)' : pct >= 50 ? 'var(--gold)' : 'var(--danger)';
  return '<div class="edm-tl"><div class="edm-tl-track">' + segs + '</div><div class="edm-tl-stat"><b>' + pres + '</b>/' + tot + ' · <b>' + pct + '%</b></div></div>' +
    '<div class="edm-tl-bar"><i style="width:' + pct + '%;background:' + cor + '"></i></div>';
}
function _edmTimeline(a) {

      EDM.aulas = _edmOrdenarAulas((r.data && r.data.aulas) || []);
      if (!EDM.relAulaId || !EDM.aulas.some(function (a) { return a.ID === EDM.relAulaId; })) EDM.relAulaId = EDM.aulas.length ? EDM.aulas[0].ID : '';
      edmCarregarRelAula();
    })
    .ed_getDadosIniciais(App.session.token, ['aulas']);
}
function edmCarregarRelAula() {
  if (!EDM.relAulaId) { EDM.rel = null; edmRenderRelatorios(); return; }
  google.script.run
    .withFailureHandler(function (e) { showToast((e && e.message) || 'Erro ao carregar o relatório.', 'error'); })
    .withSuccessHandler(function (r) { if (!_edmResp(r, 'relatorioAula')) return; EDM.rel = r.data; edmRenderRelatorios(); })
    .ed_getRelatorioAula(App.session.token, EDM.relAulaId);
}
function edmRelTrocarAula(v) { EDM.relAulaId = v; edmCarregarRelAula(); }
function edmRenderRelatorios() {
  var painel = document.getElementById('edm-panel'); if (!painel || EDM.tela !== 'relatorios') return;
  var sub = document.getElementById('edm-sub'), rel = EDM.rel;
  if (sub) sub.textContent = rel ? _edmRotuloAulaRel(rel.aula) : 'Selecione uma aula';
  var opt = EDM.aulas.map(function (a) { return '<option value="' + _edmEsc(a.ID) + '"' + (a.ID === EDM.relAulaId ? ' selected' : '') + '>' + _edmEsc(_edmRotuloAula(a) + ' (' + a.Trimestre + 'º tri)') + '</option>'; }).join('');
  var h = '<div class="field"><label for="edm-rel-aula">Aula</label><select id="edm-rel-aula" onchange="edmRelTrocarAula(this.value)">' + (opt || '<option value="">Sem aulas</option>') + '</select></div>';
  if (!rel) { painel.innerHTML = h + '<div class="edm-vazio">Nenhuma aula cadastrada ainda.</div>'; return; }
  h += '<div class="edm-sec"><span>Por turma</span></div>' + (rel.turmas.length ? rel.turmas.map(function (t) {
    return _edmCardTurmaRel(t, rel.modo).replace(/<\/div>$/, t.lancada ? '<div class="edm-rel-acoes"><button class="btn btn-secondary btn-sm" onclick="edmCompartilhar(\'turma\',\'' + _edmEsc(t.classeId) + '\')"><i data-lucide="share-2" class="ic-16"></i> Compartilhar</button></div></div>' : '</div>');
  }).join('') : '<div class="edm-vazio">Nenhuma turma cadastrada.</div>');
  if (rel.turmas.length > 1 || rel.geral.turmasLancadas) {
    var g = rel.geral;
    h += '<div class="edm-sec"><span>Relatório geral da aula</span></div><div class="edm-rel edm-rel-geral"><h4>Todas as turmas</h4><span class="edm-meta">' + g.turmasLancadas + ' de ' + rel.totalTurmas + (rel.totalTurmas === 1 ? ' turma' : ' turmas') + ' com chamada lançada</span>' + _edmBlocoRel(g, rel.modo);
    var aprov = rel.turmas.filter(function (t) { return t.lancada; }).sort(function (a, b) { return b.percentual - a.percentual; });
    if (aprov.length) {
      h += '<div class="edm-sec" style="margin-bottom:var(--sp-1)"><span style="font-size:var(--fs-sm)">Aproveitamento por turma</span></div>' + aprov.map(function (t) {
        return '<div class="edm-pct"><span>' + _edmEsc(t.nome) + '</span><b class="edm-pct-' + _edmCorPct(t.percentual) + '">' + t.percentual + '%</b></div><div class="edm-pct-bar"><i class="edm-pct-' + _edmCorPct(t.percentual) + '" style="width:' + t.percentual + '%"></i></div>';
      }).join('');
    }
    h += '<div class="edm-rel-acoes"><button class="btn btn-secondary btn-sm" onclick="edmCompartilhar(\'geral\')"><i data-lucide="share-2" class="ic-16"></i> Compartilhar resumo geral</button></div></div>';
  }
  painel.innerHTML = h;
  if (window.lucide) lucide.createIcons();
}

// Depois de salvar a chamada: relatório da turma (e atalho para o geral da aula)
function edmRelatorioPosSalvar() {
  var aulaId = EDM.aulaId, classeId = EDM.classeId;
  google.script.run
    .withFailureHandler(function () {})
    .withSuccessHandler(function (r) {
      if (!r || !r.success) return;
      EDM.rel = r.data; EDM.relAulaId = aulaId;
      var t = r.data.turmas.filter(function (x) { return x.classeId === classeId; })[0]; if (!t) return;
      document.getElementById('edm-form-titulo').textContent = 'Chamada salva · ' + t.nome;
      document.getElementById('edm-form-corpo').innerHTML = '<span class="edm-meta" style="margin-bottom:var(--sp-3);white-space:normal">' + _edmEsc(_edmRotuloAulaRel(r.data.aula)) + '</span>' + _edmBlocoRel(t, r.data.modo);
      document.getElementById('edm-form-rodape').innerHTML = '<div class="edm-form-btns" style="flex-wrap:wrap">' +
        '<button class="btn btn-secondary" onclick="edmCompartilhar(\'turma\',\'' + _edmEsc(classeId) + '\')"><i data-lucide="share-2" class="ic-16"></i> Compartilhar</button>' +
        '<button class="btn btn-secondary" onclick="edmFecharModal(\'modal-edm-form\');edmIr(\'relatorios\')">Relatório geral</button>' +
        '<button class="btn btn-primary" onclick="edmFecharModal(\'modal-edm-form\')">Fechar</button></div>';
      edmAbrirModal('modal-edm-form');
      if (window.lucide) lucide.createIcons();
    })
    .ed_getRelatorioAula(App.session.token, aulaId);
}
</script>
