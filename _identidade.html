<style>
/* IDENTIDADE — só o que é específico da tela; a estrutura vem do Layout System (.page, .panel, .form-grid, .action-bar) */
.idt-marca {
  display: flex; align-items: center; gap: 14px; padding: 16px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 14px;
}
.idt-marca .brand-mark { width: 56px; height: 56px; font-size: 20px; flex-shrink: 0; }
.idt-marca-nome { font-size: 17px; font-weight: 800; color: var(--text); line-height: 1.2; }
.idt-marca-lema { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.idt-ajuda { font-size: 11px; color: var(--text-dim); line-height: 1.4; }

.idt-cor-bloco { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
.idt-cor-botao {
  position: relative; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px 8px 8px;
  background: var(--bg3); border: 1.5px solid var(--border-strong); border-radius: var(--radius-md, 14px); cursor: pointer;
}
.idt-cor-botao input[type="color"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.idt-cor-amostra { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; background: var(--teal); box-shadow: 0 0 0 1px var(--border) inset; }
.idt-cor-texto { flex: 1; font-size: 15px; font-weight: 700; color: var(--text); }
.idt-cor-botao svg { flex-shrink: 0; color: var(--text-muted); }
.idt-cor-hex { text-transform: uppercase; }
.idt-recentes-rotulo { font-size: 12px; font-weight: 700; color: var(--text-muted); margin: 0 0 8px; }
.idt-recentes { display: flex; flex-wrap: wrap; gap: 10px; }
.idt-recente { width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer; box-shadow: 0 0 0 1px var(--border); }
.idt-recente.sel { border-color: var(--text); }

.idt-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 16px; }
.idt-card { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.idt-card h3 { font-size: 13px; font-weight: 700; color: var(--text); margin: 0; }
.idt-card p { font-size: 12px; color: var(--text-muted); margin: 0; line-height: 1.45; }
.idt-imagem {
  height: 120px; border-radius: var(--radius-sm); border: 1px dashed var(--border-strong);
  background: linear-gradient(135deg, var(--teal-dark), var(--teal));
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.idt-imagem img { max-width: 100%; max-height: 100%; object-fit: contain; padding: 8px; box-sizing: border-box; }
.idt-imagem span { font-size: 12px; color: #fff; opacity: .8; }
.idt-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.idt-acoes .btn { flex: 1 1 auto; }
.idt-dica { margin: 0 0 16px; font-size: 12px; color: var(--text-muted); line-height: 1.55; }
</style>

<script>
// ── Tela de Identidade ─────────────────────────────────────
var IDT_IMAGENS = [
  { tipo: 'logo',       campo: 'logoUrl',    titulo: 'Logo',        dica: 'Login, menu, topo e carteirinha. Prefira PNG transparente e claro (branco).', maxDim: 512 },
  { tipo: 'marcaDagua', campo: 'marcaDagua', titulo: 'Marca d\'água', dica: 'Fundo suave da carteirinha (opcional).', maxDim: 800 },
  { tipo: 'assinatura', campo: 'assinatura', titulo: 'Assinatura',  dica: 'Assinatura do pastor, no verso da carteirinha (opcional).', maxDim: 500 }
];
var IDT_MAX_BYTES = 95000; // o servidor aceita até 100 KB

// campo da tela → [chave na Config, rótulo, tipo, ajuda]
var IDT_CAMPOS = {
  nome:        ['NOME_IGREJA',     'Nome da igreja',   'text', ''],
  nomeCurto:   ['NOME_CURTO',      'Nome curto',       'text', 'Opcional. Usado onde há pouco espaço.'],
  lema:        ['LEMA_IGREJA',     'Lema ou versículo','text', 'Opcional. Aparece no topo da tela inicial.'],
  pastor:      ['PASTOR',          'Pastor presidente','text', 'Sem nome, a carteirinha não imprime o nome (só a assinatura, se houver).'],
  cargoPastor: ['CARGO_PASTOR',    'Cargo',            'text', ''],
  endereco:    ['ENDERECO_IGREJA', 'Endereço da sede', 'text', 'Rodapé da carteirinha. Opcional.'],
  cnpj:        ['CNPJ_IGREJA',     'CNPJ',             'text', 'Rodapé da carteirinha. Opcional.'],
  pastaFotos:  ['PASTA_FOTOS',     'Pasta das fotos no Drive', 'text', 'As novas fotos de membros vão para esta pasta (criada sozinha). Fotos já salvas continuam onde estão.']
};
var IDT_RECENTES_MAX = 6;
var IDT = { orig: {}, draft: {} };

function _idtValoresSalvos() {
  var v = {};
  Object.keys(IDT_CAMPOS).forEach(function (k) { v[k] = IDENTIDADE[k] || ''; });
  if (v.nomeCurto === v.nome) v.nomeCurto = '';   // nome curto vazio = igual ao nome
  v.corPrimaria = IDENTIDADE.corPrimaria || '';
  return v;
}

function renderIdentidade() {
  if (!App.session) { navigateTo('login'); return; }
  IDT.orig = _idtValoresSalvos();
  IDT.draft = JSON.parse(JSON.stringify(IDT.rascunho || IDT.orig));
  IDT.rascunho = null;
  renderView(
    moduleBarHtml('Identidade', ['Marca']) +
    '<div class="page page-narrow">' +
      '<div class="page-head"><h1 class="page-title">Identidade da igreja</h1>' +
      '<p class="page-sub">Tudo o que personaliza o sistema fica aqui: nome, cor, imagens e dados da carteirinha.</p></div>' +
      '<div class="idt-marca"><span class="brand-mark" id="idt-marca-logo"></span><div><div class="idt-marca-nome" id="idt-marca-nome"></div><div class="idt-marca-lema" id="idt-marca-lema"></div></div></div>' +

      _idtSecao('Dados da igreja', 'Aparecem no login, no menu, no topo e nos e-mails do sistema.', _idtCampo('nome', true) + _idtCampo('nomeCurto') + _idtCampo('lema', true)) +

      _idtSecao('Cor da marca', 'Muda botões, destaques e menus em todo o sistema. Veja o resultado na hora e salve quando gostar.',
        '<div class="idt-cor-bloco">' +
          '<label class="idt-cor-botao" id="idt-cor-botao"><span class="idt-cor-amostra" id="idt-cor-amostra"></span>' +
            '<span class="idt-cor-texto">Escolher cor</span>' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>' +
            '<input type="color" id="idt-cor-picker" oninput="idtCor(this.value)" aria-label="Escolher cor da marca"></label>' +
          '<div class="field" style="margin:0"><label for="idt-cor-hex">Ou digite o código da cor</label>' +
            '<input type="text" class="idt-cor-hex" id="idt-cor-hex" maxlength="7" placeholder="#RRGGBB" autocomplete="off" oninput="idtCorTexto(this.value)"></div>' +
          '<div><button type="button" class="btn btn-ghost btn-sm" id="idt-cor-padrao" onclick="idtCor(\'\')">Usar cor padrão</button></div>' +
          _idtRecentesHtml() +
        '</div>') +

      _idtSecao('Imagens', 'Envie direto do seu aparelho. Ficam guardadas na própria planilha e são reduzidas automaticamente (até 100 KB).',
        '<div class="idt-grade">' + IDT_IMAGENS.map(_idtCartaoImagem).join('') + '</div>') +

      _idtSecao('Carteirinha', 'Dados impressos na carteirinha de membro. O que ficar em branco não é impresso.',
        _idtCampo('pastor') + _idtCampo('cargoPastor') + _idtCampo('endereco', true) + _idtCampo('cnpj')) +

      _idtSecao('Fotos dos membros', 'Onde as fotos novas são guardadas no Google Drive.', _idtCampo('pastaFotos', true)) +

      '<div class="action-bar">' +
        '<span class="action-bar-status" id="idt-estado">Tudo salvo</span>' +
        '<span class="action-bar-btns">' +
          '<button class="btn btn-ghost btn-sm" id="idt-descartar" onclick="idtDescartar()" disabled>Descartar</button>' +
          '<button class="btn btn-primary btn-sm" id="idt-salvar" onclick="idtSalvar()" disabled>Salvar alterações</button>' +
        '</span>' +
      '</div>' +
    '</div>'
  );
  _idtAtualizarTela();
}

function _idtSecao(titulo, texto, corpo) {
  return '<section class="panel"><h2 class="panel-title">' + titulo + '</h2><p class="panel-text">' + texto + '</p>' + (corpo.indexOf('idt-grade') === -1 && corpo.indexOf('idt-cor-bloco') === -1 ? '<div class="form-grid">' + corpo + '</div>' : corpo) + '</section>';
}

function _idtCampo(k, largo) {
  var d = IDT_CAMPOS[k];
  return '<div class="field' + (largo ? ' span-all' : '') + '"><label for="idt-' + k + '">' + d[1] + '</label>' +
    '<input type="text" id="idt-' + k + '" value="' + escHtml(IDT.draft[k] || '') + '" autocomplete="off" oninput="idtDigitou(\'' + k + '\', this.value)">' +
    (d[3] ? '<span class="idt-ajuda">' + d[3] + '</span>' : '') + '</div>';
}

function _idtCartaoImagem(t) {
  var src = IDENTIDADE[t.campo] || '';
  return '<div class="idt-card" id="idt-' + t.tipo + '">' +
    '<h3>' + t.titulo + '</h3><p>' + t.dica + '</p>' +
    '<div class="idt-imagem" id="idt-previa-' + t.tipo + '">' + (src ? '<img alt="" src="' + escHtml(src) + '">' : '<span>Sem imagem</span>') + '</div>' +
    '<div class="idt-acoes">' +
      '<label class="btn btn-secondary btn-sm" id="idt-escolher-' + t.tipo + '" style="cursor:pointer">' +
        '<span id="idt-rotulo-' + t.tipo + '">' + (src ? 'Trocar imagem' : 'Enviar imagem') + '</span>' +
        '<input type="file" accept="image/png,image/jpeg,image/webp" style="display:none" id="idt-arq-' + t.tipo + '" onchange="idtEscolher(\'' + t.tipo + '\', this)">' +
      '</label>' +
      (src ? '<button class="btn btn-ghost btn-sm" id="idt-remover-' + t.tipo + '" onclick="idtRemover(\'' + t.tipo + '\')">Remover</button>' : '') +
    '</div></div>';
}

// Cores recentes: só as que a igreja já salvou, guardadas neste aparelho
function _idtRecentes() {
  try { var r = JSON.parse(localStorage.getItem('idt_cores_recentes') || '[]'); return Array.isArray(r) ? r.filter(function (c) { return /^#[0-9A-F]{6}$/.test(c); }) : []; } catch (e) { return []; }
}
function _idtLembrarCor(hex) {
  if (!hex) return;
  hex = hex.toUpperCase();
  var r = [hex].concat(_idtRecentes().filter(function (c) { return c !== hex; })).slice(0, IDT_RECENTES_MAX);
  try { localStorage.setItem('idt_cores_recentes', JSON.stringify(r)); } catch (e) {}
}
function _idtRecentesHtml() {
  var r = _idtRecentes();
  if (!r.length) return '';
  return '<div><p class="idt-recentes-rotulo">Cores recentes</p><div class="idt-recentes">' +
    r.map(function (c) { return '<button type="button" class="idt-recente" data-cor="' + c + '" style="background:' + c + '" aria-label="Cor ' + c + '" onclick="idtCor(\'' + c + '\')"></button>'; }).join('') +
    '</div></div>';
}

// ── Edição de textos e cor ─────────────────────────────────
function idtDigitou(k, valor) { IDT.draft[k] = valor; _idtAtualizarTela(); }

function idtCor(hex) {
  IDT.draft.corPrimaria = hex;
  _idtPreviaCor();
  _idtAtualizarTela();
}
function idtCorTexto(v) {
  v = v.trim();
  if (/^[0-9a-fA-F]{6}$/.test(v)) v = '#' + v;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) idtCor(v.toUpperCase());
}
function _idtPreviaCor() {
  IDENTIDADE.corPrimaria = IDT.draft.corPrimaria;   // prévia: o salvo volta em idtSair/idtDescartar
  aplicarIdentidade();
}

function _idtSujo() {
  return Object.keys(IDT.draft).some(function (k) { return (IDT.draft[k] || '').trim() !== (IDT.orig[k] || ''); });
}

function _idtAtualizarTela() {
  var d = IDT.draft, sujo = _idtSujo();
  var nome = (d.nome || '').trim() || 'Nome da igreja';
  var el = document.getElementById('idt-marca-nome'); if (el) el.textContent = nome;
  el = document.getElementById('idt-marca-lema'); if (el) el.textContent = (d.lema || '').trim();
  el = document.getElementById('idt-marca-logo');
  if (el) el.innerHTML = '<span>' + escHtml(iniciaisIgreja((d.nomeCurto || '').trim() || nome)) + '</span>' +
    (IDENTIDADE.logoUrl ? '<img src="' + escHtml(IDENTIDADE.logoUrl) + '" alt="" onload="this.previousElementSibling.style.visibility=\'hidden\'" onerror="this.style.display=\'none\'">' : '');
  var cor = (d.corPrimaria || '').toUpperCase();
  document.querySelectorAll('.idt-recente').forEach(function (b) { b.classList.toggle('sel', b.getAttribute('data-cor') === cor); });
  var amostra = document.getElementById('idt-cor-amostra'); if (amostra) amostra.style.background = cor || 'var(--teal)';
  var picker = document.getElementById('idt-cor-picker'); if (picker && cor) picker.value = cor.toLowerCase();
  var hex = document.getElementById('idt-cor-hex'); if (hex && document.activeElement !== hex) hex.value = cor;
  el = document.getElementById('idt-estado');
  if (el) { el.textContent = sujo ? 'Alterações não salvas' : 'Tudo salvo'; el.classList.toggle('pendente', sujo); }
  ['idt-salvar', 'idt-descartar'].forEach(function (id) { var b = document.getElementById(id); if (b) b.disabled = !sujo; });
}

function idtDescartar() {
  IDENTIDADE.corPrimaria = IDT.orig.corPrimaria;
  aplicarIdentidade();
  renderIdentidade();
}

// Ao sair da tela sem salvar, a cor volta para a que está salva
function idtSair() {
  if (IDENTIDADE.corPrimaria !== (IDT.orig.corPrimaria || '')) { IDENTIDADE.corPrimaria = IDT.orig.corPrimaria || ''; aplicarIdentidade(); }
}

function idtSalvar() {
  var envio = {};
  Object.keys(IDT.draft).forEach(function (k) {
    var v = (IDT.draft[k] || '').trim();
    if (v === (IDT.orig[k] || '')) return;
    envio[k === 'corPrimaria' ? 'COR_PRIMARIA' : IDT_CAMPOS[k][0]] = v;
  });
  if (!Object.keys(envio).length) return;
  var btn = document.getElementById('idt-salvar'); if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
  google.script.run
    .withFailureHandler(function () { _idtSalvarFim(); showToast('Falha de conexão. Tente novamente.', 'error'); })
    .withSuccessHandler(function (res) {
      if (res && res.success) { if (envio.COR_PRIMARIA) _idtLembrarCor(envio.COR_PRIMARIA); _idtAtualizar(res.data); showToast('Alterações salvas.', 'success'); }
      else { _idtSalvarFim(); showToast((res && res.error) || 'Não foi possível salvar.', 'error'); }
    })
    .idt_salvarAjustes(App.session.token, envio);
}
function _idtSalvarFim() {
  var btn = document.getElementById('idt-salvar'); if (btn) btn.textContent = 'Salvar alterações';
  _idtAtualizarTela();
}

// ── Imagens ────────────────────────────────────────────────
// Reduz a imagem no navegador (PNG, mantém a transparência) até caber no limite
function _idtReduzir(arquivo, maxDim) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(arquivo);
    var img = new Image();
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Não foi possível ler essa imagem.')); };
    img.onload = function () {
      URL.revokeObjectURL(url);
      var escala = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      var tentativa = 0;
      (function gerar() {
        var w = Math.max(1, Math.round(img.naturalWidth * escala)), h = Math.max(1, Math.round(img.naturalHeight * escala));
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(function (blob) {
          if (!blob) { reject(new Error('Não foi possível processar essa imagem.')); return; }
          if (blob.size > IDT_MAX_BYTES && tentativa < 8) { tentativa++; escala *= 0.8; gerar(); return; }
          if (blob.size > IDT_MAX_BYTES) { reject(new Error('Imagem complexa demais. Tente uma versão mais simples.')); return; }
          var fr = new FileReader();
          fr.onload = function () { resolve(String(fr.result).split(',')[1]); };
          fr.onerror = function () { reject(new Error('Não foi possível ler essa imagem.')); };
          fr.readAsDataURL(blob);
        }, 'image/png');
      })();
    };
    img.src = url;
  });
}

function _idtCampoImagem(tipo) { return IDT_IMAGENS.filter(function (t) { return t.tipo === tipo; })[0].campo; }

function _idtOcupado(tipo, ocupado) {
  var rot = document.getElementById('idt-rotulo-' + tipo);
  if (rot) rot.textContent = ocupado ? 'Enviando...' : (IDENTIDADE[_idtCampoImagem(tipo)] ? 'Trocar imagem' : 'Enviar imagem');
  var lbl = document.getElementById('idt-escolher-' + tipo);
  if (lbl) lbl.style.pointerEvents = ocupado ? 'none' : '';
}

// Depois de enviar/remover/salvar: atualiza a identidade em memória, o cabeçalho e a tela
function _idtAtualizar(dados) {
  Object.keys(dados).forEach(function (k) { IDENTIDADE[k] = dados[k]; });
  aplicarIdentidade();
  if (App.currentView === 'identidade') renderIdentidade(); else renderNav(true);
}

function idtEscolher(tipo, input) {
  var arquivo = input.files && input.files[0];
  input.value = '';
  if (!arquivo) return;
  var t = IDT_IMAGENS.filter(function (x) { return x.tipo === tipo; })[0];
  _idtOcupado(tipo, true);
  _idtReduzir(arquivo, t.maxDim).then(function (b64) {
    google.script.run
      .withFailureHandler(function () { _idtOcupado(tipo, false); showToast('Falha de conexão. Tente novamente.', 'error'); })
      .withSuccessHandler(function (res) {
        if (res && res.success) { _idtGuardarRascunho(); _idtAtualizar(res.data); showToast('Imagem salva.', 'success'); }
        else { _idtOcupado(tipo, false); showToast((res && res.error) || 'Não foi possível salvar a imagem.', 'error'); }
      })
      .idt_enviarImagem(App.session.token, tipo, b64);
  }).catch(function (e) { _idtOcupado(tipo, false); showToast(e.message, 'error'); });
}

function idtRemover(tipo) {
  google.script.run
    .withFailureHandler(function () { showToast('Falha de conexão. Tente novamente.', 'error'); })
    .withSuccessHandler(function (res) {
      if (res && res.success) { _idtGuardarRascunho(); _idtAtualizar(res.data); showToast('Imagem removida.', 'success'); }
      else showToast((res && res.error) || 'Não foi possível remover a imagem.', 'error');
    })
    .idt_removerImagem(App.session.token, tipo);
}

// Enviar/remover imagem redesenha a tela: o que já foi digitado (e ainda não salvo) não se perde
function _idtGuardarRascunho() {
  IDT.rascunho = JSON.parse(JSON.stringify(IDT.draft));
}
</script>
