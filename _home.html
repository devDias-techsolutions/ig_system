<style>
/* ══════════════════════════════════════════════════
   HOME · cabeçalho da igreja + indicadores + módulos + atividade
   Usa só os tokens do shell (cores, --sp-*, --fs-*). Nada de cor fixa:
   a paleta da igreja (aba Config) chega pelas variáveis --teal*.
══════════════════════════════════════════════════ */

/* ── Entrada suave, escalonada ── */
.hm-rise { opacity: 0; transform: translateY(12px); animation: hmRise .55s var(--ease-spring) forwards; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes hmRise { to { opacity: 1; transform: translateY(0); } }

/* ── Cabeçalho de identidade ── */
.hm-head {
  margin-bottom: var(--sp-5);
  position: relative; overflow: hidden; padding: var(--sp-5);
  border: 1px solid var(--border); border-radius: var(--radius-xl);
  background: linear-gradient(135deg, var(--teal-dim) 0%, transparent 58%), var(--bg-glass);
}
[data-theme="light"] .hm-head {
  background: linear-gradient(135deg, var(--teal-dim) 0%, transparent 58%), #FFFFFF;
  box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 12px 28px -16px rgba(15, 23, 42, .12);
}
.hm-head::after {
  content: ''; position: absolute; right: -90px; top: -90px; width: 280px; height: 280px; border-radius: 50%;
  background: radial-gradient(circle, var(--teal-glow-soft), transparent 66%); pointer-events: none;
}
.hm-id { position: relative; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); }
.hm-id-txt { min-width: 0; }
.hm-greet { font-size: clamp(24px, 4.4vw, 34px); font-weight: 800; letter-spacing: -.035em; line-height: 1.1; color: var(--text); overflow-wrap: anywhere; }
.hm-title { margin-top: var(--sp-2); font-size: var(--fs-md); font-weight: 600; letter-spacing: -.01em; line-height: 1.3; color: var(--text-muted); overflow-wrap: anywhere; }
/* perfil: pílula com ponto vivo, no canto do cabeçalho */
.hm-role {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 100px;
  font-size: var(--fs-xs); font-weight: 800; letter-spacing: .02em; color: var(--teal-dark);
  background: var(--teal-dim); border: 1px solid var(--teal-border); box-shadow: 0 6px 18px -8px var(--teal-glow);
}
[data-theme="dark"] .hm-role, :root:not([data-theme="light"]) .hm-role { color: var(--teal-light); }
.hm-role-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); animation: livePing 2.4s ease-out infinite; }
@media (max-width: 480px) { .hm-id { flex-direction: column-reverse; align-items: flex-start; gap: var(--sp-3); } }
.hm-lema { margin-top: var(--sp-2); padding-left: var(--sp-3); border-left: 2px solid var(--teal); font-size: var(--fs-sm); font-style: italic; line-height: 1.5; color: var(--text-muted); }
.hm-sub {
  position: relative; z-index: 1; margin-top: var(--sp-4); padding-top: var(--sp-4); border-top: 1px solid var(--border);
  font-size: var(--fs-sm); color: var(--text-muted); line-height: 1.6;
}
.hm-sub b { color: var(--text); font-weight: 700; }

/* ── Títulos de seção ── */


/* ── Colunas: módulos | atividade ── */
.hm-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 var(--sp-5); margin-top: var(--sp-5); }
@media (min-width: 1100px) { .hm-cols.com-atividade { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); } }

/* ── Módulos ── */
.hm-mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--sp-3); }
.hm-mod {
  position: relative; overflow: hidden; isolation: isolate; display: flex; align-items: center; gap: var(--sp-3); width: 100%; text-align: left;
  padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-glass);
  color: inherit; font-family: inherit; cursor: pointer;
  transition: transform .28s var(--ease-spring), border-color .2s var(--ease), box-shadow .28s var(--ease), background .2s var(--ease);
}
[data-theme="light"] .hm-mod { background: #FFFFFF; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
.hm-mod:hover { transform: translateY(-4px); border-color: var(--teal-border); box-shadow: 0 22px 40px -20px var(--teal-glow); }
.hm-mod:active { transform: translateY(-1px) scale(.99); }
.hm-mod:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.hm-mod-icon { width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0; display: grid; place-items: center; background: var(--teal-dim); color: var(--teal); }
.hm-mod-icon i { width: 22px; height: 22px; }
.hm-mod-txt { flex: 1; min-width: 0; }
.hm-mod-name { font-size: var(--fs-md); font-weight: 800; letter-spacing: -.02em; color: var(--text); }
.hm-mod-desc { margin-top: 2px; font-size: var(--fs-xs); color: var(--text-muted); line-height: 1.4; }
.hm-mod-go { width: 16px; height: 16px; color: var(--text-dim); flex-shrink: 0; transition: transform .25s var(--ease-spring), color .2s; }
.hm-mod:hover .hm-mod-go { transform: translateX(3px); color: var(--teal); }

/* ── Atividade ── */
.activity-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-glass); overflow: hidden; }
[data-theme="light"] .activity-list { background: #FFFFFF; }
.activity-item { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: none; }
.activity-icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; background: var(--teal-dim); color: var(--teal); }
.activity-icon i { width: 17px; height: 17px; }
.activity-body { flex: 1; min-width: 0; }
.activity-text { font-size: var(--fs-sm); font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity-time { margin-top: 2px; font-size: var(--fs-xs); color: var(--text-dim); }

/* ── Estados vazios / erro ── */
.hm-empty {
  grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-2);
  padding: var(--sp-6) var(--sp-5); border: 1px dashed var(--border2); border-radius: var(--radius-lg); background: var(--bg-glass);
}
[data-theme="light"] .hm-empty { background: #F8FAFC; }
.hm-empty-icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; margin-bottom: var(--sp-2); background: var(--teal-dim); color: var(--teal); }
.hm-empty.erro .hm-empty-icon { background: var(--danger-dim); color: var(--danger); }
.hm-empty-icon i { width: 24px; height: 24px; }
.hm-empty-title { font-size: var(--fs-md); font-weight: 800; color: var(--text); }
.hm-empty-desc { max-width: 340px; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-muted); }
.hm-empty .btn { margin-top: var(--sp-3); }

/* ── Esqueletos (mesmas medidas do conteúdo, sem "pulo" na troca) ── */
.kpi-card.is-loading { pointer-events: none; }
.kpi-card.is-loading:hover { transform: none; box-shadow: none; border-color: var(--border); }

@media (prefers-reduced-motion: reduce) {
  .hm-rise { animation: none; opacity: 1; transform: none; }
  .kpi-card, .hm-mod, .hm-mod-go { transition: none; }
  .kpi-card:hover, .hm-mod:hover { transform: none; }
}
</style>

<script>
// ═══════════════════════════════════════════════════
//  HOME — identidade da igreja, indicadores, módulos e atividade
//  O conteúdo muda conforme o perfil (HOME_PERFIL).
//  ES5 · sem crase · sem alert/confirm (avisos = toast/modal da plataforma)
// ═══════════════════════════════════════════════════

// O que cada perfil vê. Para um perfil novo, basta acrescentar uma linha aqui.
//   secoes: blocos exibidos · admin: mostra o bloco "Administração" (Usuários)
var HOME_PERFIL = {
  admin:      { visao: 'Visão geral da igreja', sub: 'Indicadores, módulos e administração do sistema.', secoes: ['kpis', 'modulos', 'atividade'], admin: true },
  secretaria: { visao: 'Seu espaço de trabalho', sub: 'Atalhos para os módulos que você utiliza.',         secoes: ['kpis', 'modulos'],              admin: false }
};
var HOME_PERFIL_PADRAO = { visao: 'Início', sub: 'Acesse os módulos liberados para você.', secoes: ['kpis', 'modulos'], admin: false };

function _homeTem(cfg, secao) { return cfg.secoes.indexOf(secao) !== -1; }

function _homeEstado(icone, titulo, desc, extra, erro) {
  return '<div class="hm-empty' + (erro ? ' erro' : '') + '">' +
    '<div class="hm-empty-icon"><i data-lucide="' + icone + '"></i></div>' +
    '<div class="hm-empty-title">' + titulo + '</div>' +
    '<div class="hm-empty-desc">' + desc + '</div>' + (extra || '') +
  '</div>';
}

function renderHome() {
  if (!App.session) { navigateTo('login'); return; }

  var perfil = App.session.perfil || '';
  var cfg    = HOME_PERFIL[perfil] || HOME_PERFIL_PADRAO;
  var nome   = String(App.session.nome || '').split(' ')[0];
  var hora   = new Date().getHours();
  var sauda  = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';
  var mods   = modulosDoPerfil(perfil);
  var podeUsuarios = cfg.admin && ROUTE_PERMISSIONS.usuarios.indexOf(perfil) !== -1;
  var comAtividade = _homeTem(cfg, 'atividade');
  var i = 0; // ordem da entrada escalonada

  /* ══ Cabeçalho de identidade (nome, logo, lema e cor vêm da aba Config) ══ */
  var html =
    '<div class="page hm">' +
    '<header class="hm-head hm-rise" style="--i:' + (i++) + '">' +
      '<div class="hm-id">' +
        '<div class="hm-id-txt">' +
          '<div class="hm-greet">' + sauda + (nome ? ', ' + escHtml(nome) : '') + '</div>' +
          '<h1 class="hm-title">' + escHtml(IDENTIDADE.nome) + '</h1>' +
          (IDENTIDADE.lema ? '<p class="hm-lema">' + escHtml(IDENTIDADE.lema) + '</p>' : '') +
        '</div>' +
        '<span class="hm-role"><span class="hm-role-dot"></span>' + escHtml(PERFIL_LABEL[perfil] || perfil) + '</span>' +
      '</div>' +
      '<p class="hm-sub"><b>' + cfg.visao + '</b> · ' + cfg.sub + '</p>' +
    '</header>';

  /* ══ Indicadores ══ */
  if (_homeTem(cfg, 'kpis')) {
    html +=
      '<section class="panel hm-rise" style="--i:' + (i++) + '">' +
        '<div class="panel-head"><h2 class="panel-title">Indicadores</h2></div>' +
        '<div class="kpi-groups" id="kpi-grid">' + _kpiSkeleton() + _kpiSkeleton() + '</div>' +
      '</section>';
  }

  /* ══ Módulos (+ Administração) | Atividade ══ */
  html += '<div class="hm-cols' + (comAtividade ? ' com-atividade' : '') + '">';

  html += '<section class="panel hm-rise" style="--i:' + (i++) + '">' +
    '<div class="panel-head"><h2 class="panel-title">Módulos</h2></div>' +
    '<div class="hm-mods">' +
      (mods.length
        ? mods.map(function (m) { return _moduleBtn(m.icone, m.nome, m.descricao, m.rota); }).join('')
        : _homeEstado('layout-grid', 'Nenhum módulo disponível',
            perfil === 'admin'
              ? 'Ative módulos na aba <b>Config</b> da planilha (chave <b>MODULOS_ATIVOS</b>) ou instale um módulo.'
              : 'Peça ao administrador para liberar módulos para o seu perfil.')) +
    '</div>' +
    (podeUsuarios
      ? '<div class="panel-head"><h2 class="panel-title">Administração</h2></div>' +
        '<div class="hm-mods">' + _moduleBtn('shield-check', 'Usuários', 'Acessos, perfis e permissões', 'usuarios') + '</div>'
      : '') +
  '</section>';

  if (comAtividade) {
    html += '<section class="panel hm-rise" style="--i:' + (i++) + '">' +
      '<div class="panel-head"><h2 class="panel-title">Atividade recente</h2></div>' +
      '<div class="activity-list" id="activity-list">' + _activitySkeleton() + _activitySkeleton() + _activitySkeleton() + '</div>' +
    '</section>';
  }

  html += '</div></div>'; /* /hm-cols /hm */

  renderView(html);

  /* Fechar dropdown ao clicar fora (registrado uma única vez) */
  if (!window.__homeDocClick) {
    window.__homeDocClick = true;
    document.addEventListener('click', function (e) {
      var dd  = document.getElementById('user-dropdown');
      var btn = document.getElementById('avatar-btn');
      if (dd && btn && !btn.contains(e.target) && !dd.contains(e.target)) dd.classList.remove('open');
    });
  }

  if (_homeTem(cfg, 'kpis')) _loadKpis();
  if (comAtividade) _loadActivity();
}

/* ── HELPERS ── */
function _kpiSkeleton() {
  return '<div class="kpi-group is-loading">' +
    '<div class="skeleton" style="width:50%;height:22px;border-radius:6px"></div>' +
    '<div class="skeleton" style="width:35%;height:12px;border-radius:4px;margin-top:8px"></div>' +
    '<div class="skeleton" style="width:100%;height:84px;border-radius:16px;margin-top:16px"></div>' +
  '</div>';
}

/* Agrupa os indicadores do servidor por tela de destino (um cartão mestre por assunto).
   Os que não têm destino ficam como cartões soltos. */
var HOME_GRUPOS = {
  membros:  { titulo: 'Membros',  sub: 'Cadastro da igreja', icone: 'users',        cor: 'kc-teal' },
  usuarios: { titulo: 'Usuários', sub: 'Acesso ao sistema',  icone: 'shield-check', cor: 'kc-green' }
};
var HOME_DOT = { Ativos: 'ok', Inativos: 'bad' };
function _kpiHtml(d) {
  var ordem = [], porDestino = {}, soltos = '';
  d.forEach(function (k) {
    if (!k.destino) { soltos += _kpiCard(k.icone, k.cor, k.valor || 0, k.rotulo, k.curto); return; }
    if (!porDestino[k.destino]) { porDestino[k.destino] = []; ordem.push(k.destino); }
    porDestino[k.destino].push(k);
  });
  var html = ordem.map(function (dest) {
    var itens = porDestino[dest];
    var meta = HOME_GRUPOS[dest] || { titulo: itens[0].curto, sub: '', icone: itens[0].icone, cor: itens[0].cor };
    return _kpiGroup({
      cor: meta.cor, icone: meta.icone, titulo: meta.titulo, sub: meta.sub, destino: dest,
      stats: itens.filter(function (k) { return !k.alerta; }).map(function (k) {
        return { label: k.dentro || k.curto, valor: k.valor || 0, dot: HOME_DOT[k.curto] || '' };
      }),
      alertas: itens.filter(function (k) { return k.alerta; }).map(function (k) {
        return { icone: k.icone === 'camera' ? 'image-off' : k.icone, valor: k.valor || 0, texto: String(k.curto).toLowerCase() };
      })
    });
  }).join('');
  return html + (soltos ? '<div class="kpi-grid" style="grid-column:1/-1">' + soltos + '</div>' : '');
}

function _activitySkeleton() {
  return '<div class="activity-item">' +
    '<div class="skeleton" style="width:36px;height:36px;border-radius:50%;flex-shrink:0"></div>' +
    '<div class="activity-body">' +
      '<div class="skeleton" style="width:70%;height:13px;margin-bottom:6px"></div>' +
      '<div class="skeleton" style="width:35%;height:11px"></div>' +
    '</div>' +
  '</div>';
}


function _moduleBtn(icon, name, desc, view) {
  return '<button class="hm-mod" onclick="navigateTo(\'' + view + '\')">' +
    '<div class="hm-mod-icon"><i data-lucide="' + escHtml(icon) + '"></i></div>' +
    '<div class="hm-mod-txt">' +
      '<div class="hm-mod-name">' + escHtml(name) + '</div>' +
      (desc ? '<div class="hm-mod-desc">' + escHtml(desc) + '</div>' : '') +
    '</div>' +
    '<i data-lucide="' + escHtml(icon) + '" class="card-ghost" aria-hidden="true"></i>' +
    '<i data-lucide="arrow-right" class="hm-mod-go"></i>' +
  '</button>';
}

function _homeRetry(fn) {
  return '<button class="btn btn-ghost btn-sm" onclick="' + fn + '()"><i data-lucide="refresh-cw" class="ic-14"></i> Tentar de novo</button>';
}

function _loadKpis() {
  function mostrar(html) {
    var grid = document.getElementById('kpi-grid');
    if (!grid) return;
    grid.innerHTML = html;
    if (window.lucide) setTimeout(function () { lucide.createIcons(); }, 0);
  }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        mostrar(_homeEstado('alert-triangle', 'Não foi possível carregar os indicadores',
          (res && res.error) ? escHtml(res.error) : 'Tente novamente em instantes.', _homeRetry('_homeRecarregarKpis'), true));
        return;
      }
      var d = res.data || [];
      if (!d.length) {
        mostrar(_homeEstado('bar-chart-3', 'Sem indicadores por enquanto',
          'Quando houver módulos com dados para o seu perfil, os números aparecem aqui.'));
        return;
      }
      mostrar(_kpiHtml(d));
    })
    .withFailureHandler(function () {
      mostrar(_homeEstado('wifi-off', 'Sem conexão com o servidor',
        'Verifique sua internet e tente novamente.', _homeRetry('_homeRecarregarKpis'), true));
    })
    .getKpisHome(App.session.token);
}
function _homeRecarregarKpis() {
  var grid = document.getElementById('kpi-grid');
  if (grid) grid.innerHTML = _kpiSkeleton() + _kpiSkeleton();
  _loadKpis();
}

function _loadActivity() {
  function mostrar(html, lista) {
    var el = document.getElementById('activity-list');
    if (!el) return;
    el.innerHTML = html;
    if (window.lucide) setTimeout(function () { lucide.createIcons(); }, 0);
  }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        mostrar(_homeEstado('alert-triangle', 'Não foi possível carregar a atividade',
          'Tente novamente em instantes.', _homeRetry('_homeRecarregarAtividade'), true));
        return;
      }
      if (!res.data || !res.data.length) {
        mostrar(_homeEstado('clipboard-list', 'Nenhuma atividade recente', 'As ações recentes aparecerão aqui.'));
        return;
      }
      mostrar(res.data.map(function (item) {
        return '<div class="activity-item">' +
          '<div class="activity-icon"><i data-lucide="' + escHtml(item.icon || 'file-text') + '"></i></div>' +
          '<div class="activity-body">' +
            '<div class="activity-text">' + escHtml(item.texto) + '</div>' +
            '<div class="activity-time">' + escHtml(item.tempo || '') + '</div>' +
          '</div>' +
        '</div>';
      }).join(''));
    })
    .withFailureHandler(function () {
      mostrar(_homeEstado('wifi-off', 'Sem conexão com o servidor',
        'Verifique sua internet e tente novamente.', _homeRetry('_homeRecarregarAtividade'), true));
    })
    .getAtividadeRecente(App.session.token);
}
function _homeRecarregarAtividade() {
  var el = document.getElementById('activity-list');
  if (el) el.innerHTML = _activitySkeleton() + _activitySkeleton() + _activitySkeleton();
  _loadActivity();
}

/* ── DROPDOWN ── */
function toggleUserDropdown() {
  var dd = document.getElementById('user-dropdown');
  if (dd) dd.classList.toggle('open');
}
function closeDropdown() {
  var dd = document.getElementById('user-dropdown');
  if (dd) dd.classList.remove('open');
}

function homeToggleNavCfg(e) {
  if (e) e.stopPropagation();
  var dd = document.getElementById('home-nav-cfg-dd');
  if (!dd) return;
  var opening = !dd.classList.contains('open');
  dd.classList.toggle('open');
  if (opening) {
    if (window.lucide) lucide.createIcons();
    setTimeout(function() {
      document.addEventListener('click', function _close(ev) {
        if (!dd.contains(ev.target)) {
          dd.classList.remove('open');
          document.removeEventListener('click', _close);
        }
      });
    }, 0);
  }
}

/* ── LOGOUT ── */
function handleLogout() {
  closeDropdown();
  if (!App.session) { navigateTo('login'); return; }
  google.script.run
    .withSuccessHandler(function() {
      clearSession();
      showToast('Sessão encerrada. Até logo!', 'info');
      navigateTo('login');
    })
    .withFailureHandler(function() {
      clearSession();
      navigateTo('login');
    })
    .logout(App.session.token);
}

/* ── MODAL TROCA DE SENHA ── */
function showTrocarSenha() {
  closeDropdown();
  var m = document.getElementById('modal-troca-senha');
  if (m) {
    m.classList.add('open');
    ['ts-atual','ts-nova','ts-confirma'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    var errBox = document.getElementById('ts-error');
    if (errBox) errBox.classList.remove('visible');
    if (window.lucide) lucide.createIcons();
  }
}
function closeModalTrocarSenha() {
  var m = document.getElementById('modal-troca-senha');
  if (m) m.classList.remove('open');
}

function tsCheckStrength() {
  var pwd   = document.getElementById('ts-nova').value;
  var fill  = document.getElementById('ts-strength-fill');
  var label = document.getElementById('ts-strength-label');
  var s     = getPasswordStrength(pwd);
  var pcts  = { weak: '25%', medium: '65%', strong: '100%' };
  fill.style.width      = pwd.length ? pcts[s.level] : '0%';
  fill.style.background = s.color;
  label.textContent     = pwd.length ? ('Senha ' + s.label) : '';
  label.style.color     = s.color;
}

function handleTrocarSenha() {
  var atualEl   = document.getElementById('ts-atual');
  var novaEl    = document.getElementById('ts-nova');
  var confirmEl = document.getElementById('ts-confirma');
  var btn       = document.getElementById('btn-ts');
  var errBox    = document.getElementById('ts-error');
  var errTxt    = document.getElementById('ts-error-text');

  errBox.classList.remove('visible');
  confirmEl.closest('.field').classList.remove('has-error');

  var atual    = atualEl.value;
  var nova     = novaEl.value;
  var confirma = confirmEl.value;

  if (!atual || !nova || !confirma) {
    errTxt.textContent = 'Preencha todos os campos.';
    errBox.classList.add('visible'); return;
  }
  if (!validatePassword(nova)) {
    errTxt.textContent = 'A nova senha não atende aos requisitos.';
    errBox.classList.add('visible'); return;
  }
  if (nova !== confirma) {
    confirmEl.closest('.field').classList.add('has-error'); return;
  }

  setBtnLoading(btn, true);

  Promise.all([sha256(atual), sha256(nova)]).then(function(hashes) {
    google.script.run
      .withSuccessHandler(function(res) {
        setBtnLoading(btn, false);
        if (res && res.success) {
          closeModalTrocarSenha();
          showToast('Senha alterada com sucesso!', 'success');
        } else {
          errTxt.textContent = (res && res.error) ? res.error : 'Erro inesperado.';
          errBox.classList.add('visible');
        }
      })
      .withFailureHandler(function() {
        setBtnLoading(btn, false);
        errTxt.textContent = 'Erro de conexão. Tente novamente.';
        errBox.classList.add('visible');
      })
      .trocarSenha(App.session.token, hashes[0], hashes[1]);
  });
}
</script>
