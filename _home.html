<style>
/* ══════════════════════════════════════════════════
   HOME · cabeçalho da igreja + indicadores + módulos + atividade
   Usa só os tokens do shell (cores, --sp-*, --fs-*). Nada de cor fixa:
   a paleta da igreja (aba Config) chega pelas variáveis --teal*.
══════════════════════════════════════════════════ */

/* ── Entrada suave, escalonada ── */
.hm-rise { opacity: 0; transform: translateY(12px); animation: hmRise .55s var(--ease-spring) forwards; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes hmRise { to { opacity: 1; transform: translateY(0); } }

/* ── Cartão institucional (topo): cor profunda da igreja, logo grande, grafismo temático ── */
/* A página da Início não tem moldura: o cartão vai de borda a borda, colado ao topo; o resto fica em .hm-body */
.page.hm { max-width: none; padding: 0 0 var(--sp-7); }
.hm-body, .hm-hero-in { max-width: var(--page-w, 1120px); margin: 0 auto; padding: 0 var(--gutter); }
.hm-hero-in { position: relative; z-index: 1; }
.hm-hero {
  position: relative; z-index: 5; margin-bottom: var(--sp-5); color: #fff;
  padding: calc(var(--sp-5) + env(safe-area-inset-top, 0px)) 0 var(--sp-4);
  border-radius: 0 0 var(--r-4) var(--r-4); box-shadow: var(--shadow-lg);
  background: linear-gradient(140deg, var(--hero-b) 0%, var(--hero-a) 100%);
}
.hm-art { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; color: #fff; }
.hm-art svg { position: absolute; right: 0; top: 0; width: 100%; height: 100%; }
.hm-top { position: absolute; top: calc(var(--sp-3) * -1); left: var(--gutter); right: var(--gutter); z-index: 2; display: flex; justify-content: space-between; align-items: center; }
.hm-top .hm-menu-wrap { margin-left: auto; }
.hm-burger { color: #fff; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .24); }
@media (min-width: 1024px) { .hm-burger { display: none !important; } }
.hm-menu-wrap { position: relative; flex-shrink: 0; }
.hm-me {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; font-family: inherit;
  font-size: var(--fs-sm); font-weight: 800; color: #fff; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .28);
  transition: background var(--dur) var(--ease);
}
.hm-me:hover { background: rgba(255, 255, 255, .24); }
.hm-me:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.hm-brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-2);  }
.hm-logo {
  width: 64px; height: 64px; flex-shrink: 0; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
  background: #FFFFFF; box-shadow: 0 0 0 2px var(--hero-gold), 0 10px 24px -10px rgba(0, 0, 0, .5);
}
.hm-logo .brand-mark { font-size: var(--fs-lg); color: var(--hero-a); }
.hm-logo .brand-mark img { padding: 0; }
.hm-id-txt { min-width: 0; }
.hm-eyebrow { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--hero-gold); }
.hm-title { margin-top: var(--sp-1); font-size: var(--fs-md); font-weight: 800; letter-spacing: -.01em; line-height: 1.25; color: #fff; overflow-wrap: anywhere; }
.hm-lema { max-width: 520px; margin: var(--sp-1) auto 0; font-size: var(--fs-sm); font-style: italic; line-height: 1.5; color: rgba(255, 255, 255, .82); }
@media (min-width: 768px) { .hm-logo { width: 88px; height: 88px; } .hm-title { font-size: var(--fs-lg); } }

/* ── Corpo: celular = uma coluna (atalhos, indicadores, aniversários, atividade); desktop = principal + lateral ── */
.hm-body { display: flex; flex-direction: column; }
.hm-main, .hm-side { display: contents; }
.hm-s-atalhos { order: 1; } .hm-s-kpis { order: 2; } .hm-s-anivs { order: 3; } .hm-s-ativ { order: 4; }
.hm-data { display: none; }
@media (min-width: 1024px) {
  .hm-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 0 var(--sp-5); align-items: start; }
  .hm-main, .hm-side { display: block; min-width: 0; }
  /* cartão institucional: contido na área de trabalho, marca à esquerda e data à direita */
  .page.hm { max-width: var(--page-w, 1360px); padding: var(--sp-6) var(--gutter) var(--sp-7); }
  .hm-body { padding: 0; }
  .hm-hero { margin: 0 0 var(--sp-5); padding: var(--sp-5) var(--sp-6); border-radius: var(--r-4); }
  .hm-hero-in { max-width: none; padding: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-5); }
  .hm-top { display: none; }
  .hm-brand { flex-direction: row; align-items: center; text-align: left; gap: var(--sp-5); }
  .hm-logo { width: 80px; height: 80px; }
  .hm-title { font-size: var(--fs-xl); }
  .hm-lema { margin: var(--sp-1) 0 0; max-width: 560px; }
  .hm-data { display: block; flex-shrink: 0; font-size: var(--fs-sm); font-weight: 600; color: rgba(255, 255, 255, .78); }
}

/* ── Blocos e títulos ── */
.hm-block { margin-bottom: var(--sp-5); }
.hm-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-3); font-size: var(--fs-md); font-weight: 700; letter-spacing: -.01em; color: var(--text); }
.hm-h a, .hm-h button { font-size: var(--fs-sm); font-weight: 700; color: var(--teal); background: none; border: 0; cursor: pointer; font-family: inherit; padding: 0; }

/* ── Atalhos: círculos, todos na cor da igreja (cor por assunto só em status) ── */
.hm-mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: var(--sp-3) var(--sp-2); }
.hm-mod {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); width: 100%; text-align: center;
  padding: 0; border: 0; background: none; color: inherit; font-family: inherit; cursor: pointer;
}
.hm-mod-icon {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--on-teal, #fff);
  background: var(--teal); box-shadow: 0 6px 14px -8px var(--teal-glow);
  transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.hm-mod-icon i, .hm-mod-icon svg { width: 22px; height: 22px; stroke-width: 2; }
.hm-mod:hover .hm-mod-icon { transform: translateY(-2px); box-shadow: 0 10px 18px -8px var(--teal-glow); }
.hm-mod:active .hm-mod-icon { transform: scale(.97); }
.hm-mod:focus-visible { outline: 2px solid var(--teal); outline-offset: 4px; border-radius: var(--r-3); }
.hm-mod-name { font-size: var(--fs-xs); font-weight: 600; letter-spacing: -.01em; color: var(--text); overflow-wrap: anywhere; }

/* Atalhos no desktop: lista vertical na lateral (ícone, nome); o círculo é só do celular */
@media (min-width: 1024px) {
  .hm-mods { grid-template-columns: minmax(0, 1fr); gap: var(--sp-2); }
  .hm-mods .hm-mod { flex-direction: row; justify-content: flex-start; text-align: left; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-3); background: var(--bg2); transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease); }
  .hm-mods .hm-mod:hover { border-color: var(--teal-border); background: var(--bg3); }
  .hm-mods .hm-mod-icon { width: 36px; height: 36px; border-radius: var(--r-2); box-shadow: none; }
  .hm-mods .hm-mod:hover .hm-mod-icon { transform: none; box-shadow: none; }
  .hm-mods .hm-mod-icon i, .hm-mods .hm-mod-icon svg { width: 18px; height: 18px; }
  .hm-mods .hm-mod-name { font-size: var(--fs-sm); font-weight: 700; }
}

/* ── Indicadores: um cartão por módulo; o formato (grade, lista ou trio) vem do manifesto do módulo ── */
.kp { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-4); box-shadow: var(--shadow-sm); overflow: hidden; }
.kp + .kp { margin-top: var(--sp-3); }
/* desktop: cartões dos módulos lado a lado, quantos couberem */
@media (min-width: 1024px) {
  #kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--sp-4); align-items: start; }
  .kp + .kp { margin-top: 0; }
}
.kp-h { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4) var(--sp-2); }
.kp-ic { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; color: var(--on-teal, #fff); background: var(--teal); }
.kp-ic i, .kp-ic svg { width: 16px; height: 16px; }
.kp-t { flex: 1; min-width: 0; margin: 0; font-size: var(--fs-md); font-weight: 800; color: var(--text); }
.kp-go { display: inline-flex; align-items: center; gap: var(--sp-1); min-height: 32px; padding: 0 var(--sp-1); border: 0; background: none; cursor: pointer; font-family: inherit; font-size: var(--fs-sm); font-weight: 700; color: var(--teal); }
.kp-go i, .kp-go svg { width: 14px; height: 14px; }
.kp-go:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: var(--r-2); }
.bn-lab { font-size: var(--fs-xs); font-weight: 600; color: var(--text-muted); line-height: 1.25; }
.bn-num { font-size: var(--fs-lg); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--text); }
.bn-card.is-zero .bn-num { color: var(--text-dim); }
/* grade: destaque + quadros menores */
.kp-grade { padding: 0 var(--sp-3) var(--sp-3); }
.bn-card.feat { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: var(--sp-1); min-height: 112px; padding: var(--sp-4); border-radius: var(--r-3); color: var(--on-teal, #fff);
  background: radial-gradient(circle at 85% 15%, rgba(255, 255, 255, .22), transparent 50%), linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%); }
.bn-card.feat .bn-lab, .bn-card.feat .bn-num, .bn-card.feat .bn-sub { color: inherit; }
.bn-card.feat .bn-num { font-size: var(--fs-2xl); }
.bn-sub { font-size: var(--fs-xs); opacity: .85; }
.bn-ghost { position: absolute; right: var(--sp-3); top: 50%; width: 76px; height: 76px; transform: translateY(-50%); opacity: .18; pointer-events: none; }
.bn-ghost svg { width: 100%; height: 100%; }
.kp-tiles { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: var(--sp-2); margin-top: var(--sp-2); }
.bn-tile { display: flex; flex-direction: column; gap: var(--sp-1); min-height: 64px; padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-3); }
/* lista: linha com ícone, rótulo e número */
.kp-lista { padding-bottom: var(--sp-1); }
.bn-row { display: flex; align-items: center; gap: var(--sp-3); min-height: 48px; padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--border); }
.bn-row:first-child { border-top: 0; }
.bn-row > i, .bn-row > svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--teal); }
.bn-row .bn-lab { flex: 1; font-size: var(--fs-sm); font-weight: 500; color: var(--text); }
.bn-row .bn-num { min-width: 40px; text-align: right; }
/* trio: três números lado a lado */
.kp-trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: var(--sp-1) var(--sp-2) var(--sp-3); }
.bn-cell { display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-1) var(--sp-3); border-left: 1px solid var(--border); }
.bn-cell:first-child { border-left: 0; }
.bn-cell .bn-num { font-size: var(--fs-xl); }
/* rodapé de status: sempre presente */
.kp-f { display: flex; align-items: center; gap: var(--sp-2); min-height: 48px; padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--border); font-size: var(--fs-sm); color: var(--text-muted); background: var(--bg3); }
.kp-f i, .kp-f svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--teal); }
.kp-f span { flex: 1; min-width: 0; }
.kp-f.warn { color: var(--text); background: color-mix(in srgb, var(--warning) 14%, transparent); }
.kp-f.warn i, .kp-f.warn svg { color: var(--warning); }
.kp-f button { min-height: 32px; padding: 0 var(--sp-1); border: 0; background: none; cursor: pointer; font-family: inherit; font-size: var(--fs-sm); font-weight: 800; color: color-mix(in srgb, var(--warning) 62%, #000); }
.kp-f button:focus-visible { outline: 2px solid var(--warning); outline-offset: 2px; border-radius: var(--r-2); }

/* ── Aniversariantes: 3 cartões lado a lado ── */
.hm-anivs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); }
.hm-aniv {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); padding: var(--sp-4) var(--sp-2); text-align: center;
  border: 1px solid var(--border); border-radius: var(--r-3); background: var(--bg-glass); min-width: 0;
}
[data-theme="light"] .hm-aniv { background: #FFFFFF; box-shadow: var(--shadow-sm); }
.hm-aniv-av { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: var(--fs-sm); font-weight: 800; color: var(--teal); background: var(--teal-dim); }
.hm-aniv.hoje .hm-aniv-av { box-shadow: 0 0 0 2px var(--hero-gold); }
.hm-aniv-nome { max-width: 100%; font-size: var(--fs-sm); font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm-aniv-dia { padding: 3px var(--sp-3); border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: 700; color: var(--text-muted); background: var(--teal-dim); }
.hm-aniv-dia.hoje { color: var(--hero-a); background: var(--hero-gold); }
/* desktop (lateral estreita): uma pessoa por linha */
@media (min-width: 1024px) {
  .hm-anivs { grid-template-columns: minmax(0, 1fr); gap: var(--sp-2); }
  .hm-aniv { flex-direction: row; padding: var(--sp-2) var(--sp-3); text-align: left; }
  .hm-aniv-av { width: 36px; height: 36px; flex-shrink: 0; }
  .hm-aniv-nome { flex: 1; min-width: 0; }
  .hm-aniv-dia { margin-left: auto; flex-shrink: 0; }
}


/* ── Atividade ── */
.activity-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--r-3); background: var(--bg-glass); overflow: hidden; }
[data-theme="light"] .activity-list { background: #FFFFFF; }
.activity-item { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: none; }
.activity-icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; background: var(--teal-dim); color: var(--teal); }
.activity-icon i { width: 17px; height: 17px; }
.activity-body { flex: 1; min-width: 0; }
.activity-text { font-size: var(--fs-sm); font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity-time { margin-top: 2px; font-size: var(--fs-xs); color: var(--text-dim); }

/* ── Estados vazios / erro ── */
.hm-empty {
  grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-2);
  padding: var(--sp-6) var(--sp-5); border: 1px dashed var(--border2); border-radius: var(--r-3); background: var(--bg-glass);
}
[data-theme="light"] .hm-empty { background: #F8FAFC; }
.hm-empty-icon { width: 52px; height: 52px; border-radius: var(--r-3); display: grid; place-items: center; margin-bottom: var(--sp-2); background: var(--teal-dim); color: var(--teal); }
.hm-empty.erro .hm-empty-icon { background: var(--danger-dim); color: var(--danger); }
.hm-empty-icon i { width: 24px; height: 24px; }
.hm-empty-title { font-size: var(--fs-md); font-weight: 800; color: var(--text); }
.hm-empty-desc { max-width: 340px; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-muted); }
.hm-empty .btn { margin-top: var(--sp-3); }

/* ── Esqueletos (mesmas medidas do conteúdo, sem "pulo" na troca) ── */
.bn-card.is-loading { pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  .hm-rise { animation: none; opacity: 1; transform: none; }
  .kpi-card, .hm-mod, .hm-me { transition: none; }
  .kpi-card:hover, .hm-mod:hover { transform: none; }
}
</style>

<script>
// ═══════════════════════════════════════════════════
//  HOME — identidade da igreja, indicadores, módulos e atividade
//  O conteúdo muda conforme o perfil (HOME_PERFIL).
//  ES5 · sem crase · sem alert/confirm (avisos = toast/modal da plataforma)
// ═══════════════════════════════════════════════════

// O que cada perfil vê. Para um perfil novo, basta acrescentar uma linha aqui.
//   secoes: blocos exibidos · admin: mostra o bloco "Administração" (Usuários)
var HOME_PERFIL = {
  admin:      { visao: 'Visão geral da igreja', sub: 'Indicadores, módulos e administração do sistema.', secoes: ['kpis', 'modulos', 'atividade'], admin: true },
  secretaria: { visao: 'Seu espaço de trabalho', sub: 'Atalhos para os módulos que você utiliza.',         secoes: ['kpis', 'modulos'],              admin: false }
};
var HOME_PERFIL_PADRAO = { visao: 'Início', sub: 'Acesse os módulos liberados para você.', secoes: ['kpis', 'modulos'], admin: false };

function _homeDataExtenso() {
  try { var t = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }); return t.charAt(0).toUpperCase() + t.slice(1); } catch (e) { return ''; }
}

function _homeTem(cfg, secao) { return cfg.secoes.indexOf(secao) !== -1; }

function _homeEstado(icone, titulo, desc, extra, erro) {
  return '<div class="hm-empty' + (erro ? ' erro' : '') + '">' +
    '<div class="hm-empty-icon"><i data-lucide="' + icone + '"></i></div>' +
    '<div class="hm-empty-title">' + titulo + '</div>' +
    '<div class="hm-empty-desc">' + desc + '</div>' + (extra || '') +
  '</div>';
}

/* Grafismo do cartão: só arcos concêntricos e cruz em marca d'água, bem discretos (cor vem do CSS) */
function _homeArte() {
  return '<svg viewBox="0 0 640 320" preserveAspectRatio="xMaxYMid slice" focusable="false">' +
    '<g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".08">' +
      '<circle cx="560" cy="70" r="90"/><circle cx="560" cy="70" r="150"/><circle cx="560" cy="70" r="210"/><circle cx="560" cy="70" r="270"/>' +
    '</g>' +
    '<g fill="currentColor" opacity=".07"><rect x="548" y="96" width="22" height="170" rx="4"/><rect x="494" y="146" width="130" height="22" rx="4"/></g>' +
  '</svg>';
}

function renderHome() {
  if (!App.session) { navigateTo('login'); return; }

  var perfil = App.session.perfil || '';
  var cfg    = HOME_PERFIL[perfil] || HOME_PERFIL_PADRAO;
  var mods   = modulosDoPerfil(perfil);
  var podeUsuarios = cfg.admin && ROUTE_PERMISSIONS.usuarios.indexOf(perfil) !== -1;
  var comAtividade = _homeTem(cfg, 'atividade');
  var modAniv = mods.filter(function (m) { return m.rota === 'membros'; })[0]; /* aniversariantes vêm do cadastro */
  var comAniv = !!modAniv;
  var i = 0; // ordem da entrada escalonada

  /* ══ Cartão institucional (nome, logo, lema e cor vêm da aba Config; menu do usuário mora aqui) ══ */
  var html =
    '<div class="page hm">' +
    '<header class="hm-hero hm-rise" style="--i:' + (i++) + '">' +
      '<div class="hm-art" aria-hidden="true">' + _homeArte() + '</div>' +
      '<div class="hm-hero-in">' +
      '<div class="hm-top">' +
        '<button type="button" class="icon-btn nav-burger hm-burger" onclick="navAbrir()" aria-label="Abrir menu" aria-controls="app-sidebar"><i data-lucide="menu"></i></button>' +
        '<div class="hm-menu-wrap">' +
          '<button type="button" class="hm-me" id="hm-me-btn" aria-label="Menu do usuário" aria-haspopup="true" onclick="homeToggleMenu(event)">' + escHtml(getInitials(App.session.nome || '')) + '</button>' +
          '<div class="user-dropdown" id="hm-user-dd">' +
            '<div class="user-dd-header">' +
              '<div class="user-dd-nome">' + escHtml(App.session.nome || '') + '</div>' +
              '<div class="user-dd-email">' + escHtml(App.session.email || '') + '</div>' +
              '<div style="margin-top:8px"><span class="badge badge-teal">' + escHtml(PERFIL_LABEL[perfil] || perfil) + '</span></div>' +
            '</div>' +
            '<button class="user-dd-item" onclick="showTrocarSenha()"><i data-lucide="key" class="ic-15"></i> Alterar senha</button>' +
            '<button class="user-dd-item" onclick="closeDropdown();toggleTheme()"><i data-lucide="moon" class="ic-15"></i> Alternar tema</button>' +
            '<hr class="divider" style="margin:6px 0">' +
            '<button class="user-dd-item danger" onclick="handleLogout()"><i data-lucide="log-out" class="ic-15"></i> Sair</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="hm-brand">' +
        '<div class="hm-logo"><span class="brand-mark">' + brandMarkInner() + '</span></div>' +
        '<div class="hm-id-txt">' +
          '<div class="hm-eyebrow">' + cfg.visao + '</div>' +
          '<h1 class="hm-title">' + escHtml(IDENTIDADE.nome) + '</h1>' +
          (IDENTIDADE.lema ? '<p class="hm-lema">' + escHtml(IDENTIDADE.lema) + '</p>' : '') +
        '</div>' +
      '</div>' +
      '<div class="hm-data" aria-hidden="true">' + escHtml(_homeDataExtenso()) + '</div>' +
      '</div>' +
    '</header>' +
    '<div class="hm-body">';
  var sec = { atalhos: '', kpis: '', anivs: '', ativ: '' };

  /* ══ Atalhos (módulos liberados ao perfil + Usuários, quando permitido) ══ */
  sec.atalhos = '<section class="hm-block hm-rise hm-s-atalhos" style="--i:' + (i++) + '">' +
    '<h2 class="hm-h">Atalhos</h2>' +
    '<div class="hm-mods">' +
      (mods.length ? '' : _homeEstado('layout-grid', 'Nenhum módulo disponível',
            perfil === 'admin'
              ? 'Ative módulos na aba <b>Config</b> da planilha (chave <b>MODULOS_ATIVOS</b>) ou instale um módulo.'
              : 'Peça ao administrador para liberar módulos para o seu perfil.')) +
      /* mesmos destinos do menu (módulos, Usuários, Identidade), conforme o perfil */
      navItens().filter(function (it) { return it.rota !== 'home' && !it.soSidebar; }).map(function (it, n) { return _moduleBtn(it.icone, it.nome, '', it.rota, n); }).join('') +
    '</div>' +
  '</section>';

  /* ══ Indicadores em mosaico + faixa de atenção ══ */
  if (_homeTem(cfg, 'kpis')) {
    sec.kpis = '<section class="hm-block hm-rise hm-s-kpis" style="--i:' + (i++) + '">' +
      '<h2 class="hm-h">Indicadores</h2>' +
      '<div id="kpi-grid">' + _kpiSkeleton() + '</div>' +
    '</section>';
  }

  /* ══ Aniversariantes do mês ══ */
  if (comAniv) {
    sec.anivs = '<section class="hm-block hm-rise hm-s-anivs" style="--i:' + (i++) + '">' +
      '<h2 class="hm-h">Aniversariantes do mês <button type="button" onclick="navigateTo(\'' + modAniv.rota + '\')">Ver tudo</button></h2>' +
      '<div class="hm-anivs" id="aniv-list">' + _anivSkeleton() + _anivSkeleton() + _anivSkeleton() + '</div>' +
    '</section>';
  }

  /* ══ Atividade recente ══ */
  if (comAtividade) {
    sec.ativ = '<section class="panel hm-rise hm-s-ativ" style="--i:' + (i++) + '">' +
      '<div class="panel-head"><h2 class="panel-title">Atividade recente</h2></div>' +
      '<div class="activity-list" id="activity-list">' + _activitySkeleton() + _activitySkeleton() + _activitySkeleton() + '</div>' +
    '</section>';
  }

  html += '<div class="hm-main">' + sec.kpis + sec.ativ + '</div><div class="hm-side">' + sec.atalhos + sec.anivs + '</div></div></div>'; /* /hm-body /hm */

  renderView(html);

  /* Fechar o menu do usuário ao clicar fora ou com Esc (registrado uma única vez) */
  if (!window.__homeDocClick) {
    window.__homeDocClick = true;
    document.addEventListener('click', function (e) {
      var dd = document.getElementById('hm-user-dd');
      var wrap = dd && dd.parentNode;
      if (dd && wrap && !wrap.contains(e.target)) dd.classList.remove('open');
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDropdown(); });
  }

  if (_homeTem(cfg, 'kpis')) _loadKpis();
  if (comAniv) _loadAniv();
  if (comAtividade) _loadActivity();
}

/* ── HELPERS ── */
function _kpiSkeleton() {
  var linha = '<div class="bn-card bn-row is-loading"><div class="skeleton" style="width:18px;height:18px;border-radius:var(--r-1)"></div><div class="skeleton" style="flex:1;height:12px;border-radius:var(--r-1)"></div><div class="skeleton" style="width:36px;height:20px;border-radius:var(--r-1)"></div></div>';
  return '<div class="kp"><div class="kp-h"><div class="skeleton" style="width:32px;height:32px;border-radius:50%"></div><div class="skeleton" style="width:120px;height:14px;border-radius:var(--r-1)"></div></div>' +
    '<div class="kp-lista">' + linha + linha + linha + '</div></div>';
}

/* Cada módulo vira um cartão: cabeçalho, corpo no formato que o módulo declara e rodapé de status (sempre presente). */
function _kpiNum(k) { return (k.valor === undefined || k.valor === null) ? '—' : String(k.valor); }
function _kpiZero(k) { return (k.valor === undefined || k.valor === null || k.valor === 0) ? ' is-zero' : ''; }
function _kpiIcone(k) { return escHtml(k.icone || 'bar-chart-3'); }

function _kpiCorpo(layout, stats) {
  if (!stats.length) return '';
  if (layout === 'grade') {
    var iF = 0;
    stats.forEach(function (k, n) { if (k.curto === 'Ativos') iF = n; });
    var f = stats[iF], resto = stats.filter(function (k, n) { return n !== iF; });
    var sub = f.valor ? '' : (f.vazio || '');
    var irmao = stats.filter(function (k) { return k.curto === 'Inativos'; })[0];
    if (f.valor && f.curto === 'Ativos' && irmao) {
      var tot = f.valor + (irmao.valor || 0);
      sub = 'de ' + tot + ' cadastrados · ' + Math.round(f.valor * 100 / tot) + '%';
    }
    return '<div class="kp-grade"><div class="bn-card feat' + _kpiZero(f) + '" data-k="' + escHtml(f.curto || '') + '">' +
      '<span class="bn-ghost" aria-hidden="true"><i data-lucide="' + _kpiIcone(f) + '"></i></span>' +
      '<span class="bn-lab">' + escHtml(f.curto || f.rotulo || '') + '</span><span class="bn-num">' + escHtml(_kpiNum(f)) + '</span>' +
      '<span class="bn-sub">' + escHtml(sub || ' ') + '</span></div>' +
      (resto.length ? '<div class="kp-tiles" style="--n:' + Math.min(resto.length, 3) + '">' + resto.map(function (k) {
        return '<div class="bn-card bn-tile' + _kpiZero(k) + '" data-k="' + escHtml(k.curto || '') + '"><span class="bn-lab">' + escHtml(k.curto || k.rotulo || '') + '</span><span class="bn-num">' + escHtml(_kpiNum(k)) + '</span></div>';
      }).join('') + '</div>' : '') + '</div>';
  }
  if (layout === 'lista') {
    return '<div class="kp-lista">' + stats.map(function (k) {
      return '<div class="bn-card bn-row' + _kpiZero(k) + '" data-k="' + escHtml(k.curto || '') + '"><i data-lucide="' + _kpiIcone(k) + '"></i>' +
        '<span class="bn-lab">' + escHtml(k.curto || k.rotulo || '') + '</span>' +
        '<span class="bn-num">' + escHtml(_kpiNum(k)) + '</span></div>';
    }).join('') + '</div>';
  }
  return '<div class="kp-trio">' + stats.slice(0, 3).map(function (k) {
    return '<div class="bn-card bn-cell' + _kpiZero(k) + '" data-k="' + escHtml(k.curto || '') + '"><span class="bn-num">' + escHtml(_kpiNum(k)) + '</span><span class="bn-lab">' + escHtml(k.curto || k.rotulo || '') + '</span></div>';
  }).join('') + '</div>';
}

function _kpiRodape(alertas, rota) {
  if (!alertas.length) return '<div class="kp-f ok"><i data-lucide="check-circle-2"></i><span>Nada pendente</span></div>';
  return alertas.map(function (k) {
    var rot = String(k.rotulo || k.curto || '').toLowerCase();
    if (k.valor === 1) rot = rot.replace(/^membros\b/, 'membro').replace(/^chamadas\b/, 'chamada');
    var dest = k.destino || rota;
    return '<div class="kp-f warn" data-k="' + escHtml(k.curto || '') + '"><i data-lucide="alert-triangle"></i><span><b>' + escHtml(k.valor) + '</b> ' + escHtml(rot) + '</span>' +
      (dest ? '<button type="button" onclick="navigateTo(\'' + escHtml(dest) + '\')">' + escHtml(k.acao || 'Resolver') + '</button>' : '') + '</div>';
  }).join('');
}

function _kpiHtml(d) {
  var grupos = [], idx = {};
  d.forEach(function (k) {
    var id = k.modulo || 'geral';
    if (idx[id] === undefined) { idx[id] = grupos.length; grupos.push({ id: id, nome: k.moduloNome || '', icone: k.moduloIcone || 'layout-grid', rota: k.moduloRota || '', layout: k.layout || 'trio', kpis: [] }); }
    grupos[idx[id]].kpis.push(k);
  });
  return grupos.map(function (g) {
    var stats = g.kpis.filter(function (k) { return !k.alerta; });
    var alertas = g.kpis.filter(function (k) { return k.alerta && (k.valor || 0) > 0; });
    return '<section class="kp" data-modulo="' + escHtml(g.id) + '"><div class="kp-h"><span class="kp-ic"><i data-lucide="' + escHtml(g.icone) + '"></i></span>' +
      '<h3 class="kp-t">' + escHtml(g.nome) + '</h3>' +
      (g.rota ? '<button type="button" class="kp-go" onclick="navigateTo(\'' + escHtml(g.rota) + '\')">Abrir<i data-lucide="chevron-right"></i></button>' : '') + '</div>' +
      _kpiCorpo(g.layout, stats) + _kpiRodape(alertas, g.rota) + '</section>';
  }).join('');
}

function _anivSkeleton() {
  return '<div class="hm-aniv"><div class="skeleton" style="width:48px;height:48px;border-radius:50%"></div><div class="skeleton" style="width:70%;height:13px"></div><div class="skeleton" style="width:40px;height:18px;border-radius:var(--r-pill)"></div></div>';
}
function _activitySkeleton() {
  return '<div class="activity-item">' +
    '<div class="skeleton" style="width:36px;height:36px;border-radius:50%;flex-shrink:0"></div>' +
    '<div class="activity-body">' +
      '<div class="skeleton" style="width:70%;height:13px;margin-bottom:6px"></div>' +
      '<div class="skeleton" style="width:35%;height:11px"></div>' +
    '</div>' +
  '</div>';
}


function _moduleBtn(icon, name, desc, view, n) {
  return '<button class="hm-mod" onclick="navigateTo(\'' + view + '\')"' + (desc ? ' title="' + escHtml(desc) + '"' : '') + '>' +
    '<div class="hm-mod-icon"><i data-lucide="' + escHtml(icon) + '"></i></div>' +
    '<div class="hm-mod-name">' + escHtml(name) + '</div>' +
  '</button>';
}

function _homeRetry(fn) {
  return '<button class="btn btn-ghost btn-sm" onclick="' + fn + '()"><i data-lucide="refresh-cw" class="ic-14"></i> Tentar de novo</button>';
}

function _loadKpis() {
  function mostrar(html) {
    var grid = document.getElementById('kpi-grid');
    if (!grid) return;
    grid.innerHTML = html;
    if (window.lucide) setTimeout(function () { lucide.createIcons(); }, 0);
  }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        mostrar(_homeEstado('alert-triangle', 'Não foi possível carregar os indicadores',
          (res && res.error) ? escHtml(res.error) : 'Tente novamente em instantes.', _homeRetry('_homeRecarregarKpis'), true));
        return;
      }
      var d = res.data || [];
      if (!d.length) {
        mostrar(_homeEstado('bar-chart-3', 'Sem indicadores por enquanto',
          'Quando houver módulos com dados para o seu perfil, os números aparecem aqui.'));
        return;
      }
      mostrar(_kpiHtml(d));
    })
    .withFailureHandler(function () {
      mostrar(_homeEstado('wifi-off', 'Sem conexão com o servidor',
        'Verifique sua internet e tente novamente.', _homeRetry('_homeRecarregarKpis'), true));
    })
    .getKpisHome(App.session.token);
}
function _homeRecarregarKpis() {
  var grid = document.getElementById('kpi-grid');
  if (grid) grid.innerHTML = _kpiSkeleton();
  _loadKpis();
}

function _loadActivity() {
  function mostrar(html, lista) {
    var el = document.getElementById('activity-list');
    if (!el) return;
    el.innerHTML = html;
    if (window.lucide) setTimeout(function () { lucide.createIcons(); }, 0);
  }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        mostrar(_homeEstado('alert-triangle', 'Não foi possível carregar a atividade',
          'Tente novamente em instantes.', _homeRetry('_homeRecarregarAtividade'), true));
        return;
      }
      if (!res.data || !res.data.length) {
        mostrar(_homeEstado('clipboard-list', 'Nenhuma atividade recente', 'As ações recentes aparecerão aqui.'));
        return;
      }
      mostrar(res.data.map(function (item) {
        return '<div class="activity-item">' +
          '<div class="activity-icon"><i data-lucide="' + escHtml(item.icon || 'file-text') + '"></i></div>' +
          '<div class="activity-body">' +
            '<div class="activity-text">' + escHtml(item.texto) + '</div>' +
            '<div class="activity-time">' + escHtml(item.tempo || '') + '</div>' +
          '</div>' +
        '</div>';
      }).join(''));
    })
    .withFailureHandler(function () {
      mostrar(_homeEstado('wifi-off', 'Sem conexão com o servidor',
        'Verifique sua internet e tente novamente.', _homeRetry('_homeRecarregarAtividade'), true));
    })
    .getAtividadeRecente(App.session.token);
}
function _homeRecarregarAtividade() {
  var el = document.getElementById('activity-list');
  if (el) el.innerHTML = _activitySkeleton() + _activitySkeleton() + _activitySkeleton();
  _loadActivity();
}

function _loadAniv() {
  function mostrar(html) {
    var el = document.getElementById('aniv-list');
    if (!el) return;
    el.innerHTML = html;
    if (window.lucide) setTimeout(function () { lucide.createIcons(); }, 0);
  }
  function dd(n) { return (n < 10 ? '0' : '') + n; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        mostrar(_homeEstado('alert-triangle', 'Não foi possível carregar os aniversariantes',
          'Tente novamente em instantes.', _homeRetry('_homeRecarregarAniv'), true));
        return;
      }
      var d = res.data || {}, itens = d.itens || [];
      if (!itens.length) {
        mostrar(_homeEstado('cake', 'Nenhum aniversariante neste mês', 'Membros ativos com data de nascimento neste mês aparecem aqui.'));
        return;
      }
      mostrar(itens.map(function (x) {
        return '<div class="hm-aniv' + (x.hoje ? ' hoje' : '') + '">' +
          '<div class="hm-aniv-av">' + escHtml(getInitials(x.nome)) + '</div>' +
          '<div class="hm-aniv-nome">' + escHtml(x.nome) + '</div>' +
          '<span class="hm-aniv-dia' + (x.hoje ? ' hoje' : '') + '">' + (x.hoje ? 'Hoje' : dd(x.dia) + '/' + dd(x.mes)) + '</span>' +
        '</div>';
      }).join(''));
    })
    .withFailureHandler(function () {
      mostrar(_homeEstado('wifi-off', 'Sem conexão com o servidor',
        'Verifique sua internet e tente novamente.', _homeRetry('_homeRecarregarAniv'), true));
    })
    .mb_aniversariantesDoMes(App.session.token, 3);
}
function _homeRecarregarAniv() {
  var el = document.getElementById('aniv-list');
  if (el) el.innerHTML = _anivSkeleton() + _anivSkeleton() + _anivSkeleton();
  _loadAniv();
}

/* ── MENU DO USUÁRIO (dentro do cartão institucional) ── */
function homeToggleMenu(e) {
  if (e) e.stopPropagation();
  var d = document.getElementById('hm-user-dd');
  if (d) d.classList.toggle('open');
}
function toggleUserDropdown() {
  var dd = document.getElementById('user-dropdown');
  if (dd) dd.classList.toggle('open');
}
function closeDropdown() {
  ['user-dropdown', 'hm-user-dd'].forEach(function (id) {
    var dd = document.getElementById(id);
    if (dd) dd.classList.remove('open');
  });
}

function homeToggleNavCfg(e) {
  if (e) e.stopPropagation();
  var dd = document.getElementById('home-nav-cfg-dd');
  if (!dd) return;
  var opening = !dd.classList.contains('open');
  dd.classList.toggle('open');
  if (opening) {
    if (window.lucide) lucide.createIcons();
    setTimeout(function() {
      document.addEventListener('click', function _close(ev) {
        if (!dd.contains(ev.target)) {
          dd.classList.remove('open');
          document.removeEventListener('click', _close);
        }
      });
    }, 0);
  }
}

/* ── LOGOUT ── */
function handleLogout() {
  closeDropdown();
  if (!App.session) { navigateTo('login'); return; }
  google.script.run
    .withSuccessHandler(function() {
      clearSession();
      showToast('Sessão encerrada. Até logo!', 'info');
      navigateTo('login');
    })
    .withFailureHandler(function() {
      clearSession();
      navigateTo('login');
    })
    .logout(App.session.token);
}

/* ── MODAL TROCA DE SENHA ── */
function showTrocarSenha() {
  closeDropdown();
  var m = document.getElementById('modal-troca-senha');
  if (m) {
    m.classList.add('open');
    ['ts-atual','ts-nova','ts-confirma'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    var errBox = document.getElementById('ts-error');
    if (errBox) errBox.classList.remove('visible');
    if (window.lucide) lucide.createIcons();
  }
}
function closeModalTrocarSenha() {
  var m = document.getElementById('modal-troca-senha');
  if (m) m.classList.remove('open');
}

function tsCheckStrength() {
  var pwd   = document.getElementById('ts-nova').value;
  var fill  = document.getElementById('ts-strength-fill');
  var label = document.getElementById('ts-strength-label');
  var s     = getPasswordStrength(pwd);
  var pcts  = { weak: '25%', medium: '65%', strong: '100%' };
  fill.style.width      = pwd.length ? pcts[s.level] : '0%';
  fill.style.background = s.color;
  label.textContent     = pwd.length ? ('Senha ' + s.label) : '';
  label.style.color     = s.color;
}

function handleTrocarSenha() {
  var atualEl   = document.getElementById('ts-atual');
  var novaEl    = document.getElementById('ts-nova');
  var confirmEl = document.getElementById('ts-confirma');
  var btn       = document.getElementById('btn-ts');
  var errBox    = document.getElementById('ts-error');
  var errTxt    = document.getElementById('ts-error-text');

  errBox.classList.remove('visible');
  confirmEl.closest('.field').classList.remove('has-error');

  var atual    = atualEl.value;
  var nova     = novaEl.value;
  var confirma = confirmEl.value;

  if (!atual || !nova || !confirma) {
    errTxt.textContent = 'Preencha todos os campos.';
    errBox.classList.add('visible'); return;
  }
  if (!validatePassword(nova)) {
    errTxt.textContent = 'A nova senha não atende aos requisitos.';
    errBox.classList.add('visible'); return;
  }
  if (nova !== confirma) {
    confirmEl.closest('.field').classList.add('has-error'); return;
  }

  setBtnLoading(btn, true);

  Promise.all([sha256(atual), sha256(nova)]).then(function(hashes) {
    google.script.run
      .withSuccessHandler(function(res) {
        setBtnLoading(btn, false);
        if (res && res.success) {
          closeModalTrocarSenha();
          showToast('Senha alterada com sucesso!', 'success');
        } else {
          errTxt.textContent = (res && res.error) ? res.error : 'Erro inesperado.';
          errBox.classList.add('visible');
        }
      })
      .withFailureHandler(function() {
        setBtnLoading(btn, false);
        errTxt.textContent = 'Erro de conexão. Tente novamente.';
        errBox.classList.add('visible');
      })
      .trocarSenha(App.session.token, hashes[0], hashes[1]);
  });
}
