<style>
/* ══════════════════════════════════════════════════
   HOME · cabeçalho da igreja + indicadores + módulos + atividade
   Usa só os tokens do shell (cores, --sp-*, --fs-*). Nada de cor fixa:
   a paleta da igreja (aba Config) chega pelas variáveis --teal*.
══════════════════════════════════════════════════ */

/* ── Entrada suave, escalonada ── */
.hm-rise { opacity: 0; transform: translateY(12px); animation: hmRise .55s var(--ease-spring) forwards; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes hmRise { to { opacity: 1; transform: translateY(0); } }

/* ── Cartão institucional (topo): cor profunda da igreja, logo grande, grafismo temático ── */
/* A página da Início não tem moldura: o cartão vai de borda a borda, colado ao topo; o resto fica em .hm-body */
.page.hm { max-width: none; padding: 0 0 var(--sp-7); }
.hm-body, .hm-hero-in { max-width: var(--page-w, 1120px); margin: 0 auto; padding: 0 var(--gutter); }
.hm-hero-in { position: relative; z-index: 1; }
.hm-hero {
  position: relative; z-index: 5; margin-bottom: var(--sp-5); color: #fff;
  padding: calc(var(--sp-5) + env(safe-area-inset-top, 0px)) 0 var(--sp-4);
  border-radius: 0 0 var(--r-4) var(--r-4); box-shadow: var(--shadow-lg);
  background: linear-gradient(140deg, var(--hero-b) 0%, var(--hero-a) 100%);
}
.hm-art { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; color: #fff; }
.hm-art svg { position: absolute; right: 0; top: 0; width: 100%; height: 100%; }
.hm-top { position: absolute; top: calc(var(--sp-3) * -1); left: var(--gutter); right: var(--gutter); z-index: 2; display: flex; justify-content: space-between; align-items: center; }
.hm-top .hm-menu-wrap { margin-left: auto; }
.hm-burger { color: #fff; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .24); }
@media (min-width: 1024px) { .hm-burger { display: none !important; } }
.hm-menu-wrap { position: relative; flex-shrink: 0; }
.hm-me {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; font-family: inherit;
  font-size: var(--fs-sm); font-weight: 800; color: #fff; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .28);
  transition: background var(--dur) var(--ease);
}
.hm-me:hover { background: rgba(255, 255, 255, .24); }
.hm-me:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.hm-brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-2);  }
.hm-logo {
  width: 64px; height: 64px; flex-shrink: 0; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
  background: #FFFFFF; box-shadow: 0 0 0 2px var(--hero-gold), 0 10px 24px -10px rgba(0, 0, 0, .5);
}
.hm-logo .brand-mark { font-size: var(--fs-lg); color: var(--hero-a); }
.hm-logo .brand-mark img { padding: 0; }
.hm-id-txt { min-width: 0; }
.hm-eyebrow { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--hero-gold); }
.hm-title { margin-top: var(--sp-1); font-size: var(--fs-md); font-weight: 800; letter-spacing: -.01em; line-height: 1.25; color: #fff; overflow-wrap: anywhere; }
.hm-lema { max-width: 520px; margin: var(--sp-1) auto 0; font-size: var(--fs-sm); font-style: italic; line-height: 1.5; color: rgba(255, 255, 255, .82); }
@media (min-width: 768px) { .hm-logo { width: 88px; height: 88px; } .hm-title { font-size: var(--fs-lg); } }

/* ── Corpo: celular = uma coluna (atalhos, indicadores, aniversários, atividade, agenda);
   desktop = título simples no canto + coluna principal + coluna lateral com a agenda ── */
.hm-body { display: flex; flex-direction: column; }
.hm-main, .hm-side, .hm-mid, .hm-bot { display: contents; }
.hm-s-atalhos { order: 1; } .hm-s-kpis { order: 2; } .hm-s-anivs { order: 3; } .hm-s-ativ { order: 4; } .hm-s-agenda { order: 5; }
.hm-head { display: none; }
@media (min-width: 1024px) {
  /* Início desktop: ocupa o painel todo, em UMA tela (sem rolar a página): faixa de indicadores, meio, base e a agenda ao lado */
  .page.hm { max-width: none; width: 100%; height: max(520px, calc(100dvh - 2 * var(--shell-gap, 10px) - var(--topbar-h, 44px))); display: flex; flex-direction: column; padding: var(--sp-4) var(--gutter); }
  .hm-hero { display: none; }
  .hm-head { display: flex; margin-bottom: 0; }
  .hm-head .page-head-txt { position: relative; padding-left: var(--sp-3); }
  .hm-head .page-head-txt::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 4px; border-radius: var(--r-1); background: linear-gradient(var(--teal), transparent); }
  .hm-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(236px, 20vw, 292px); gap: var(--sp-4); align-items: stretch; padding: 0; max-width: none; margin: 0; }
  .hm-main { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: var(--sp-3); min-width: 0; min-height: 0; }
  .hm-mid, .hm-bot { display: grid; gap: var(--sp-3); min-width: 0; min-height: 0; }
  .hm-mid { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); }
  .hm-bot { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); }
  .hm-bot > :only-child { grid-column: 1 / -1; }
  .hm-s-kpis, .hm-s-atalhos { display: none; }
  .hm-faixa { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .hm-s-membros { display: flex; }
  .hm-side { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .hm-main .hm-block, .hm-side .hm-block { margin-bottom: 0; }

  /* cartão padrão da Início: mesmo vidro, borda e sombra em todos */
  .hm-card { display: flex; flex-direction: column; min-width: 0; min-height: 0; margin: 0; padding: var(--sp-3) var(--sp-4); overflow: hidden; border: 1px solid var(--border); border-radius: var(--r-4); box-shadow: var(--shadow-sm);
    background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--teal) 9%, transparent), transparent 60%), var(--bg2); }
  .hm-ch { display: flex; align-items: center; gap: var(--sp-2); margin: 0 0 var(--sp-2); font-size: var(--fs-md); font-weight: 800; letter-spacing: -.01em; color: var(--text); }
  .hm-ch > i, .hm-ch > svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--teal); }
  .hm-ch-t { flex: 1; min-width: 0; margin: 0; font-size: inherit; font-weight: inherit; }
  .hm-ch button, .hm-ch a { display: inline-flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-sm); font-weight: 700; color: var(--teal); background: none; border: 0; cursor: pointer; font-family: inherit; padding: 0; }
  .hm-ch button i, .hm-ch button svg { width: 14px; height: 14px; }
  .hm-s-anivs, .hm-s-ativ { margin: 0; padding: var(--sp-3) var(--sp-4); }
  .hm-s-anivs .hm-h, .hm-s-ativ .panel-head { margin-bottom: var(--sp-2); }
  .hm-s-anivs .hm-anivs, .hm-s-ativ .activity-list { flex: 1; min-height: 0; overflow-y: auto; }
  .hm-s-ativ .activity-list { border: 0; background: none; border-radius: 0; }
  .hm-s-ativ .activity-item { padding: var(--sp-2) 0; }
  .hm-card .hm-empty { flex: 1; justify-content: center; gap: var(--sp-1); padding: var(--sp-2); }
  .hm-card .hm-empty-icon { width: 36px; height: 36px; margin-bottom: var(--sp-1); }
  .hm-card .hm-empty-desc { font-size: var(--fs-xs); line-height: 1.4; }

  /* indicadores: UMA superfície com células separadas por divisória fina (sem caixa por indicador); rótulo, número grande, ícone suave */
  .hm-faixa { gap: 0; border: 1px solid var(--line); border-radius: var(--r-4); background: var(--surface-glass); box-shadow: var(--shadow-sm); overflow: hidden; }
  .hm-fk { position: relative; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-width: 0; padding: var(--sp-3) var(--sp-4); text-align: left; font-family: inherit; color: inherit; cursor: pointer; border: 0; background: transparent; transition: background var(--dur) var(--ease); }
  .hm-fk + .hm-fk { border-left: 1px solid var(--line); }
  .hm-fk:hover { background: var(--accent-soft); }
  .hm-fk:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .hm-fk-txt { display: flex; flex-direction: column-reverse; gap: 2px; min-width: 0; }
  .hm-fk-num { font-size: var(--fs-2xl); font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--text-1); }
  .hm-fk-lab { font-size: var(--fs-xs); font-weight: 600; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hm-fk-ic { width: 32px; height: 32px; flex-shrink: 0; display: grid; place-items: center; border-radius: var(--r-pill); color: var(--accent); background: var(--accent-soft); transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
  .hm-fk:hover .hm-fk-ic { background: var(--accent); color: var(--accent-fg); }
  .hm-fk-ic i, .hm-fk-ic svg { width: 16px; height: 16px; }

  /* rosca de membros */
  .hm-ro { flex: 1; min-height: 0; display: flex; align-items: center; gap: var(--sp-4); }
  .hm-ro svg { height: 100%; max-height: 120px; width: auto; aspect-ratio: 1; flex-shrink: 0; }
  .hm-ro-trilha { stroke: var(--line-2); }
  .hm-ro-arco { stroke: var(--accent); }
  .hm-ro-n { fill: var(--text-1); font-weight: 800; }
  .hm-ro-l { fill: var(--text-3); font-weight: 600; }
  .hm-leg { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
  .hm-leg-i { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--text-3); }
  .hm-leg-i i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .hm-leg-i.in i { background: var(--text-4); }
  .hm-leg-i.an i { background: var(--hero-gold); }
  .hm-leg-i span { flex: 1; }
  .hm-leg-i b { font-size: var(--fs-sm); font-weight: 800; color: var(--text-1); font-variant-numeric: tabular-nums; }

  /* ações rápidas: botões no cabeçalho, ao lado da saudação (a primeira é a ação principal) */
  .hm-acoes { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--sp-2); align-self: center; }
  .hm-ac { display: inline-flex; align-items: center; gap: var(--sp-2); height: 34px; padding: 0 var(--sp-4) 0 var(--sp-3); font-family: inherit; font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; color: var(--text-1); cursor: pointer;
    border: 1px solid var(--line-2); border-radius: var(--r-pill); background: var(--surface-2); transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .hm-ac i, .hm-ac svg { width: 16px; height: 16px; color: var(--accent); transition: color var(--dur) var(--ease); }
  .hm-ac:hover { border-color: var(--accent-line); background: var(--accent-soft); }
  .hm-ac:active { transform: translateY(1px) scale(.98); }
  .hm-ac:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hm-ac.pri { color: var(--accent-fg); border-color: transparent; background: linear-gradient(145deg, var(--accent), var(--accent-lo)); box-shadow: 0 6px 14px -8px var(--accent-glow); }
  .hm-ac.pri i, .hm-ac.pri svg { color: inherit; }
  .hm-ac.pri:hover { filter: brightness(1.07); }

  /* paginação das listas (pontos) */
  .hm-pg { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); padding-top: var(--sp-2); }
  .hm-pg button { width: 6px; height: 6px; padding: 0; border: 0; border-radius: var(--r-pill); background: var(--border2); cursor: pointer; transition: width var(--dur) var(--ease), background var(--dur) var(--ease); }
  .hm-pg button.on { width: 18px; background: var(--teal); }
  .hm-pg button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
}
/* só desktop: no celular a faixa, a rosca e as ações rápidas não existem */
.hm-faixa, .hm-s-membros, .hm-acoes { display: none; }
@media (min-width: 1024px) { .hm-faixa { display: grid; } .hm-s-membros { display: flex; } .hm-acoes { display: flex; } }

/* ── Blocos e títulos ── */
.hm-block { margin-bottom: var(--sp-5); }
.hm-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-3); font-size: var(--fs-md); font-weight: 700; letter-spacing: -.01em; color: var(--text); }
.hm-h-ic { display: none; }
.hm-h-t { flex: 1; min-width: 0; }
@media (min-width: 1024px) {
  .hm-h, .panel-title { align-items: center; }
  .hm-h-ic { display: inline-block; width: 18px; height: 18px; flex-shrink: 0; margin-right: var(--sp-2); color: var(--teal); }
  .hm-s-ativ .panel-title { display: flex; align-items: center; font-size: var(--fs-md); font-weight: 800; letter-spacing: -.01em; text-transform: none; color: var(--text); }
}
.hm-h a, .hm-h button { font-size: var(--fs-sm); font-weight: 700; color: var(--teal); background: none; border: 0; cursor: pointer; font-family: inherit; padding: 0; }

/* ── Atalhos: círculos, todos na cor da igreja (cor por assunto só em status) ── */
.hm-mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: var(--sp-3) var(--sp-2); }
.hm-mod {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); width: 100%; text-align: center;
  padding: 0; border: 0; background: none; color: inherit; font-family: inherit; cursor: pointer;
}
.hm-mod-icon {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--on-teal, #fff);
  background: var(--teal); box-shadow: 0 6px 14px -8px var(--teal-glow);
  transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.hm-mod-icon i, .hm-mod-icon svg { width: 22px; height: 22px; stroke-width: 2; }
.hm-mod:hover .hm-mod-icon { transform: translateY(-2px); box-shadow: 0 10px 18px -8px var(--teal-glow); }
.hm-mod:active .hm-mod-icon { transform: scale(.97); }
.hm-mod:focus-visible { outline: 2px solid var(--teal); outline-offset: 4px; border-radius: var(--r-3); }
.hm-mod-name { font-size: var(--fs-xs); font-weight: 600; letter-spacing: -.01em; color: var(--text); overflow-wrap: anywhere; }

/* Atalhos no desktop: grade de botões (ícone + nome); o círculo é só do celular */
@media (min-width: 1024px) {
  .hm-mods { grid-template-columns: repeat(auto-fill, minmax(150px, 190px)); gap: var(--sp-2); }
  .hm-mods .hm-mod { flex-direction: row; justify-content: flex-start; text-align: left; gap: var(--sp-2); padding: var(--sp-1) var(--sp-3) var(--sp-1) var(--sp-1); border: 1px solid var(--border); border-radius: var(--r-3); background: var(--bg2); transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease); }
  .hm-mods .hm-mod:hover { border-color: var(--teal-border); background: var(--bg3); }
  .hm-mods .hm-mod-icon { width: 30px; height: 30px; border-radius: var(--r-2); box-shadow: none; }
  .hm-mods .hm-mod:hover .hm-mod-icon { transform: none; box-shadow: none; }
  .hm-mods .hm-mod-icon i, .hm-mods .hm-mod-icon svg { width: 18px; height: 18px; }
  .hm-mods .hm-mod-name { font-size: var(--fs-sm); font-weight: 700; }
}

/* ── Indicadores: um cartão por módulo; o formato (grade, lista ou trio) vem do manifesto do módulo ── */
.kp { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-4); box-shadow: var(--shadow-sm); overflow: hidden; }
.kp + .kp { margin-top: var(--sp-3); }
/* desktop: cartões dos módulos lado a lado, quantos couberem */
@media (min-width: 1024px) {
  #kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--sp-4); align-items: stretch; }
}
.kp-h { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4) var(--sp-2); }
.kp-ic { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; color: var(--on-teal, #fff); background: var(--teal); }
.kp-ic i, .kp-ic svg { width: 16px; height: 16px; }
.kp-t { flex: 1; min-width: 0; margin: 0; font-size: var(--fs-md); font-weight: 800; color: var(--text); }
.kp-go { display: inline-flex; align-items: center; gap: var(--sp-1); min-height: 32px; padding: 0 var(--sp-1); border: 0; background: none; cursor: pointer; font-family: inherit; font-size: var(--fs-sm); font-weight: 700; color: var(--teal); }
.kp-go i, .kp-go svg { width: 14px; height: 14px; }
.kp-go:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: var(--r-2); }
.bn-lab { font-size: var(--fs-xs); font-weight: 600; color: var(--text-muted); line-height: 1.25; }
.bn-num { font-size: var(--fs-lg); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--text); }
.bn-card.is-zero .bn-num { color: var(--text-dim); }
/* grade: destaque + quadros menores */
.kp-grade { padding: 0 var(--sp-3) var(--sp-3); }
.bn-card.feat { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: var(--sp-1); min-height: 112px; padding: var(--sp-4); border-radius: var(--r-3); color: var(--on-teal, #fff);
  background: radial-gradient(circle at 85% 15%, rgba(255, 255, 255, .22), transparent 50%), linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%); }
.bn-card.feat .bn-lab, .bn-card.feat .bn-num, .bn-card.feat .bn-sub { color: inherit; }
.bn-card.feat .bn-num { font-size: var(--fs-2xl); }
.bn-sub { font-size: var(--fs-xs); opacity: .85; }
.bn-ghost { position: absolute; right: var(--sp-3); top: 50%; width: 76px; height: 76px; transform: translateY(-50%); opacity: .18; pointer-events: none; }
.bn-ghost svg { width: 100%; height: 100%; }
.kp-tiles { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: var(--sp-2); margin-top: var(--sp-2); }
.bn-tile { display: flex; flex-direction: column; gap: var(--sp-1); min-height: 64px; padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-3); }
/* lista: linha com ícone, rótulo e número */
.kp-lista { padding-bottom: var(--sp-1); }
.bn-row { display: flex; align-items: center; gap: var(--sp-3); min-height: 48px; padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--border); }
.bn-row:first-child { border-top: 0; }
.bn-row > i, .bn-row > svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--teal); }
.bn-row .bn-lab { flex: 1; font-size: var(--fs-sm); font-weight: 500; color: var(--text); }
.bn-row .bn-num { min-width: 40px; text-align: right; }
/* trio: três números lado a lado */
.kp-trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: var(--sp-1) var(--sp-2) var(--sp-3); }
.bn-cell { display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-1) var(--sp-3); border-left: 1px solid var(--border); }
.bn-cell:first-child { border-left: 0; }
.bn-cell .bn-num { font-size: var(--fs-xl); }
/* rodapé de status: sempre presente */
.kp-f { display: flex; align-items: center; gap: var(--sp-2); min-height: 48px; padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--border); font-size: var(--fs-sm); color: var(--text-muted); background: var(--bg3); }
.kp-f i, .kp-f svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--teal); }
.kp-f span { flex: 1; min-width: 0; }
.kp-f.warn { color: var(--text); background: color-mix(in srgb, var(--warning) 14%, transparent); }
.kp-f.warn i, .kp-f.warn svg { color: var(--warning); }
.kp-f button { min-height: 32px; padding: 0 var(--sp-1); border: 0; background: none; cursor: pointer; font-family: inherit; font-size: var(--fs-sm); font-weight: 800; color: color-mix(in srgb, var(--warning) 62%, #000); }
.kp-f button:focus-visible { outline: 2px solid var(--warning); outline-offset: 2px; border-radius: var(--r-2); }
/* desktop: cartões de módulo compactos e com a mesma altura (vem depois das regras-base de propósito) */
@media (min-width: 1024px) {
  .kp + .kp { margin-top: 0; }
  .kp { display: flex; flex-direction: column; }
  .kp-h { padding: var(--sp-2) var(--sp-3); }
  .kp-grade { padding: 0 var(--sp-2) var(--sp-2); }
  .bn-card.feat { min-height: 68px; padding: var(--sp-2) var(--sp-3); }
  .bn-tile { min-height: 44px; padding: var(--sp-1) var(--sp-3); }
  .kp-lista { flex: 1; display: flex; flex-direction: column; padding-bottom: 0; }

      var dd = document.getElementById('hm-user-dd');

      if (dd && wrap && !wrap.contains(e.target)) dd.classList.remove('open');
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDropdown(); });
  }

  if (_homeTem(cfg, 'kpis')) _loadKpis();
  if (comAniv) _loadAniv();
  if (comAtividade) _loadActivity();
  _agCarregar();
}


/* ══════════════════════════════════════════════════
   AGENDA · calendário do mês e eventos programados da igreja
   Todos veem; admin e secretaria agendam, editam e cancelam.
══════════════════════════════════════════════════ */
var AG = { itens: [], hoje: '', mes: '', sel: '', ok: false };
var AG_MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
var AG_MESES_CURTO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
var AG_SEMANA = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
var AG_DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];

function _agPode() { var p = App.session && App.session.perfil; return p === 'admin' || p === 'secretaria'; }
function _agDd(n) { return (n < 10 ? '0' : '') + n; }
function _agYmd(a, m, d) { return a + '-' + _agDd(m) + '-' + _agDd(d); }
function _agDataLonga(ymd) {
  var p = ymd.split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return AG_DIAS[d.getDay()].replace(/^./, function (c) { return c.toUpperCase(); }) + ', ' + Number(p[2]) + ' de ' + AG_MESES[Number(p[1]) - 1];
}

function _agSkeleton() {
  return '<div class="ag-cal"><div class="skeleton" style="width:100%;height:232px;border-radius:var(--r-3)"></div></div>' +
    '<div class="ag-lista"><div class="skeleton" style="width:100%;height:56px;border-radius:var(--r-3)"></div></div>';
}

function _agCarregar() {
  AG.ok = false;
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { _agErro(); return; }
      AG.itens = (res.data && res.data.itens) || [];
      AG.hoje = (res.data && res.data.hoje) || '';
      if (!AG.mes) AG.mes = AG.hoje.slice(0, 7);
      AG.ok = true;
      _agDesenhar();
    })
    .withFailureHandler(_agErro)
    .ag_listar(App.session.token);
}

function _agErro() {
  var el = document.getElementById('ag-root');
  if (!el) return;
  el.innerHTML = '<div class="ag-lista" style="border-top:0">' + _homeEstado('wifi-off', 'Não foi possível carregar a agenda',
    'Verifique sua internet e tente novamente.', _homeRetry('_agRecarregar'), true) + '</div>';
  if (window.lucide) lucide.createIcons();
}
function _agRecarregar() { var el = document.getElementById('ag-root'); if (el) el.innerHTML = _agSkeleton(); _agCarregar(); }

function _agDesenhar() {
  var el = document.getElementById('ag-root');
  if (!el) return;
  var pm = AG.mes.split('-'), ano = Number(pm[0]), mes = Number(pm[1]);
  var primeiro = new Date(ano, mes - 1, 1).getDay(), total = new Date(ano, mes, 0).getDate();
  var comEvento = {};
  AG.itens.forEach(function (e) { comEvento[e.data] = true; });

  var cel = AG_SEMANA.map(function (d) { return '<div class="ag-sem" aria-hidden="true">' + d + '</div>'; }).join('');
  for (var v = 0; v < primeiro; v++) cel += '<span></span>';
  for (var d = 1; d <= total; d++) {
    var ymd = _agYmd(ano, mes, d), tem = !!comEvento[ymd];
    cel += '<button type="button" class="ag-dia' + (ymd === AG.hoje ? ' hoje' : '') + (ymd === AG.sel ? ' sel' : '') + (tem ? ' tem' : '') + '" data-ymd="' + ymd + '" onclick="_agDia(\'' + ymd + '\')" aria-label="' +
      escHtml(_agDataLonga(ymd)) + (tem ? ', com evento' : '') + (ymd === AG.hoje ? ', hoje' : '') + '"' + (ymd === AG.sel ? ' aria-pressed="true"' : '') + '>' + d + '</button>';
  }

  /* lista: dia escolhido ou os próximos eventos (a partir de hoje) */
  var itens, titulo;
  if (AG.sel) { itens = AG.itens.filter(function (e) { return e.data === AG.sel; }); titulo = _agDataLonga(AG.sel); }
  else { itens = AG.itens.filter(function (e) { return e.data >= AG.hoje; }).slice(0, 5); titulo = 'Próximos eventos'; }

  var pode = _agPode();
  var corpo;
  if (!itens.length) {
    corpo = _homeEstado('calendar-plus', AG.sel ? 'Nada agendado neste dia' : 'Nenhum evento agendado',
      pode ? 'Agende cultos, reuniões e ações da igreja para que todos acompanhem aqui.' : 'Quando a igreja agendar um evento, ele aparece aqui.',
      pode ? '<button type="button" class="btn btn-primary btn-sm" onclick="agAbrir(\'\',\'' + (AG.sel || '') + '\')"><i data-lucide="plus" class="ic-15"></i> Agendar evento</button>' : '');
  } else {
    corpo = itens.map(function (e) {
      var p = e.data.split('-'), meta = [e.hora, e.local].filter(Boolean).join(' · ');
      var tag = pode ? 'button type="button" onclick="agAbrir(\'' + escHtml(e.id) + '\')" aria-label="Editar evento ' + escHtml(e.titulo) + '"' : 'div';
      return '<' + tag + ' class="ag-ev"><span class="ag-ev-d"><b>' + Number(p[2]) + '</b><span>' + AG_MESES_CURTO[Number(p[1]) - 1] + '</span></span>' +
        '<span class="ag-ev-t"><span class="ag-ev-n">' + escHtml(e.titulo) + '</span>' + (meta ? '<span class="ag-ev-m">' + escHtml(meta) + '</span>' : '') + '</span></' + (pode ? 'button' : 'div') + '>';
    }).join('');
  }

  el.innerHTML =
    '<div class="ag-cal">' +
      '<div class="ag-mes">' +
        '<button type="button" class="ag-nav" onclick="_agMes(-1)" aria-label="Mês anterior"><i data-lucide="chevron-left"></i></button>' +
        '<div class="ag-mes-nome" aria-live="polite">' + AG_MESES[mes - 1] + ' de ' + ano + '</div>' +
        '<button type="button" class="ag-nav" onclick="_agMes(1)" aria-label="Próximo mês"><i data-lucide="chevron-right"></i></button>' +
      '</div>' +
      '<div class="ag-grade">' + cel + '</div>' +
    '</div>' +
    '<div class="ag-lista">' +
      '<div class="ag-lh"><h2 class="ag-lt">' + escHtml(titulo) + '</h2>' +
        (AG.sel ? '<button type="button" onclick="_agDia(\'\')">Ver próximos</button>' : (pode && itens.length ? '<button type="button" onclick="agAbrir(\'\',\'\')">Agendar</button>' : '')) +
      '</div>' + corpo +
    '</div>';
  if (window.lucide) lucide.createIcons();
}

function _agMes(delta) {
  var p = AG.mes.split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
  AG.mes = d.getFullYear() + '-' + _agDd(d.getMonth() + 1);
  AG.sel = '';
  _agDesenhar();
}
function _agDia(ymd) { AG.sel = (AG.sel === ymd ? '' : ymd); if (AG.sel) AG.mes = AG.sel.slice(0, 7); _agDesenhar(); }

/* ── Formulário (janela): agendar, editar e cancelar ── */
function agAbrir(id, dataSugerida) {
  var ev = id ? AG.itens.filter(function (e) { return e.id === id; })[0] : null;
  if (id && !ev) return;
  var ov = document.getElementById('ag-overlay');
  if (!ov) { ov = document.createElement('div'); ov.id = 'ag-overlay'; ov.className = 'modal-overlay'; document.body.appendChild(ov); }
  var dataIni = ev ? ev.data : (dataSugerida || AG.hoje);
  ov.innerHTML =
    '<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="ag-titulo">' +
      '<div class="modal-header"><h3 id="ag-titulo">' + (ev ? 'Editar evento' : 'Agendar evento') + '</h3>' +
        '<button type="button" class="btn btn-ghost btn-sm" style="width:36px;padding:0" onclick="agFechar()" aria-label="Fechar">×</button></div>' +
      '<div class="modal-body">' +
        '<div id="ag-erro" role="alert"></div>' +
        '<div class="field"><label for="ag-nome">Nome do evento <span class="req">*</span></label><input id="ag-nome" type="text" maxlength="80" autocomplete="off" value="' + escHtml(ev ? ev.titulo : '') + '" placeholder="Ex.: Culto de doutrina"></div>' +
        '<div class="ag-form-linha">' +
          '<div class="field"><label for="ag-data">Data <span class="req">*</span></label><input id="ag-data" type="date" value="' + escHtml(dataIni) + '"></div>' +
          '<div class="field"><label for="ag-hora">Horário</label><input id="ag-hora" type="time" value="' + escHtml(ev ? ev.hora : '') + '"></div>' +
        '</div>' +
        '<div class="field"><label for="ag-local">Local</label><input id="ag-local" type="text" maxlength="80" autocomplete="off" value="' + escHtml(ev ? ev.local : '') + '" placeholder="Ex.: Templo principal"></div>' +
        '<div class="field"><label for="ag-desc">Observações</label><textarea id="ag-desc" maxlength="300">' + escHtml(ev ? ev.descricao : '') + '</textarea></div>' +
      '</div>' +
      '<div class="modal-footer">' +
        (ev ? '<button type="button" class="btn btn-danger" onclick="agCancelar(\'' + escHtml(ev.id) + '\')">Cancelar evento</button>' : '') +
        '<button type="button" class="btn btn-secondary" style="margin-left:auto" onclick="agFechar()">Fechar</button>' +
        '<button type="button" class="btn btn-primary" id="ag-salvar" onclick="agSalvar(\'' + (ev ? escHtml(ev.id) : '') + '\')">Salvar</button>' +
      '</div>' +
    '</div>';
  requestAnimationFrame(function () { ov.classList.add('open'); var f = document.getElementById('ag-nome'); if (f) f.focus(); });
  ov.onclick = function (e) { if (e.target === ov) agFechar(); };
}
function agFechar() {
  var ov = document.getElementById('ag-overlay');
  if (!ov) return;
  ov.classList.remove('open');
  setTimeout(function () { if (!ov.classList.contains('open')) ov.innerHTML = ''; }, 280);
}
function _agMsg(t) { var e = document.getElementById('ag-erro'); if (!e) return; e.textContent = t || ''; e.classList.toggle('on', !!t); }

function agSalvar(id) {
  var dados = {
    id: id || '',
    titulo: document.getElementById('ag-nome').value,
    data: document.getElementById('ag-data').value,
    hora: document.getElementById('ag-hora').value,
    local: document.getElementById('ag-local').value,
    descricao: document.getElementById('ag-desc').value
  };
  if (!String(dados.titulo).trim()) { _agMsg('Informe o nome do evento.'); return; }
  if (!dados.data) { _agMsg('Informe a data do evento.'); return; }
  var b = document.getElementById('ag-salvar'); b.disabled = true; _agMsg('');
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { b.disabled = false; _agMsg((res && res.error) || 'Não foi possível salvar o evento.'); return; }
      agFechar();
      showToast(id ? 'Evento atualizado.' : 'Evento agendado.', 'success');
      AG.sel = ''; AG.mes = dados.data.slice(0, 7);
      _agCarregar();
    })
    .withFailureHandler(function () { b.disabled = false; _agMsg('Sem conexão com o servidor. Tente novamente.'); })
    .ag_salvar(App.session.token, dados);
}

function agCancelar(id) {
  var ev = AG.itens.filter(function (e) { return e.id === id; })[0];
  if (!ev) return;
  showConfirm('O evento <b>' + escHtml(ev.titulo) + '</b> deixa de aparecer na agenda.', { title: 'Cancelar evento?', confirmLabel: 'Cancelar evento', cancelLabel: 'Manter' }).then(function (ok) {
    if (!ok) return;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) { showToast((res && res.error) || 'Não foi possível cancelar o evento.', 'error'); return; }
        agFechar(); showToast('Evento cancelado.', 'success'); AG.sel = ''; _agCarregar();
      })
      .withFailureHandler(function () { showToast('Sem conexão com o servidor.', 'error'); })
      .ag_remover(App.session.token, id);
  });
}

/* ── HELPERS ── */
function _kpiSkeleton() {
  var linha = '<div class="bn-card bn-row is-loading"><div class="skeleton" style="width:18px;height:18px;border-radius:var(--r-1)"></div><div class="skeleton" style="flex:1;height:12px;border-radius:var(--r-1)"></div><div class="skeleton" style="width:36px;height:20px;border-radius:var(--r-1)"></div></div>';
  return '<div class="kp"><div class="kp-h"><div class="skeleton" style="width:32px;height:32px;border-radius:50%"></div><div class="skeleton" style="width:120px;height:14px;border-radius:var(--r-1)"></div></div>' +
    '<div class="kp-lista">' + linha + linha + linha + '</div></div>';
}

/* Cada módulo vira um cartão: cabeçalho, corpo no formato que o módulo declara e rodapé de status (sempre presente). */
function _kpiNum(k) { return (k.valor === undefined || k.valor === null) ? '—' : String(k.valor); }
function _kpiZero(k) { return (k.valor === undefined || k.valor === null || k.valor === 0) ? ' is-zero' : ''; }
function _kpiIcone(k) { return escHtml(k.icone || 'bar-chart-3'); }

function _kpiCorpo(layout, stats) {
  if (!stats.length) return '';
  if (layout === 'grade') {
    var iF = 0;
    stats.forEach(function (k, n) { if (k.curto === 'Ativos') iF = n; });
    var f = stats[iF], resto = stats.filter(function (k, n) { return n !== iF; });
    var sub = f.valor ? '' : (f.vazio || '');
    var irmao = stats.filter(function (k) { return k.curto === 'Inativos'; })[0];
    if (f.valor && f.curto === 'Ativos' && irmao) {
      var tot = f.valor + (irmao.valor || 0);
      sub = 'de ' + tot + ' cadastrados · ' + Math.round(f.valor * 100 / tot) + '%';
    }
    return '<div class="kp-grade"><div class="bn-card feat' + _kpiZero(f) + '" data-k="' + escHtml(f.curto || '') + '">' +
      '<span class="bn-ghost" aria-hidden="true"><i data-lucide="' + _kpiIcone(f) + '"></i></span>' +
      '<span class="bn-lab">' + escHtml(f.curto || f.rotulo || '') + '</span><span class="bn-num">' + escHtml(_kpiNum(f)) + '</span>' +
      '<span class="bn-sub">' + escHtml(sub || ' ') + '</span></div>' +
      (resto.length ? '<div class="kp-tiles" style="--n:' + Math.min(resto.length, 3) + '">' + resto.map(function (k) {
        return '<div class="bn-card bn-tile' + _kpiZero(k) + '" data-k="' + escHtml(k.curto || '') + '"><span class="bn-lab">' + escHtml(k.curto || k.rotulo || '') + '</span><span class="bn-num">' + escHtml(_kpiNum(k)) + '</span></div>';
      }).join('') + '</div>' : '') + '</div>';
  }
  if (layout === 'lista') {
    return '<div class="kp-lista">' + stats.map(function (k) {
      return '<div class="bn-card bn-row' + _kpiZero(k) + '" data-k="' + escHtml(k.curto || '') + '"><i data-lucide="' + _kpiIcone(k) + '"></i>' +
        '<span class="bn-lab">' + escHtml(k.curto || k.rotulo || '') + '</span>' +
        '<span class="bn-num">' + escHtml(_kpiNum(k)) + '</span></div>';
    }).join('') + '</div>';
  }
  return '<div class="kp-trio">' + stats.slice(0, 3).map(function (k) {
    return '<div class="bn-card bn-cell' + _kpiZero(k) + '" data-k="' + escHtml(k.curto || '') + '"><span class="bn-num">' + escHtml(_kpiNum(k)) + '</span><span class="bn-lab">' + escHtml(k.curto || k.rotulo || '') + '</span></div>';
  }).join('') + '</div>';
}

function _kpiRodape(alertas, rota) {
  if (!alertas.length) return '<div class="kp-f ok"><i data-lucide="check-circle-2"></i><span>Nada pendente</span></div>';
  return alertas.map(function (k) {
    var rot = String(k.rotulo || k.curto || '').toLowerCase();
    if (k.valor === 1) rot = rot.replace(/^membros\b/, 'membro').replace(/^chamadas\b/, 'chamada');
    var dest = k.destino || rota;
    return '<div class="kp-f warn" data-k="' + escHtml(k.curto || '') + '"><i data-lucide="alert-triangle"></i><span><b>' + escHtml(k.valor) + '</b> ' + escHtml(rot) + '</span>' +
      (dest ? '<button type="button" onclick="navigateTo(\'' + escHtml(dest) + '\')">' + escHtml(k.acao || 'Resolver') + '</button>' : '') + '</div>';
  }).join('');
}

function _kpiHtml(d) {
  var grupos = [], idx = {};
  d.forEach(function (k) {
    var id = k.modulo || 'geral';
    if (idx[id] === undefined) { idx[id] = grupos.length; grupos.push({ id: id, nome: k.moduloNome || '', icone: k.moduloIcone || 'layout-grid', rota: k.moduloRota || '', layout: k.layout || 'trio', kpis: [] }); }
    grupos[idx[id]].kpis.push(k);
  });
  return grupos.map(function (g) {
    var stats = g.kpis.filter(function (k) { return !k.alerta; });
    var alertas = g.kpis.filter(function (k) { return k.alerta && (k.valor || 0) > 0; });
    return '<section class="kp" data-modulo="' + escHtml(g.id) + '"><div class="kp-h"><span class="kp-ic"><i data-lucide="' + escHtml(g.icone) + '"></i></span>' +
      '<h3 class="kp-t">' + escHtml(g.nome) + '</h3>' +
      (g.rota ? '<button type="button" class="kp-go" onclick="navigateTo(\'' + escHtml(g.rota) + '\')">Abrir<i data-lucide="chevron-right"></i></button>' : '') + '</div>' +
      _kpiCorpo(g.layout, stats) + _kpiRodape(alertas, g.rota) + '</section>';
  }).join('');
}

function _anivSkeleton() {
  return '<div class="hm-aniv"><div class="skeleton" style="width:48px;height:48px;border-radius:50%"></div><div class="skeleton" style="width:70%;height:13px"></div><div class="skeleton" style="width:40px;height:18px;border-radius:var(--r-pill)"></div></div>';
}
function _activitySkeleton() {
  return '<div class="activity-item">' +
    '<div class="skeleton" style="width:36px;height:36px;border-radius:50%;flex-shrink:0"></div>' +
    '<div class="activity-body">' +
      '<div class="skeleton" style="width:70%;height:13px;margin-bottom:6px"></div>' +
      '<div class="skeleton" style="width:35%;height:11px"></div>' +
    '</div>' +
  '</div>';
}


function _moduleBtn(icon, name, desc, view, n) {
  return '<button class="hm-mod" onclick="navigateTo(\'' + view + '\')"' + (desc ? ' title="' + escHtml(desc) + '"' : '') + '>' +
    '<div class="hm-mod-icon"><i data-lucide="' + escHtml(icon) + '"></i></div>' +
    '<div class="hm-mod-name">' + escHtml(name) + '</div>' +
  '</button>';
}

function _homeRetry(fn) {
  return '<button class="btn btn-ghost btn-sm" onclick="' + fn + '()"><i data-lucide="refresh-cw" class="ic-14"></i> Tentar de novo</button>';
}

function _loadKpis() {
  function mostrar(html, soDesk) {
    var grid = document.getElementById('kpi-grid');
    if (!grid) return;
    grid.innerHTML = html;
    if (soDesk) { var fx = document.getElementById('hm-faixa'), ro = document.getElementById('hm-rosca'); if (fx) fx.innerHTML = html; if (ro) ro.innerHTML = ''; } /* desktop: o erro aparece onde os números ficariam */
    if (window.lucide) setTimeout(function () { lucide.createIcons(); }, 0);
  }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        mostrar(_homeEstado('alert-triangle', 'Não foi possível carregar os indicadores',
          (res && res.error) ? escHtml(res.error) : 'Tente novamente em instantes.', _homeRetry('_homeRecarregarKpis'), true), true);
        return;
      }
      var d = res.data || [];
      if (!d.length) {
        mostrar(_homeEstado('bar-chart-3', 'Sem indicadores por enquanto',
          'Quando houver módulos com dados para o seu perfil, os números aparecem aqui.'), true);
        return;
      }
      mostrar(_kpiHtml(d));
      _homeDeskKpis(d);
      if (typeof sinoUsar === 'function') sinoUsar(d);
    })
    .withFailureHandler(function () {
      mostrar(_homeEstado('wifi-off', 'Sem conexão com o servidor',
        'Verifique sua internet e tente novamente.', _homeRetry('_homeRecarregarKpis'), true), true);
    })
    .getKpisHome(App.session.token);
}
/* Desktop: a faixa e a rosca nascem dos mesmos indicadores dos módulos (campo "faixa" no manifesto) */
function _homeDeskKpis(d) {
  var fx = document.getElementById('hm-faixa');
  if (fx) fx.innerHTML = d.filter(function (k) { return k.faixa; }).map(function (k) {
    var dest = k.destino || k.moduloRota || '';
    return '<button type="button" class="hm-fk"' + (dest ? ' onclick="navigateTo(\'' + escHtml(dest) + '\')"' : '') + '>' +
      '<span class="hm-fk-txt"><span class="hm-fk-num">' + escHtml(_kpiNum(k)) + '</span><span class="hm-fk-lab">' + escHtml(k.rotulo || k.curto || '') + '</span></span>' +
      '<span class="hm-fk-ic"><i data-lucide="' + _kpiIcone(k) + '"></i></span></button>';
  }).join('');
  var ro = document.getElementById('hm-rosca');
  if (ro) {
    var v = {};
    d.forEach(function (k) { if (k.modulo === 'membros') v[k.curto] = k.valor || 0; });
    var at = v['Ativos'] || 0, ina = v['Inativos'] || 0, tot = at + ina, c = 2 * Math.PI * 38;
    ro.innerHTML = '<svg viewBox="0 0 100 100" role="img" aria-label="' + at + ' membros ativos de ' + tot + '">' +
      '<circle class="hm-ro-trilha" cx="50" cy="50" r="38" fill="none" stroke-width="11"/>' +
      (tot ? '<circle class="hm-ro-arco" cx="50" cy="50" r="38" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + (c * at / tot).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 50 50)"/>' : '') +
      '<text class="hm-ro-n" font-size="22" x="50" y="50" text-anchor="middle">' + tot + '</text><text class="hm-ro-l" font-size="8" x="50" y="63" text-anchor="middle">cadastrados</text></svg>' +
      '<div class="hm-leg"><div class="hm-leg-i"><i></i><span>Ativos</span><b>' + at + '</b></div>' +
      '<div class="hm-leg-i in"><i></i><span>Inativos</span><b>' + ina + '</b></div>' +

function homeToggleMenu(e) {

}
function toggleUserDropdown() {

function closeDropdown() {
  ['user-dropdown', 'hm-user-dd'].forEach(function (id) {
    var dd = document.getElementById(id);
    if (dd) dd.classList.remove('open');
  });
}

function homeToggleNavCfg(e) {
  if (e) e.stopPropagation();
  var dd = document.getElementById('home-nav-cfg-dd');
  if (!dd) return;
  var opening = !dd.classList.contains('open');
  dd.classList.toggle('open');
  if (opening) {
    if (window.lucide) lucide.createIcons();
    setTimeout(function() {
      document.addEventListener('click', function _close(ev) {
        if (!dd.contains(ev.target)) {
          dd.classList.remove('open');
          document.removeEventListener('click', _close);
        }
      });
    }, 0);
  }
}

/* ── MODAL TROCA DE SENHA ── */
function showTrocarSenha() {
  closeDropdown();
  var m = document.getElementById('modal-troca-senha');
  if (m) {
    m.classList.add('open');
    ['ts-atual','ts-nova','ts-confirma'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    var errBox = document.getElementById('ts-error');
    if (errBox) errBox.classList.remove('visible');
    if (window.lucide) lucide.createIcons();
  }
}
function closeModalTrocarSenha() {
  var m = document.getElementById('modal-troca-senha');
  if (m) m.classList.remove('open');
}

function tsCheckStrength() {
  var pwd   = document.getElementById('ts-nova').value;
  var fill  = document.getElementById('ts-strength-fill');
  var label = document.getElementById('ts-strength-label');
  var s     = getPasswordStrength(pwd);
  var pcts  = { weak: '25%', medium: '65%', strong: '100%' };
  fill.style.width      = pwd.length ? pcts[s.level] : '0%';
  fill.style.background = s.color;
  label.textContent     = pwd.length ? ('Senha ' + s.label) : '';
  label.style.color     = s.color;
}

function handleTrocarSenha() {
  var atualEl   = document.getElementById('ts-atual');
  var novaEl    = document.getElementById('ts-nova');
  var confirmEl = document.getElementById('ts-confirma');
  var btn       = document.getElementById('btn-ts');
  var errBox    = document.getElementById('ts-error');
  var errTxt    = document.getElementById('ts-error-text');

  errBox.classList.remove('visible');
  confirmEl.closest('.field').classList.remove('has-error');

  var atual    = atualEl.value;
  var nova     = novaEl.value;
  var confirma = confirmEl.value;

  if (!atual || !nova || !confirma) {
    errTxt.textContent = 'Preencha todos os campos.';
    errBox.classList.add('visible'); return;
  }
  if (!validatePassword(nova)) {
    errTxt.textContent = 'A nova senha não atende aos requisitos.';
    errBox.classList.add('visible'); return;
  }
  if (nova !== confirma) {
    confirmEl.closest('.field').classList.add('has-error'); return;
  }

  setBtnLoading(btn, true);

  Promise.all([sha256(atual), sha256(nova)]).then(function(hashes) {
    google.script.run
      .withSuccessHandler(function(res) {
        setBtnLoading(btn, false);
        if (res && res.success) {
          closeModalTrocarSenha();
          showToast('Senha alterada com sucesso!', 'success');
        } else {
          errTxt.textContent = (res && res.error) ? res.error : 'Erro inesperado.';
          errBox.classList.add('visible');
        }
      })
      .withFailureHandler(function() {
        setBtnLoading(btn, false);
        errTxt.textContent = 'Erro de conexão. Tente novamente.';
        errBox.classList.add('visible');
      })
      .trocarSenha(App.session.token, hashes[0], hashes[1]);
  });
}
