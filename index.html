/* ══════════════════════════════════════════════════════════════════
   DESIGN SYSTEM CINEMATIC PREMIUM v4
   Interface ultra-refinada com glassmorphism, gradientes e glows
══════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────────────────
   TOKENS — CINEMATIC DARK SYSTEM
───────────────────────────────────────────── */
:root {
  --bg:               #050B10;
  --bg2:              #08131A;
  --bg3:              #101C24;
  --bg4:              #162835;
  --bg5:              #1E3546;

  --bg-glass:         rgba(17, 27, 34, 0.55);
  --bg-glass-strong:  rgba(14, 24, 32, 0.85);
  --bg-elevated:      rgba(20, 32, 42, 0.98);

  --teal:             #00D9C6;
  --teal-light:       #00FFF0;
  --teal-dark:        #00A99C;
  --teal-dim:         rgba(0, 217, 198, 0.12);
  --teal-border:      rgba(0, 217, 198, 0.25);
  --teal-glow:        rgba(0, 217, 198, 0.3);
  --teal-glow-soft:   rgba(0, 217, 198, 0.08);

  --cyan:             #4DA3FF;
  --purple:           #9B7CFF;
  --purple-dim:       rgba(155, 124, 255, 0.12);
  --gold:             #D7B15B;
  --gold-dim:         rgba(215, 177, 91, 0.12);

  --success:          #36D399;
  --success-dim:      rgba(54, 211, 153, 0.12);
  --danger:           #FF5E7A;
  --danger-dim:       rgba(255, 94, 122, 0.12);
  --warning:          #FFC857;

  --text:             #F4FBFF;
  --text-soft:        #D8E5EA;
  --text-muted:       #88A2AE;
  --text-dim:         #55717D;

  --border:           rgba(255, 255, 255, 0.08);
  --border2:          rgba(255, 255, 255, 0.12);
  --border-strong:    rgba(255, 255, 255, 0.18);

  --glass-line:       rgba(255, 255, 255, 0.06);

  --shadow-sm:        0 4px 18px rgba(0, 0, 0, 0.3);
  --shadow:           0 12px 40px rgba(0, 0, 0, 0.5);
  --shadow-lg:        0 30px 100px rgba(0, 0, 0, 0.7);

  --shadow-glow:
    0 0 0 1px rgba(255, 255, 255, 0.03),
    0 12px 48px rgba(0, 0, 0, 0.5),
    0 0 40px color-mix(in srgb, var(--teal) 6%, transparent);

  --radius-sm:        12px;
  --radius:           18px;
  --radius-lg:        24px;
  --radius-xl:        32px;

  --ease:             cubic-bezier(.25, .46, .45, .94);
  --ease-spring:      cubic-bezier(.16, 1, .3, 1);

  --noise-opacity:    0.04;
  --logo-filter:      drop-shadow(0 0 12px color-mix(in srgb, var(--teal) 20%, transparent));
  --logo-filter2: #000000;
  --scrollbar:        rgba(255, 255, 255, 0.16);

  /* Gutter lateral responsivo — cresce com a largura da tela.
     Em mobile permanece igual ao padding fixo original (16px). */
  --gutter: 16px;
  --gutter-lg: 16px; /* usado em seções de respiro mais generoso (módulos, listas) */

  /* Largura máxima padrão da coluna de conteúdo central — usada por TODOS os
     módulos (tabs + área de conteúdo) para garantir alinhamento consistente
     entre Membros, Usuários, etc. */
  --content-max: 960px;

  /* Escala de espaçamento (múltiplos de 4px) e de texto — use estes tokens, não números soltos */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;
  --fs-xs: 11px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 18px; --fs-xl: 24px; --fs-2xl: 32px;
  --sidebar-w: 264px;
}

/* Notebooks/tablets — começa a abrir respiro nas laterais */
@media (min-width: 900px) {
  :root { --gutter: 56px; --gutter-lg: 88px; }
}
/* Telas grandes (desktop, notebooks 1440p+) */
@media (min-width: 1280px) {
  :root { --gutter: 88px; --gutter-lg: 136px; }
}
/* Monitores ultra-wide */
@media (min-width: 1600px) {
  :root { --gutter: 120px; --gutter-lg: 180px; }
}


/* ─────────────────────────────────────────────
   LIGHT MODE PREMIUM
───────────────────────────────────────────── */

[data-theme="light"] {
  --bg:               #F8FAFC; /* Slate 50 */
  --bg2:              #FFFFFF; /* Pure White */
  --bg3:              #F1F5F9; /* Slate 100 */
  --bg4:              #E2E8F0; /* Slate 200 */
  --bg5:              #CBD5E1; /* Slate 300 */

  --bg-glass:         rgba(255, 255, 255, 0.75);
  --bg-glass-strong:  rgba(255, 255, 255, 0.94);
  --bg-elevated:      #FFFFFF;

  /* Teais Saturação Enterprise */
  --teal:             #00897B; 
  --teal-light:       #00BFA5; 
  --teal-dark:        #00695C; 
  --teal-dim:         rgba(0, 137, 123, 0.08);
  --teal-border:      rgba(0, 137, 123, 0.2);
  --teal-glow:        rgba(0, 137, 123, 0.1);
  --teal-glow-soft:   rgba(0, 137, 123, 0.04);

  --cyan:             #0284C7; 
  --purple:           #4F46E5; 
  --purple-dim:       rgba(79, 70, 229, 0.08);
  --gold:             #B45309; 
  --gold-dim:         rgba(180, 83, 9, 0.08);

  --success:          #16A34A; 
  --success-dim:      rgba(22, 163, 74, 0.08);
  --danger:           #DC2626; 
  --danger-dim:       rgba(220, 38, 38, 0.08);
  --warning:          #D97706;

  /* Tipografia Ultra-Nítida */
  --text:             #0F172A; /* Slate 900 */
  --text-soft:        #334155; /* Slate 700 */
  --text-muted:       #475569; /* Slate 600 */
  --text-dim:         #64748B; /* Slate 500 */

  /* Bordas Cirúrgicas Estilo Stripe */
  --border:           #E2E8F0; 
  --border2:          #CBD5E1; 
  --border-strong:    #94A3B8; 

  --glass-line:       rgba(255, 255, 255, 0.8);

  --shadow-sm:        0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow:           0 1px 3px 0 rgba(0, 0, 0, 0.1);
  --shadow-lg:        0 10px 15px -3px rgba(15, 23, 42, 0.05);
  --shadow-glow:      0 4px 6px -1px rgba(15, 23, 42, 0.03);

  --logo-filter:      none;
  --scrollbar:        #CBD5E1;
}
/* Ajuste de Orbes de fundo para o Light Mode não parecer sujo */
[data-theme="light"] body::before {
  background:
    radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--teal) 6%, transparent), transparent 40%),
    radial-gradient(circle at 100% 0%, rgba(2, 132, 199, 0.05), transparent 40%),
    var(--bg);
}
[data-theme="light"] .orb { opacity: 0.03; }

/* ─────────────────────────────────────────────
   CONSTANTES
───────────────────────────────────────────── */
:root {
  --r-xs:  6px;
  --r-sm:  10px;
  --r:     14px;
  --r-lg:  20px;
  --r-xl:  28px;
  --r-2xl: 36px;
  --ease:  cubic-bezier(.25, .46, .45, .94);
  --ease-spring: cubic-bezier(.16, 1, .3, 1);
}

/* ─────────────────────────────────────────────
   BASE & BACKGROUNDS CINEMATOGRÁFICOS
───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; height: 100%; }

body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -3;
  pointer-events: none;
  background:
    radial-gradient(circle at 10% 10%, color-mix(in srgb, var(--teal) 12%, transparent), transparent 35%),
    radial-gradient(circle at 90% 20%, rgba(84, 184, 255, 0.10), transparent 35%),
    radial-gradient(circle at 50% 80%, rgba(155, 124, 255, 0.08), transparent 40%),
    var(--bg);
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 255, 255, var(--noise-opacity)) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, var(--noise-opacity)) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(circle at center, black, transparent 90%);
  opacity: .35;
}

/* ── ORBES DE AMBIÊNCIA GLOW ── */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(140px);
  opacity: .15;
  pointer-events: none;
  z-index: -1;
  animation: orbFloat 22s ease-in-out infinite alternate;
}

.orb-1 {
  width: 460px;
  height: 460px;
  background: var(--teal);
  top: -160px;
  left: -120px;
}

.orb-2 {
  width: 380px;
  height: 380px;
  background: var(--cyan);
  bottom: -100px;
  right: -100px;
}

@keyframes orbFloat {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(40px, -30px, 0) scale(1.1); }
}

::selection { background: var(--teal-border); color: var(--text); }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 6px; }

/* ─────────────────────────────────────────────
   LOGO COM FILTRO GLOW
───────────────────────────────────────────── */
.app-logo-img {
  display: block;
  filter: var(--logo-filter);
  transition: filter .3s var(--ease);
}

/* ─────────────────────────────────────────────
   LOADER CINEMÁTICO
───────────────────────────────────────────── */
#app-loader {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 24px;
  z-index: 9999;
  transition: opacity .45s var(--ease-spring), visibility .45s;
}
#app-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.loader-logo {
  width: 76px; height: 76px;
  border-radius: 22px;
  background: var(--teal-dim);
  border: 1.5px solid var(--teal-border);
  display: flex; align-items: center; justify-content: center;
  animation: loaderPulse 2.4s ease-in-out infinite;
}
@keyframes loaderPulse {
  0%,100% { box-shadow: 0 0 0 0 var(--teal-border), 0 0 24px var(--teal-glow-soft); }
  50%      { box-shadow: 0 0 0 16px transparent, 0 0 44px var(--teal-dim); }
}

.loader-spinner {
  width: 32px; height: 32px;
  border: 2.5px solid var(--border2);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loader-text {
  font-size: 11px; font-family: 'DM Mono', monospace;
  color: var(--text-dim); letter-spacing: 0.8px;
  text-transform: uppercase;
}

/* ─────────────────────────────────────────────
   APP ROOT
───────────────────────────────────────────── */
#app {
  min-height: 100vh; min-height: 100dvh;
  opacity: 0; transition: opacity .4s var(--ease);
  position: relative; z-index: 1;
  max-width: 1440px;
  margin: 0 auto;
}
#app.ready { opacity: 1; }

/* ─────────────────────────────────────────────
   TOAST NOTIFICATION (GLASS DESIGN)
───────────────────────────────────────────── */
#toast-container {
  position: fixed; bottom: 94px; right: 16px;
  display: flex; flex-direction: column; gap: 10px;
  z-index: 10000; pointer-events: none;
}
@media (min-width: 600px) { #toast-container { bottom: 24px; right: 24px; } }

.toast {
  background: var(--bg-glass-strong);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  font-size: 13px; color: var(--text);
  display: flex; align-items: center; gap: 12px;
  box-shadow: var(--shadow-lg), var(--shadow-glow);
  pointer-events: auto;
  backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  animation: toastIn .38s var(--ease-spring);
  max-width: 360px; min-width: 240px;
}
.toast.success { border-left: 3.5px solid var(--success); }
.toast.error   { border-left: 3.5px solid var(--danger);   }
.toast.info    { border-left: 3.5px solid var(--teal);  }
.toast.warning { border-left: 3.5px solid var(--gold);  }
.toast-icon { font-size: 16px; flex-shrink: 0; }
.toast-msg  { flex: 1; font-size: 13px; line-height: 1.45; font-weight: 600; }
.toast-close {
  background: none; border: none; cursor: pointer;
  color: var(--text-dim); font-size: 18px; padding: 0; line-height: 1;
  flex-shrink: 0; transition: color .15s;
}
.toast-close:hover { color: var(--text-muted); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px) scale(.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.toast.hiding { animation: toastOut .22s var(--ease) forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px) scale(.95); } }

/* ─────────────────────────────────────────────
   MODAL — BOTTOM SHEET MOBILE & CENTERED DESKTOP
───────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 5000;
  opacity: 0; visibility: hidden;
  transition: opacity .3s var(--ease), visibility .3s;
}
.modal-overlay.open { opacity: 1; visibility: visible; }

.modal-box {
  background: var(--bg3);
  border: 1.5px solid var(--border2);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  width: 100%; max-width: 520px;
  max-height: 90dvh; overflow-y: auto;
  padding: 36px 24px 40px;
  box-shadow: var(--shadow-lg), 0 -8px 48px rgba(0, 0, 0, 0.6);
  transform: translateY(32px);
  transition: transform .35s var(--ease-spring);
  position: relative;
}
/* Handle */
.modal-box::before {
  content: '';
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  width: 42px; height: 4px; border-radius: 2px;
  background: var(--border2);
}
/* Teal accent line */
.modal-box::after {
  content: '';
  position: absolute; top: 0; left: 20%; right: 20%; height: 2.5px;
  background: linear-gradient(90deg, transparent, var(--teal), transparent);
  border-radius: 0 0 2px 2px;
}
.modal-overlay.open .modal-box { transform: translateY(0); }

@media (min-width: 600px) {
  .modal-overlay { align-items: center; padding: 18px; }
  .modal-box {
    border-radius: var(--radius-lg);
    transform: translateY(20px) scale(.97);
  }
  .modal-box::before { display: none; }
  .modal-overlay.open .modal-box { transform: translateY(0) scale(1); }
}

/* ── CONFIRM MODAL (substitui window.confirm) ── */
.confirm-box {
  max-width: 380px; text-align: center;
  padding: 32px 28px 28px;
}
.confirm-icon {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
  background: var(--teal-dim); color: var(--teal);
}
.confirm-icon.danger { background: var(--danger-dim); color: var(--danger); }
.confirm-icon i { width: 24px; height: 24px; }
.confirm-title {
  font-size: 17px; font-weight: 800; color: var(--text);
  margin-bottom: 8px;
}
.confirm-message {
  font-size: 13.5px; color: var(--text-muted); line-height: 1.5;
  margin-bottom: 24px;
}
.confirm-actions {
  display: flex; gap: 10px;
}
.confirm-actions button { flex: 1; }

/* ── ESTRUTURA HEADER/BODY/FOOTER — RODAPÉ SEMPRE VISÍVEL ──
   Modais antigos (bloco único) continuam funcionando normalmente.
   Modais que adotam .modal-header/.modal-body/.modal-footer ganham
   automaticamente cabeçalho fixo + corpo rolável + botões sempre
   visíveis — nunca mais cortados em telas baixas. */
.modal-box:has(.modal-footer) {
  display: flex; flex-direction: column;
  overflow: hidden; /* a rolagem passa a ser só do .modal-body */
}
.modal-header {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.modal-header h3 { font-size: 17px; font-weight: 800; color: var(--text); }
.modal-body {
  flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
  margin: 0 -4px; padding: 0 4px; /* evita cortar sombra/focus ring dos inputs */
}
.modal-footer {
  flex-shrink: 0;
  display: flex; gap: 10px;
  padding-top: 16px; margin-top: 14px;
  border-top: 1px solid var(--border);
}

/* ─────────────────────────────────────────────
   BOTÕES GLOW PREMIUM (ESTILO STRIPE/LINEAR)
───────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; height: 48px; min-width: 48px; padding: 0 24px;
  border-radius: var(--radius);
  border: 1.5px solid transparent;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all .24s var(--ease);
  text-decoration: none; white-space: nowrap;
  position: relative; overflow: hidden; letter-spacing: .2px;
  isolation: isolate;
}
.btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.15), transparent);
  opacity: .5; z-index: -1; transition: opacity .2s;
}
.btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, var(--teal-light) 0%, var(--teal-dark) 100%);
  color: #fff;
  box-shadow: 0 8px 24px var(--teal-glow-soft), inset 0 1px 0 rgba(255,255,255,.2);
}
.btn-primary:hover:not(:disabled) {
  box-shadow: 0 16px 48px var(--teal-glow), 0 0 25px color-mix(in srgb, var(--teal) 25%, transparent);
}

.btn-secondary {
  background: var(--bg-glass);
  border-color: var(--border);
  backdrop-filter: blur(20px);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--bg-glass-strong);
  border-color: var(--border-strong);
}

.btn-ghost {
  background: transparent; color: var(--text-muted); border-color: transparent;
}
.btn-ghost:hover:not(:disabled) {
  background: var(--bg4); color: var(--text); border-color: var(--border);
}

.btn-danger {
  background: var(--danger-dim); color: var(--danger); border-color: rgba(255, 94, 122, 0.25);
}
.btn-danger:hover:not(:disabled) {
  background: var(--danger); color: #fff; border-color: transparent;
  box-shadow: 0 12px 32px rgba(255, 94, 122, 0.25);
}

.btn-full { width: 100%; }
.btn-lg { height: 54px; padding: 0 28px; font-size: 15px; border-radius: var(--radius-lg); }
.btn-sm { height: 38px; padding: 0 16px; font-size: 12px; border-radius: var(--radius-sm); }

.btn-spinner {
  width: 18px; height: 18px;
  border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: #fff;
  border-radius: 50%; animation: spin .7s linear infinite; display: none;
}
.loading .btn-spinner { display: block; }
.loading .btn-text    { display: none; }

/* ─────────────────────────────────────────────
   INPUTS GLOW
───────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.field label {
  font-size: 11px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-muted);
}
.field .input-wrap { position: relative; }
.field .input-wrap .input-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  color: var(--teal); opacity: 0.75; display: flex; align-items: center; pointer-events: none;
  transition: opacity .2s;
  z-index: 2;
}
.field .input-wrap:focus-within .input-icon { opacity: 1; }

input[type="text"], input[type="email"], input[type="password"],
input[type="tel"], input[type="date"], input[type="number"],
select, textarea {
  width: 100%; height: 52px;
  background: var(--bg-glass);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px !important;
  padding: 0 18px;
  transition: border-color .24s, box-shadow .24s, background-color .24s;
  appearance: none; -webkit-appearance: none;
  backdrop-filter: blur(14px);
}
input.has-icon-left  { padding-left: 48px; }
input.has-icon-right { padding-right: 48px; }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: color-mix(in srgb, var(--teal) 45%, transparent);
  background: var(--bg-glass-strong);
  box-shadow: 0 0 0 4px var(--teal-glow-soft), 0 0 24px color-mix(in srgb, var(--teal) 6%, transparent);
}
input::placeholder { color: var(--text-dim); }
textarea { height: auto; min-height: 110px; padding: 16px 18px; resize: vertical; }

.field .field-error { font-size: 12px; color: var(--danger); display: none; margin-top: 4px; font-weight: 600; }
.field.has-error input, .field.has-error select { border-color: var(--danger); }
.field.has-error .field-error { display: block; }

/* ─────────────────────────────────────────────
   CARDS GLASSMORPHISM (STRIPE STYLE)
───────────────────────────────────────────── */
.card {
  background: var(--glass-bg-premium);
  border: var(--glass-border-premium);
  border-radius: var(--radius-lg);
  padding: 24px;
  backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  transition: border-color .24s, box-shadow .24s;
  box-shadow: var(--shadow-glow);
}
.card:hover { border-color: var(--border-strong); box-shadow: 0 15px 45px color-mix(in srgb, var(--teal) 5%, transparent), var(--shadow-glow); }

.card::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.06), transparent 45%);
  pointer-events: none;
}

/* ─────────────────────────────────────────────
   BADGES & AVATARS
───────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 100px;
  font-size: 11px; font-weight: 800;
  font-family: 'DM Mono', monospace; letter-spacing: .4px;
}
.badge-teal   { background: var(--teal-dim);   color: var(--teal);   border: 1px solid var(--teal-border); }
.badge-gold   { background: var(--gold-dim);   color: var(--gold);   border: 1px solid rgba(215, 177, 91, 0.25); }
.badge-green  { background: var(--success-dim);  color: var(--success);  border: 1px solid rgba(54, 211, 153, 0.25); }
.badge-red    { background: var(--danger-dim);    color: var(--danger);    border: 1px solid rgba(255, 94, 122, 0.25); }
.badge-muted  { background: var(--bg4);        color: var(--text-muted); }
.badge-purple { background: var(--purple-dim); color: var(--purple); border: 1px solid rgba(155, 124, 255, 0.25); }

.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, var(--teal-dim), color-mix(in srgb, var(--teal) 20%, transparent));
  border: 2px solid var(--teal-border);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; color: var(--teal);
  flex-shrink: 0;
}
.avatar-lg { width: 54px; height: 54px; font-size: 18px; }
.avatar-xl { width: 76px; height: 76px; font-size: 26px; border-width: 2.5px; }

/* ─────────────────────────────────────────────
   EMPTY STATES
───────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  padding: 64px 24px; text-align: center; gap: 14px;
}
.empty-state-icon  { font-size: 48px; opacity: .25; color: var(--text-muted); }
.empty-state-title { font-size: 17px; font-weight: 800; color: var(--text); }
.empty-state-desc  { font-size: 14px; color: var(--text-muted); max-width: 280px; line-height: 1.65; }

/* ─────────────────────────────────────────────
   VIEW TRANSITION (CINEMATIC REVEAL)
───────────────────────────────────────────── */
.view-container { animation: cinematicIn .68s var(--ease-spring); }
@keyframes cinematicIn {
  from { opacity: 0; transform: translateY(20px) scale(.985); filter: blur(6px); }
  to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

/* ─────────────────────────────────────────────
   SKELETON SHIMMER EFFECT
───────────────────────────────────────────── */
.skeleton {
  background: linear-gradient(90deg, var(--bg3) 25%, var(--bg4) 50%, var(--bg3) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer { to { background-position: -200% 0; } }

.divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }


/* ─────────────────────────────────────────────
   LIGHT MODE BACKGROUND — INSPIRAÇÃO SaaS
───────────────────────────────────────────── */
[data-theme="light"] body::before {
  background:
    radial-gradient(ellipse at 5% 0%, color-mix(in srgb, var(--teal) 13%, transparent) 0%, transparent 40%),
    radial-gradient(ellipse at 95% 5%, rgba(47,128,237,0.10) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 100%, rgba(139,110,255,0.07) 0%, transparent 45%),
    linear-gradient(150deg, #DFF0F8 0%, #EBF1FA 40%, #E3EDF6 100%);
}
[data-theme="light"] .orb { opacity: .06; }

/* ─────────────────────────────────────────────
   TOPNAV — PREMIUM SaaS STYLE
───────────────────────────────────────────── */
.topnav {
  position: sticky; top: 0; z-index: 200;
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--gutter);
  background: var(--bg-glass-strong);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  box-shadow: 0 1px 0 var(--border), 0 4px 24px rgba(0,0,0,0.12);
}
[data-theme="light"] .topnav {
  background: rgba(255,255,255,0.94);
  border-bottom-color: rgba(12,28,40,0.07);
  box-shadow: 0 1px 0 rgba(12,28,40,0.06), 0 4px 20px rgba(15,23,42,0.05);
}
.topnav-logo {
  display: flex; align-items: center; gap: 12px;
  text-decoration: none; cursor: pointer;
}
.topnav-logo-icon {
  width: 44px; height: 44px; border-radius: 14px;
  background: linear-gradient(135deg, var(--teal-dark) 0%, var(--teal-light) 100%);
  border: 2px solid color-mix(in srgb, var(--teal) 35%, transparent);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0;
  box-shadow: 0 4px 16px color-mix(in srgb, var(--teal-dark) 30%, transparent);
  padding: 3px;
}
[data-theme="light"] .topnav-logo-icon {
  background: linear-gradient(135deg, var(--teal-dark) 0%, var(--teal) 100%);
  box-shadow: 0 4px 16px color-mix(in srgb, var(--teal-dark) 28%, transparent);
}
.topnav-logo-icon .app-logo-img {
  width: 100% !important; height: 100% !important;
  object-fit: contain;
  filter: brightness(0) invert(1) !important;
}
.topnav-logo-name {
  font-size: 14px; font-weight: 800; color: var(--text);
  letter-spacing: -0.3px; line-height: 1.2;
}
.topnav-logo-sub {
  font-size: 10px; color: var(--text-muted);
  font-family: 'DM Mono', monospace; letter-spacing: 0.6px;
  text-transform: uppercase; margin-top: 1px;
}
.topnav-actions { display: flex; align-items: center; gap: 8px; }
.topnav-avatar-btn {
  background: none; border: none; cursor: pointer; padding: 0;
  border-radius: 50%; line-height: 0;
  transition: transform .15s, opacity .15s;
}
.topnav-avatar-btn:hover { opacity: .85; transform: scale(1.05); }

/* ── USER DROPDOWN ── */
.user-dropdown {
  position: absolute; top: calc(100% + 10px); right: 0;
  width: 248px;
  background: var(--bg-elevated);
  border: 1.5px solid var(--border2);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: translateY(-8px) scale(.97);
  transition: all .22s var(--ease-spring);
  z-index: 500;
}
.user-dropdown.open {
  opacity: 1; visibility: visible; pointer-events: auto;
  transform: translateY(0) scale(1);
}
[data-theme="light"] .user-dropdown {
  background: #FFFFFF;
  border-color: rgba(12,28,40,0.09);
  box-shadow: 0 16px 48px rgba(15,23,42,0.14);
}
.user-dd-header {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--teal-dim);
}
.user-dd-nome { font-size: 14px; font-weight: 800; color: var(--text); }
.user-dd-email { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.user-dd-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 12px 18px;
  background: none; border: none; cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px; font-weight: 600; color: var(--text-soft);
  transition: background .15s, color .15s; text-align: left;
}
.user-dd-item:hover { background: var(--bg4); color: var(--text); }
.user-dd-item.danger { color: var(--danger); }
.user-dd-item.danger:hover { background: var(--danger-dim); }

/* ── MODULE BTNS (acesso rápido) ── */
.module-btn {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 18px 10px;
  background: var(--glass-bg-premium);
  border: var(--glass-border-premium);
  border-radius: 20px; cursor: pointer; text-align: center;
  transition: all .22s var(--ease);
  font-family: 'Plus Jakarta Sans', sans-serif;
  backdrop-filter: blur(14px);
  box-shadow: var(--glass-shadow-premium);
}
.module-btn:hover {
  border-color: var(--teal-border);
  transform: translateY(-3px);
  box-shadow: 0 12px 36px color-mix(in srgb, var(--teal) 8%, transparent), var(--glass-shadow-premium);
}
[data-theme="light"] .module-btn {
  background: #FFFFFF;
  border: 1px solid rgba(12,28,40,0.07);
  box-shadow: 0 2px 12px rgba(15,23,42,0.07);
}
[data-theme="light"] .module-btn:hover {
  border-color: color-mix(in srgb, var(--teal-dark) 30%, transparent);
  box-shadow: 0 8px 28px color-mix(in srgb, var(--teal-dark) 12%, transparent);
}
.module-btn-icon {
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--teal-dim); border: 1px solid var(--teal-border);
  display: flex; align-items: center; justify-content: center;
  color: var(--teal); transition: background .2s;
}
[data-theme="light"] .module-btn-icon {
  background: color-mix(in srgb, var(--teal-dark) 10%, transparent);
  border-color: color-mix(in srgb, var(--teal-dark) 20%, transparent);
  box-shadow: 0 4px 14px color-mix(in srgb, var(--teal-dark) 15%, transparent);
}
.module-btn-name {
  font-size: 12px; font-weight: 700; color: var(--text-muted);
  line-height: 1.3;
}

/* ── SECTION LABEL ── */
.section-label {
  font-size: 11px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px;
}

/* ── TOPNAV APP SHELL — complemento (base já definida acima) ── */
.topnav-left  { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; overflow: hidden; }
.topnav-name {
  font-size: 14px; font-weight: 800; color: var(--text); line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topnav-sub {
  font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Mobile: sem espaço pra marca por extenso — mostra só o logo */
@media (max-width: 640px) {
  .topnav-name, .topnav-sub { display: none; }
}
.topnav-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.topnav-sep   { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; margin: 0 4px; }
.topnav-icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 10px; border: none;
  background: transparent; color: var(--text-muted); cursor: pointer;
  transition: background .15s, color .15s; position: relative;
}
.topnav-icon-btn:hover { background: var(--bg4); color: var(--text); }
.topnav-avatar-wrap { position: relative; }
#topnav-usuarios-btn {
  display: none; align-items: center; gap: 6px;
  padding: 0 14px; height: 34px; border-radius: 100px;
  border: 1.5px solid var(--teal-border); background: var(--teal-dim);
  color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all .2s; white-space: nowrap;
}
#topnav-usuarios-btn:hover { border-color: var(--teal); }

/* ── Mobile: botão "Usuários" vira ícone puro (sem texto) ── */
@media (max-width: 640px) {
  #topnav-usuarios-btn {
    padding: 0; width: 34px; justify-content: center; border-radius: 10px;
  }
  #topnav-usuarios-btn span { display: none; }
}
#topnav-module-actions { display: flex; align-items: center; gap: 6px; }

/* ═════════════════════════════════════════════
   MARCA DA IGREJA (logo ou iniciais)
═════════════════════════════════════════════ */
.brand-mark {
  position: relative; width: 100%; height: 100%;
  display: grid; place-items: center; overflow: hidden;
  font-weight: 800; font-size: 15px; letter-spacing: -.02em; color: #fff;
}
.brand-mark img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }

/* ═════════════════════════════════════════════
   NAVEGAÇÃO: sidebar (desktop) + menu inferior (celular)
   Os itens vêm dos módulos ativos e do perfil — nenhum módulo é citado aqui.
═════════════════════════════════════════════ */
.app-sidebar, .app-bnav { display: none; }

.app-sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w);
  flex-direction: column; gap: var(--sp-2);
  padding: var(--sp-5) var(--sp-4) var(--sp-4);
  background: var(--bg-glass-strong);
  border-right: 1px solid var(--border);
  backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
  z-index: 150; overflow-y: auto;
}
[data-theme="light"] .app-sidebar { background: #FFFFFF; }
.sb-brand { display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-2) var(--sp-4); border-bottom: 1px solid var(--border); margin-bottom: var(--sp-2); }
.sb-logo { width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0; overflow: hidden; background: linear-gradient(135deg, var(--teal-dark), var(--teal)); box-shadow: 0 6px 18px var(--teal-glow); }
.sb-brand-txt { min-width: 0; }
.sb-brand-name { font-size: var(--fs-md); font-weight: 800; letter-spacing: -.02em; line-height: 1.2; color: var(--text); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sb-brand-sub { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 2px; }
.sb-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.sb-group { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); padding: var(--sp-4) var(--sp-3) var(--sp-2); }
.sb-item {
  position: relative; display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; padding: 11px var(--sp-3); border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-muted); cursor: pointer; text-align: left;
  font-family: inherit; font-size: var(--fs-sm); font-weight: 600;
  transition: background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
}
.sb-item i { width: 18px; height: 18px; flex-shrink: 0; }
.sb-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item:hover { background: var(--bg-glass); color: var(--text); }
[data-theme="light"] .sb-item:hover { background: #F1F5F9; }
.sb-item.active { background: var(--teal-dim); color: var(--teal); font-weight: 700; }
.sb-item.active::before { content: ''; position: absolute; left: -16px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--teal); }
.sb-item:focus-visible, .bn-item:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.sb-foot { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3); margin-top: var(--sp-2); border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-glass); }
[data-theme="light"] .sb-foot { background: #F8FAFC; }
.sb-foot-txt { flex: 1; min-width: 0; }
.sb-foot-nome { font-size: var(--fs-sm); font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-foot-perfil { font-size: var(--fs-xs); color: var(--text-muted); }

/* Celular: menu inferior */
.app-bnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 150;
  align-items: stretch; justify-content: space-around; gap: 2px;
  padding: var(--sp-2) var(--sp-2) max(var(--sp-2), env(safe-area-inset-bottom));
  background: var(--bg-glass-strong); border-top: 1px solid var(--border);
  backdrop-filter: blur(28px) saturate(200%); -webkit-backdrop-filter: blur(28px) saturate(200%);
}
[data-theme="light"] .app-bnav { background: rgba(255,255,255,.96); }
.bn-item {
  flex: 1; max-width: 88px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 4px; border: none; border-radius: var(--radius-sm); background: none; cursor: pointer;
  font-family: inherit; font-size: 10px; font-weight: 700; color: var(--text-dim);
  transition: color .18s var(--ease), background .18s var(--ease);
}
.bn-item i { width: 22px; height: 22px; }
.bn-item span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bn-item.active { color: var(--teal); background: var(--teal-dim); }

@media (max-width: 1023px) {
  body.nav-on .app-bnav { display: flex; }
  body.nav-on #app { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
}
@media (min-width: 1024px) {
  body.nav-on .app-sidebar { display: flex; }
  body.nav-on #app, body.nav-on #main-topnav { margin-left: var(--sidebar-w); }
  body.nav-on { --gutter: 32px; --gutter-lg: 40px; }
  /* a marca já está na sidebar */
  body.nav-on .topnav-left { visibility: hidden; }
}
/* "Usuários" já está na sidebar (desktop) e no menu inferior (celular) */
body.nav-on #topnav-usuarios-btn { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  .sb-item, .bn-item { transition: none; }
}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- ── LOADER CINEMÁTICO ── -->
<!-- ══ APP SHELL — TOPNAV PERSISTENTE ══
     Visível apenas em views autenticadas (controlado por renderView).
     Dados dinâmicos (nome, avatar, perfil) injetados por updateTopnav().
-->
<header id="main-topnav" class="topnav" style="display:none" role="banner">
  <div class="topnav-left">
    <div class="topnav-logo-icon">
      <span id="topnav-mark" class="brand-mark"></span>
    </div>
    <div>
      <div class="topnav-name"></div>
      <div class="topnav-sub">gestão ministerial</div>
    </div>
  </div>
  <div class="topnav-right">
    <!-- Slot: ação primária do módulo ativo (ex.: aniversariantes com badge) -->
    <div id="topnav-module-actions"></div>

    <!-- Mais opções: tema e ações secundárias do módulo -->
    <div class="topnav-more-wrap" style="position:relative">
      <button class="topnav-icon-btn" onclick="toggleMoreMenu()" id="topnav-more-btn" title="Mais opções">
        <i data-lucide="more-vertical" style="width:18px;height:18px"></i>
      </button>
      <div class="user-dropdown" id="topnav-more-dd" style="right:0">
        <button class="user-dd-item" onclick="closeMoreMenu();toggleTheme()">
          <i data-lucide="moon" style="width:15px;height:15px"></i> Alternar tema
        </button>
        <!-- Slot: ações secundárias do módulo ativo (alertas, importador, etc.) -->
        <div id="topnav-more-module-items"></div>
      </div>
    </div>

    <button id="topnav-usuarios-btn" onclick="navigateTo('usuarios')" title="Gerenciar Usuários">
      <i data-lucide="shield-check" style="width:15px;height:15px;color:var(--teal);flex-shrink:0"></i>
      <span>Usuários</span>
    </button>
    <div class="topnav-avatar-wrap">
      <button class="topnav-avatar-btn" onclick="toggleUserDropdown()" id="avatar-btn" title="">
        <div class="avatar" id="topnav-initials" style="width:34px;height:34px;font-size:12px"></div>
      </button>
      <div class="user-dropdown" id="user-dropdown">
        <div class="user-dd-header">
          <div class="user-dd-nome"  id="topnav-dd-nome"></div>
          <div class="user-dd-email" id="topnav-dd-email"></div>
          <div style="margin-top:8px">
            <span class="badge badge-teal" id="topnav-dd-badge"></span>
          </div>
        </div>
        <button class="user-dd-item" onclick="closeDropdown();navigateTo('home')">
          <i data-lucide="layout-dashboard" style="width:15px;height:15px"></i> Dashboard
        </button>
        <button class="user-dd-item" onclick="closeDropdown();showTrocarSenha()">
          <i data-lucide="key" style="width:15px;height:15px"></i> Alterar senha
        </button>
        <hr class="divider" style="margin:6px 0">
        <button class="user-dd-item danger" onclick="handleLogout()">
          <i data-lucide="log-out" style="width:15px;height:15px"></i> Sair
        </button>
      </div>
    </div>
  </div>
</header>

<!-- ══ NAVEGAÇÃO (montada por renderNav) ══ -->
<aside id="app-sidebar" class="app-sidebar" aria-label="Navegação principal"></aside>
<nav id="app-bnav" class="app-bnav" aria-label="Navegação principal"></nav>
<div class="modal-overlay" id="modal-mais" onclick="if(event.target===this)fecharMaisNav()">
  <div class="modal-box">
    <h3 style="font-size:var(--fs-lg);font-weight:800;color:var(--text);margin-bottom:var(--sp-4)">Mais opções</h3>
    <div id="bnav-more-list" style="display:flex;flex-direction:column;gap:var(--sp-2)"></div>
  </div>
</div>

<div id="app-loader">
  <div class="loader-logo">
    <span id="loader-mark" class="brand-mark"></span>
  </div>
  <div class="loader-spinner"></div>
  <p class="loader-text">Carregando plataforma…</p>
</div>

<!-- ── APP ROOT ── -->
<div id="app"><div id="app-viewport"></div></div>

<!-- ── TOAST CONTAINER ── -->
<div id="toast-container" aria-live="polite"></div>

<!-- ── MODAL TROCAR SENHA (global — disponível em todas as views) ── -->
<div class="modal-overlay" id="modal-troca-senha">
  <div class="modal-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h3 style="font-size:17px;font-weight:800;color:var(--text)">Alterar senha</h3>
      <button class="btn btn-ghost btn-sm" style="width:36px;padding:0" onclick="closeModalTrocarSenha()">×</button>
    </div>
    <div class="login-error-msg" id="ts-error">
      <i data-lucide="alert-triangle" style="width:13px;height:13px;vertical-align:middle"></i><span id="ts-error-text"></span>
    </div>
    <div class="field">
      <label for="ts-atual">Senha atual</label>
      <div class="input-wrap">
        <span class="input-icon"><i data-lucide="lock" style="width:18px;height:18px"></i></span>
        <input type="password" id="ts-atual" class="has-icon-left has-icon-right" placeholder="Sua senha atual">
        <button type="button" class="pwd-toggle-btn" onclick="togglePwdVisibility('ts-atual', this)" tabindex="-1">
          <i data-lucide="eye" style="width:18px;height:18px"></i>
        </button>
      </div>
    </div>
    <div class="field">
      <label for="ts-nova">Nova senha</label>
      <div class="input-wrap">
        <span class="input-icon"><i data-lucide="lock" style="width:18px;height:18px"></i></span>
        <input type="password" id="ts-nova" class="has-icon-left has-icon-right" placeholder="Mínimo 8 caracteres" oninput="tsCheckStrength()">
        <button type="button" class="pwd-toggle-btn" onclick="togglePwdVisibility('ts-nova', this)" tabindex="-1">
          <i data-lucide="eye" style="width:18px;height:18px"></i>
        </button>
      </div>
      <div class="pwd-strength visible">
        <div class="pwd-strength-bar"><div class="pwd-strength-fill" id="ts-strength-fill" style="width:0%"></div></div>
        <span class="pwd-strength-label" id="ts-strength-label"></span>
      </div>
    </div>
    <div class="field">
      <label for="ts-confirma">Confirmar nova senha</label>
      <div class="input-wrap">
        <span class="input-icon"><i data-lucide="lock-keyhole" style="width:18px;height:18px"></i></span>
        <input type="password" id="ts-confirma" class="has-icon-left has-icon-right" placeholder="Repita a nova senha">
        <button type="button" class="pwd-toggle-btn" onclick="togglePwdVisibility('ts-confirma', this)" tabindex="-1">
          <i data-lucide="eye" style="width:18px;height:18px"></i>
        </button>
      </div>
      <span class="field-error">As senhas não conferem.</span>
    </div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-secondary btn-full" onclick="closeModalTrocarSenha()">Cancelar</button>
      <button class="btn btn-primary btn-full" id="btn-ts" onclick="handleTrocarSenha()">
        <span class="btn-spinner"></span>
        <span class="btn-text">Salvar</span>
      </button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
//  APP SHELL · Roteamento, Estado Global, Utilitários UI
//  ATENÇÃO: Zero backticks — ES5 only
// ══════════════════════════════════════════════════════════

// ── ESTADO GLOBAL ────────────────────────────────────────
var App = {
  session: null,        // { token, nome, email, perfil, primeiroAcesso }
  currentView: null,
  TOKEN_KEY: 'ad_sess_token'
};

// ── MÓDULOS ATIVOS (vêm do registro Modulos.js, injetados pelo servidor) ──
var MODULOS = <?!= modulosJson ?>;

// ── IDENTIDADE DA IGREJA (vem da aba Config, injetada pelo servidor) ──
// { nome, nomeCurto, lema, corPrimaria, logoUrl }
var IDENTIDADE = <?!= identidadeJson ?>;
var PERFIL_LABEL = { admin: 'Administrador', secretaria: 'Secretaria' };

// ── ROTEAMENTO ───────────────────────────────────────────
// Rotas fixas do núcleo + uma rota por módulo ativo.
var VIEWS = {
  login:             'renderLogin',
  'primeiro-acesso': 'renderPrimeiroAcesso',
  'recuperar-senha': 'renderRecuperarSenha',
  home:              'renderHome',
  'usuarios':        'renderUsuarios'
};

// ── PERMISSÕES POR ROTA ───────────────────────────────────
// Define quais perfis podem acessar cada view protegida.
// 'admin' sempre tem acesso total.
var ROUTE_PERMISSIONS = {
  'home':              ['admin', 'secretaria'],
  'usuarios':          ['admin', 'secretaria']
};

// Views que exigem sessão ativa (topnav visível nestas)
var authRequired = ['home', 'usuarios'];

MODULOS.forEach(function (m) {
  VIEWS[m.rota] = m.render;
  ROUTE_PERMISSIONS[m.rota] = m.perfis;
  authRequired.push(m.rota);
});

// Módulos que o perfil pode abrir
function modulosDoPerfil(perfil) {
  return MODULOS.filter(function (m) { return m.perfis.indexOf(perfil) !== -1; });
}

// Retorna a view de destino padrão para cada perfil após login
function _homeViewForPerfil(perfil) {
  if (ROUTE_PERMISSIONS.home.indexOf(perfil) !== -1) return 'home';
  var mods = modulosDoPerfil(perfil);
  return mods.length ? mods[0].rota : 'usuarios';
}

function navigateTo(view, params) {

  // 1. Sem sessão → login
  if (authRequired.indexOf(view) !== -1 && !App.session) {
    navigateTo('login');
    return;
  }

  // 2. Com sessão → checar permissão de perfil para a rota
  if (App.session && ROUTE_PERMISSIONS[view]) {
    var perfil   = App.session.perfil || '';
    var allowed  = ROUTE_PERMISSIONS[view];
    if (allowed.indexOf(perfil) === -1) {
      showToast('Acesso restrito ao seu perfil.', 'error');
      // Redireciona para a home correta do perfil sem criar loop
      var fallback = _homeViewForPerfil(perfil);
      if (fallback !== view) navigateTo(fallback);
      return;
    }
  }

  var fn = VIEWS[view];
  if (!fn || typeof window[fn] !== 'function') {
    showToast('Visualização "' + view + '" não encontrada.', 'error');
    return;
  }
  App.currentView = view;
  window[fn](params);
}

// ── RENDER HELPER ────────────────────────────────────────
function renderView(html) {
  var viewport = document.getElementById('app-viewport');
  viewport.innerHTML = '<div class="view-container">' + html + '</div>';

  // Mostrar/ocultar topnav persistente conforme tipo de view
  var topnav  = document.getElementById('main-topnav');
  var isAuth  = authRequired.indexOf(App.currentView || '') !== -1;
  if (topnav) topnav.style.display = isAuth ? '' : 'none';
  renderNav(isAuth);

  // Tela nova começa no topo (senão herda a rolagem da anterior e o topo fica sob a barra)
  if (App._telaRenderizada !== App.currentView) { window.scrollTo(0, 0); App._telaRenderizada = App.currentView; }

  // Limpar slot de ações do módulo anterior
  var slot = document.getElementById('topnav-module-actions');
  if (slot) slot.innerHTML = '';
  var moreSlot = document.getElementById('topnav-more-module-items');
  if (moreSlot) moreSlot.innerHTML = '';

  applyLogoSrc();
  if (window.lucide) lucide.createIcons();
}


// ── IDENTIDADE: cor da marca, nome e logo ────────────────
function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function _hexRgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
function _rgbHex(c) {
  return '#' + c.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? '0' : '') + v.toString(16); }).join('');
}
function _mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function _lum(c) {
  var f = c.map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * f[0] + 0.7152 * f[1] + 0.0722 * f[2];
}

// Garante que a cor da marca seja legível sobre o fundo do tema (clareia no escuro, escurece no claro)
function _corLegivel(c, tema) {
  for (var i = 0; i < 10; i++) {
    var l = _lum(c);
    if (tema === 'light' ? l <= 0.17 : l >= 0.19) break;
    c = _mix(c, tema === 'light' ? [0, 0, 0] : [255, 255, 255], 0.12);
  }
  return c;
}

// Aplica a cor primária da Config nas variáveis de tema (reaplicada ao trocar claro/escuro)
function aplicarIdentidade() {
  var root = document.documentElement.style;
  if (IDENTIDADE.corPrimaria) {
    var tema = document.documentElement.getAttribute('data-theme') || 'dark';
    var c  = _corLegivel(_hexRgb(IDENTIDADE.corPrimaria), tema);
    var rgba = function (a) { return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a + ')'; };
    root.setProperty('--teal',           _rgbHex(c));
    root.setProperty('--teal-light',     _rgbHex(_mix(c, [255, 255, 255], 0.35)));
    root.setProperty('--teal-dark',      _rgbHex(_mix(c, [0, 0, 0], 0.25)));
    root.setProperty('--teal-dim',       rgba(0.12));
    root.setProperty('--teal-border',    rgba(0.25));
    root.setProperty('--teal-glow',      rgba(0.30));
    root.setProperty('--teal-glow-soft', rgba(0.08));
  }
  document.title = IDENTIDADE.nome + ' — Gestão Ministerial';
  var nm = document.querySelector('.topnav-name');
  if (nm) nm.textContent = IDENTIDADE.nome;
  var mk = document.getElementById('topnav-mark');
  if (mk) mk.innerHTML = brandMarkInner();
}

// Iniciais para o logo provisório: "Igreja Vida Nova" → VN · "AD Central" → AD · "Minha Igreja" → MI
function iniciaisIgreja(nome) {
  var w = String(nome || '').trim().split(/\s+/).filter(function (x) { return x && !/^(de|da|do|das|dos|e)$/i.test(x); });
  if (!w.length) return '?';
  if (/^[A-Z\u00C0-\u00DD]{2,3}$/.test(w[0])) return w[0];
  if (w.length > 2 && /^igreja$/i.test(w[0])) w.shift();
  return (w[0].charAt(0) + (w[1] ? w[1].charAt(0) : '')).toUpperCase();
}

// Logo configurado ou, na falta dele, as iniciais da igreja (o logo por cima; se falhar, aparecem as iniciais)
function brandMarkInner() {
  return '<span>' + escHtml(iniciaisIgreja(IDENTIDADE.nomeCurto || IDENTIDADE.nome)) + '</span>' +
    (IDENTIDADE.logoUrl ? '<img src="' + escHtml(IDENTIDADE.logoUrl) + '" alt="" onerror="this.style.display=\'none\'">' : '');
}

// ── NAVEGAÇÃO (sidebar no desktop, menu inferior no celular) ──
// Itens = Início (se o perfil tem home) + módulos do perfil + Usuários (se permitido)
function navItens() {
  var perfil = App.session ? App.session.perfil : '';
  var itens = [];
  if (ROUTE_PERMISSIONS.home.indexOf(perfil) !== -1) itens.push({ rota: 'home', nome: 'Início', icone: 'layout-dashboard', grupo: 'Principal' });
  modulosDoPerfil(perfil).forEach(function (m) { itens.push({ rota: m.rota, nome: m.nome, icone: m.icone, grupo: 'Módulos' }); });
  if (ROUTE_PERMISSIONS.usuarios.indexOf(perfil) !== -1) itens.push({ rota: 'usuarios', nome: 'Usuários', icone: 'shield-check', grupo: 'Administração' });
  return itens;
}

var NAV_BNAV_MAX = 5; // acima disso, o excedente vai para "Mais"

function renderNav(isAuth) {
  var sb = document.getElementById('app-sidebar');
  var bn = document.getElementById('app-bnav');
  var ativo = !!(isAuth && App.session);
  document.body.classList.toggle('nav-on', ativo);
  if (!ativo || !sb || !bn) return;

  var atual = App.currentView;
  var itens = navItens();

  // Sidebar
  var grupo = '';
  var lista = itens.map(function (it) {
    var cab = '';
    if (it.grupo !== grupo) { grupo = it.grupo; cab = '<div class="sb-group">' + grupo + '</div>'; }
    return cab + '<button class="sb-item' + (it.rota === atual ? ' active' : '') + '"' + (it.rota === atual ? ' aria-current="page"' : '') +
      ' onclick="navNavegar(\'' + it.rota + '\')"><i data-lucide="' + it.icone + '"></i><span>' + escHtml(it.nome) + '</span></button>';
  }).join('');
  var nome = App.session.nome || '';
  sb.innerHTML =
    '<div class="sb-brand"><div class="sb-logo"><span class="brand-mark">' + brandMarkInner() + '</span></div>' +
      '<div class="sb-brand-txt"><div class="sb-brand-name">' + escHtml(IDENTIDADE.nome) + '</div><div class="sb-brand-sub">Gestão ministerial</div></div></div>' +
    '<div class="sb-nav">' + lista + '</div>' +
    '<div class="sb-foot"><div class="avatar" style="width:36px;height:36px;font-size:12px">' + escHtml(getInitials(nome)) + '</div>' +
      '<div class="sb-foot-txt"><div class="sb-foot-nome">' + escHtml(nome) + '</div><div class="sb-foot-perfil">' + escHtml(PERFIL_LABEL[App.session.perfil] || App.session.perfil) + '</div></div>' +
      '<button class="topnav-icon-btn" onclick="handleLogout()" title="Sair" aria-label="Sair"><i data-lucide="log-out" style="width:17px;height:17px"></i></button></div>';

  // Menu inferior: cabem NAV_BNAV_MAX itens; se passar, o último vira "Mais"
  var visiveis = itens, extras = [];
  if (itens.length > NAV_BNAV_MAX) { visiveis = itens.slice(0, NAV_BNAV_MAX - 1); extras = itens.slice(NAV_BNAV_MAX - 1); }
  var html = visiveis.map(function (it) {
    return '<button class="bn-item' + (it.rota === atual ? ' active' : '') + '" onclick="navNavegar(\'' + it.rota + '\')">' +
      '<i data-lucide="' + it.icone + '"></i><span>' + escHtml(it.nome) + '</span></button>';
  }).join('');
  if (extras.length) {
    var emExtra = extras.some(function (it) { return it.rota === atual; });
    html += '<button class="bn-item' + (emExtra ? ' active' : '') + '" onclick="abrirMaisNav()"><i data-lucide="layout-grid"></i><span>Mais</span></button>';
    document.getElementById('bnav-more-list').innerHTML = extras.map(function (it) {
      return '<button class="sb-item' + (it.rota === atual ? ' active' : '') + '" onclick="navNavegar(\'' + it.rota + '\')">' +
        '<i data-lucide="' + it.icone + '"></i><span>' + escHtml(it.nome) + '</span></button>';
    }).join('');
  }
  bn.innerHTML = html;
}

function navNavegar(rota) {
  fecharMaisNav();
  if (App.currentView !== rota) navigateTo(rota);
}
function abrirMaisNav() {
  var m = document.getElementById('modal-mais');
  if (m) { m.classList.add('open'); if (window.lucide) lucide.createIcons(); }
}
function fecharMaisNav() {
  var m = document.getElementById('modal-mais');
  if (m) m.classList.remove('open');
}

// ── TOPNAV — DADOS DE SESSÃO ─────────────────────────────
function updateTopnav(sessao) {
  if (!sessao) return;
  var nome   = sessao.nome   || '';
  var email  = sessao.email  || '';
  var perfil = sessao.perfil || '';
  var labels = { admin: 'Administrador', secretaria: 'Secretaria' };
  var isSec  = perfil === 'admin' || perfil === 'secretaria';

  var el = function(id) { return document.getElementById(id); };
  var initials = el('topnav-initials');
  if (initials) initials.textContent = getInitials(nome);
  var btn = el('avatar-btn');
  if (btn) btn.title = nome;
  var ddNome = el('topnav-dd-nome');
  if (ddNome) ddNome.textContent = nome;
  var ddEmail = el('topnav-dd-email');
  if (ddEmail) ddEmail.textContent = email;
  var ddBadge = el('topnav-dd-badge');
  if (ddBadge) ddBadge.textContent = labels[perfil] || perfil;
  var usuariosBtn = el('topnav-usuarios-btn');
  if (usuariosBtn) usuariosBtn.style.display = isSec ? 'inline-flex' : 'none';
}

// ── SESSION STORAGE ──────────────────────────────────────
function saveSession(sessao) {
  App.session = sessao;
  try { sessionStorage.setItem(App.TOKEN_KEY, sessao.token); } catch(e) {}
  updateTopnav(sessao);
}

function clearSession() {
  App.session = null;
  try {
    sessionStorage.removeItem(App.TOKEN_KEY);
    // rascunhos de formulário dos módulos (draft_*) e rota a retomar não sobrevivem ao logout
    Object.keys(sessionStorage).forEach(function(k) {
      if (k.indexOf('draft_') === 0 || k === 'ad_retomar') sessionStorage.removeItem(k);
    });
  } catch(e) {}
}

// Rota a retomar após o navegador recarregar a página (ex.: voltar da câmera do celular).
// Um módulo grava 'ad_retomar' junto com seu rascunho; só vale se o perfil puder abrir a rota.
function _rotaParaRetomar(perfil) {
  var r = null;
  try { r = sessionStorage.getItem('ad_retomar'); } catch(e) {}
  if (r && VIEWS[r] && ROUTE_PERMISSIONS[r] && ROUTE_PERMISSIONS[r].indexOf(perfil) !== -1) return r;
  return null;
}

function getSavedToken() {
  try { return sessionStorage.getItem(App.TOKEN_KEY); } catch(e) { return null; }
}

// ── TOAST NOTIFICATIONS ───────────────────────────────────
function showToast(msg, type, duration) {
  type     = type     || 'info';
  duration = duration || 4000;

  var icons = {
    success: '<i data-lucide="check-circle-2" style="width:16px;height:16px;stroke-width:1.75"></i>',
    error:   '<i data-lucide="circle-x" style="width:16px;height:16px;stroke-width:1.75"></i>',
    info:    '<i data-lucide="info" style="width:16px;height:16px;stroke-width:1.75"></i>',
    warning: '<i data-lucide="alert-triangle" style="width:16px;height:16px;stroke-width:1.75"></i>'
  };
  var container = document.getElementById('toast-container');

  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML =
    '<span class="toast-icon">' + (icons[type] || icons.info) + '</span>' +
    '<span class="toast-msg">' + msg + '</span>' +
    '<button class="toast-close" onclick="dismissToast(this.parentElement)"><i data-lucide="x" style="width:16px;height:16px;stroke-width:2"></i></button>';

  container.appendChild(el);
  if (window.lucide) lucide.createIcons();

  setTimeout(function() { dismissToast(el); }, duration);
}

function dismissToast(el) {
  if (!el || !el.parentElement) return;
  el.classList.add('hiding');
  setTimeout(function() { if (el.parentElement) el.parentElement.removeChild(el); }, 250);
}

// ── BTN LOADING ──────────────────────────────────────────
function setBtnLoading(btn, loading) {
  if (!btn) return;
  if (loading) {
    btn.disabled = true;
    btn.classList.add('loading');
  } else {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}

// ── CONFIRM MODAL CUSTOMIZADO — substitui window.confirm() ──
// Uso: showConfirm('Mensagem...', { title, danger, confirmLabel, cancelLabel })
//        .then(function(ok) { if (ok) { ...ação... } });
// `danger: true` (padrão) estiliza o botão de confirmação em vermelho,
// indicado para ações destrutivas (excluir, desativar).
function showConfirm(message, opts) {
  opts = opts || {};
  var danger = opts.danger !== false;

  return new Promise(function(resolve) {
    var overlay = document.getElementById('confirm-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'confirm-overlay';
      overlay.className = 'modal-overlay';
      document.body.appendChild(overlay);
    }

    overlay.innerHTML =
      '<div class="modal-box confirm-box">' +
        '<div class="confirm-icon' + (danger ? ' danger' : '') + '">' +
          '<i data-lucide="' + (danger ? 'alert-triangle' : 'help-circle') + '"></i>' +
        '</div>' +
        '<div class="confirm-title">' + (opts.title || 'Confirmar ação') + '</div>' +
        '<div class="confirm-message">' + message + '</div>' +
        '<div class="confirm-actions">' +
          '<button class="btn-secondary" id="confirm-cancel-btn">' + (opts.cancelLabel || 'Cancelar') + '</button>' +
          '<button class="' + (danger ? 'btn-danger' : 'btn-primary') + '" id="confirm-ok-btn">' + (opts.confirmLabel || 'Confirmar') + '</button>' +
        '</div>' +
      '</div>';

    requestAnimationFrame(function() { overlay.classList.add('open'); });
    if (window.lucide) lucide.createIcons();

    function close(result) {
      overlay.classList.remove('open');
      setTimeout(function() { overlay.innerHTML = ''; }, 280);
      resolve(result);
    }

    document.getElementById('confirm-cancel-btn').onclick = function() { close(false); };
    document.getElementById('confirm-ok-btn').onclick     = function() { close(true); };
    overlay.onclick = function(e) { if (e.target === overlay) close(false); };
  });
}

// ── SHA-256 CLIENT-SIDE ──────────────────────────────────
function sha256(str) {
  var msgBuffer = new TextEncoder().encode(str);
  return crypto.subtle.digest('SHA-256', msgBuffer).then(function(hashBuffer) {
    var hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(function(b) {
      var h = b.toString(16);
      return h.length === 1 ? '0' + h : h;
    }).join('');
  });
}

// ── AVATAR INICIAIS ──────────────────────────────────────
function getInitials(nome) {
  if (!nome) return '?';
  var parts = nome.trim().split(' ');
  if (parts.length === 1) return parts[0][0].toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// ── VALIDAÇÕES ───────────────────────────────────────────
function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function validatePassword(pwd) {
  return pwd.length >= 8 &&
         /[A-Z]/.test(pwd) &&
         /[0-9]/.test(pwd) &&
         /[^A-Za-z0-9]/.test(pwd);
}

function getPasswordStrength(pwd) {
  var score = 0;
  if (pwd.length >= 8)           score++;
  if (pwd.length >= 12)          score++;
  if (/[A-Z]/.test(pwd))         score++;
  if (/[0-9]/.test(pwd))         score++;
  if (/[^A-Za-z0-9]/.test(pwd))  score++;
  if (score <= 1) return { level: 'weak',   label: 'Fraca',  color: '#FF5E7A' };
  if (score <= 3) return { level: 'medium', label: 'Média',  color: '#D7B15B' };
  return                { level: 'strong', label: 'Forte',  color: '#36D399' };
}

// ── FORMATAR DATA BR ──────────────────────────────────────
function formatDateBR(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('pt-BR');
}

// ── INICIALIZAÇÃO ─────────────────────────────────────────
function initApp() {
  // ── Link de recuperação de senha tem prioridade absoluta ──
  // Os params vêm injetados pelo servidor via template GAS.
  var recovToken = '<?= recovToken ?>';
  var injView    = '<?= view ?>';

  if (injView === 'recuperar-senha' && recovToken) {
    navigateTo('recuperar-senha', { token: recovToken });
    hideLoader();
    document.getElementById('app').classList.add('ready');
    return;
  }

  var savedToken = getSavedToken();

  if (savedToken) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          App.session = res.data;
          updateTopnav(res.data);
          if (res.data.primeiroAcesso) {
            navigateTo('primeiro-acesso');
          } else {
            navigateTo(_rotaParaRetomar(res.data.perfil || '') || _homeViewForPerfil(res.data.perfil || ''));
          }
        } else {
          clearSession();
          navigateTo('login');
        }
        hideLoader();
        document.getElementById('app').classList.add('ready');
      })
      .withFailureHandler(function() {
        clearSession();
        navigateTo('login');
        hideLoader();
        document.getElementById('app').classList.add('ready');
      })
      .getSession(savedToken);
  } else {
    navigateTo('login');
    hideLoader();
    document.getElementById('app').classList.add('ready');
  }
}

function hideLoader() {
  var loader = document.getElementById('app-loader');
  if (loader) loader.classList.add('hidden');
}

// ── TEMA ─────────────────────────────────────────────────
var THEME_KEY = 'ad_theme';

function initTheme() {
  var saved = localStorage.getItem(THEME_KEY) || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  applyLogoSrc();
  var icon = saved === 'dark' ? 'moon' : 'sun';
  var btns = document.querySelectorAll('.theme-toggle-btn');
  btns.forEach(function(btn) {
    btn.innerHTML = '<i data-lucide="'+icon+'" style="width:18px;height:18px"></i>';
  });
  if (window.lucide) lucide.createIcons();
}

function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme') || 'dark';
  var next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  aplicarIdentidade(); // recalcula a legibilidade da cor da marca no novo tema

  var btns = document.querySelectorAll('.theme-toggle-btn');
  btns.forEach(function(btn) {
    btn.innerHTML = next === 'dark' 
      ? '<i data-lucide="sun" style="width:18px;height:18px"></i>' 
      : '<i data-lucide="moon" style="width:18px;height:18px"></i>';
  });

  if (window.lucide) {
    lucide.createIcons();
  }
  applyLogoSrc();
}

// ── START ─────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  initTheme();
  aplicarIdentidade();
  setTimeout(initApp, 300);
});

// ═══════════════════════════════════════════════════════════
//  HASH NAVIGATION — botão voltar nativo do celular
//  Funciona no GAS (iframe cross-origin) onde pushState
//  não é interceptado pelo botão voltar do Android/iOS.
//  Mudanças de hash (#) aparecem no histórico do WebView.
// ═══════════════════════════════════════════════════════════

var _navLock  = false; // evita loop: hashchange → pushState → hashchange
var _navStack = [];    // pilha interna para diagnóstico

// ── Empurra estado na pilha (chamado a cada mudança de tela) ──
function navPush(state) {
  // state = objeto com as propriedades do estado atual
  // ex: { view:'membros', tab:'lista', step:'form', id:'abc' }
  _navStack.push(state);
  try {
    _navLock = true;
    var hash = '#' + Object.keys(state).map(function(k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(state[k] || '');
    }).join('&');
    window.location.hash = hash;
    setTimeout(function() { _navLock = false; }, 80);
  } catch(e) { _navLock = false; }
}

// ── Substitui o estado atual sem criar entrada no histórico ──
function navReplace(state) {
  if (_navStack.length) _navStack[_navStack.length - 1] = state;
  else _navStack.push(state);
  try {
    var hash = '#' + Object.keys(state).map(function(k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(state[k] || '');
    }).join('&');
    window.history.replaceState(null, '', hash);
  } catch(e) {}
}

// ── Limpa hash sem criar entrada no histórico ──────────────
function navClearHash() {
  try {
    _navLock = true;
    _navStack = [];
    window.history.replaceState(null, '', window.location.pathname + window.location.search);
    setTimeout(function() { _navLock = false; }, 80);
  } catch(e) { _navLock = false; }
}

// ── Listener global de hashchange ─────────────────────────
window.addEventListener('hashchange', function() {
  if (_navLock) return; // mudança programática — ignora

  // Botão voltar real: delega ao handler do módulo ativo
  var view = App && App.currentView;

  // Cada módulo pode registrar seu handler em App.onNavBack
  if (App && typeof App.onNavBack === 'function') {
    App.onNavBack();
    return;
  }

  // Fallback global: volta para home se não há handler
  if (view && view !== 'home' && view !== 'login') {
    navigateTo('home');
  }
});

// ── navigateTo: intercepta e empurra estado de nível 1 ────
// Sobrescreve navegações entre módulos para criar entrada no hash
var _navigateToOriginal = navigateTo;
navigateTo = function(view, params) {
  _navigateToOriginal(view, params);
  // Empurra estado apenas para views autenticadas (não login)
  if (authRequired && authRequired.indexOf(view) !== -1) {
    navPush({ view: view });
  }
};

// ── BOOTSTRAP ─────────────────────────────────────────────
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function() {
    applyLogoSrc();
    initApp();
  });
} else {
  applyLogoSrc();
  initApp();
}
