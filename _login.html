<style>
/* ══════════════════════════════════════════════════
   TELAS DE ENTRADA: login, primeiro acesso, recuperar senha
   Fonte única do CSS destas telas (tokens do sistema, sem animação contínua).
══════════════════════════════════════════════════ */
#view-login, #view-primeiro-acesso, #view-recuperar-senha { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

/* Fundo: degradê estático da cor da igreja */
.login-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 85% 60% at 50% -8%, color-mix(in srgb, var(--teal) 18%, transparent) 0%, transparent 60%), var(--bg);
}

.login-wrapper, .pa-wrapper {
  position: relative; z-index: 1; flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: var(--sp-5) var(--gutter) var(--sp-6);
}

/* Telas largas: marca e cartão lado a lado (a altura é a do maior, não a soma) */
.login-split { display: flex; flex-direction: column; align-items: center; width: 100%; }
.login-split-divider { display: none; }
@media (min-width: 900px) {
  .login-split { flex-direction: row; justify-content: center; gap: var(--sp-7, 56px); max-width: 920px; }
  .login-header { margin-bottom: 0; flex: 1 1 320px; max-width: 340px; }
  .login-logo-ring { width: 96px; height: 96px; }
  .login-split-divider { display: block; width: 1px; align-self: stretch; min-height: 240px; background: linear-gradient(180deg, transparent, var(--border2) 20%, var(--border2) 80%, transparent); }
  .login-card { flex-shrink: 0; }
}
/* Viewports baixas: o botão "Entrar" nunca fica cortado */
@media (max-height: 760px) {
  .login-wrapper, .pa-wrapper { padding: var(--sp-4) var(--gutter); }
  .login-header { margin-bottom: var(--sp-4); }
  .login-logo-ring { width: 64px; height: 64px; margin-bottom: var(--sp-3); }
}

/* ── Marca ── */
.login-header { text-align: center; margin-bottom: var(--sp-6); }
.login-logo-ring {
  position: relative; width: 72px; height: 72px; margin: 0 auto var(--sp-4); border-radius: 50%;
  background: var(--teal); border: 2px solid color-mix(in srgb, var(--teal) 55%, transparent);
  box-shadow: 0 8px 24px -10px var(--teal-glow);
}
.login-logo-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.login-church-name { font-size: var(--fs-lg); font-weight: 800; letter-spacing: -.02em; line-height: 1.2; color: var(--text); }
[data-theme="dark"] .login-church-name { color: #fff; }
@media (min-width: 900px) { .login-church-name { font-size: var(--fs-xl); } }
.login-church-sub { margin-top: var(--sp-1); font-size: var(--fs-xs); color: var(--text-muted); font-family: 'DM Mono', monospace; letter-spacing: .06em; text-transform: uppercase; }

/* ── Cartão (login e pa compartilham) ── */
.login-card, .pa-card {
  position: relative; overflow: hidden; width: 100%; max-width: 420px;
  background: var(--bg-glass2); border: 1px solid var(--border2); border-radius: var(--r-4);
  padding: var(--sp-5); box-shadow: var(--shadow-lg);
}
.pa-card { max-width: 440px; }
.login-card::before, .pa-card::before { content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 2px; background: linear-gradient(90deg, transparent, var(--teal), transparent); }
.pa-card::before { background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.login-card-title, .pa-title { font-size: var(--fs-lg); font-weight: 800; letter-spacing: -.02em; color: var(--text); margin-bottom: var(--sp-1); }
.login-card-sub, .pa-sub { font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: var(--sp-4); }
.login-card .field, .pa-card .field { margin-bottom: var(--sp-3); }

.pa-badge {
  display: inline-flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); padding: var(--sp-1) var(--sp-3);
  background: var(--gold-dim); border: 1px solid color-mix(in srgb, var(--gold) 28%, transparent); color: var(--gold); border-radius: var(--r-pill, 100px);
  font-size: var(--fs-xs); font-weight: 700; font-family: 'DM Mono', monospace; letter-spacing: .04em; text-transform: uppercase;
}
.pa-info-box { display: flex; align-items: flex-start; gap: var(--sp-2); margin-bottom: var(--sp-4); padding: var(--sp-3); background: var(--bg4); border: 1px solid var(--border); border-radius: var(--r-2); font-size: var(--fs-sm); color: var(--text-muted); }
.pa-info-box span:first-child { flex-shrink: 0; color: var(--teal); }

/* Senha */
.pwd-toggle-btn { position: absolute; right: var(--sp-3); top: 50%; transform: translateY(-50%); display: flex; align-items: center; padding: 0; background: none; border: none; cursor: pointer; color: var(--text-dim); transition: color var(--dur-fast); }
.pwd-toggle-btn:hover { color: var(--text-muted); }
.pwd-strength { margin-top: var(--sp-2); display: none; }
.pwd-strength.visible { display: block; }
.pwd-strength-bar { height: 3px; margin-bottom: var(--sp-1); border-radius: 100px; background: var(--bg4); overflow: hidden; }
.pwd-strength-fill { height: 100%; border-radius: 100px; transition: width var(--dur-slow) var(--ease), background var(--dur-slow); }
.pwd-strength-label { font-size: var(--fs-xs); color: var(--text-dim); font-family: 'DM Mono', monospace; }
.pwd-rules { list-style: none; display: flex; flex-direction: column; gap: var(--sp-1); margin-top: var(--sp-2); }
.pwd-rules li { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-xs); color: var(--text-dim); transition: color var(--dur); }
.pwd-rules li.ok { color: var(--green); }
.pwd-rules li.ok::before { content: '✓'; color: var(--green); font-weight: 700; }
.pwd-rules li:not(.ok)::before { content: '○'; color: var(--text-dim); }

.forgot-link { background: none; border: none; cursor: pointer; padding: 0; color: var(--teal); font-family: inherit; font-size: var(--fs-sm); font-weight: 700; transition: color var(--dur-fast); }
.forgot-link:hover { color: var(--teal-light); text-decoration: underline; }
.login-forgot-row { display: flex; justify-content: flex-end; margin: calc(var(--sp-2) * -1) 0 var(--sp-4); }

.login-error-msg { display: none; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); padding: var(--sp-3); background: var(--red-dim); border: 1px solid color-mix(in srgb, var(--red) 28%, transparent); border-radius: var(--r-2); font-size: var(--fs-sm); color: var(--red); }
.login-error-msg.visible { display: flex; }
.login-footer { margin-top: var(--sp-4); text-align: center; font-size: var(--fs-xs); color: var(--text-dim); font-family: 'DM Mono', monospace; }
.or-divider { display: flex; align-items: center; gap: var(--sp-3); margin: var(--sp-4) 0; color: var(--text-dim); font-size: var(--fs-xs); }
.or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* Estados finais (e-mail enviado, link inválido, senha redefinida) */
.auth-estado { text-align: center; padding: var(--sp-4) 0; }
.auth-estado svg { width: 40px; height: 40px; margin-bottom: var(--sp-3); }
.auth-estado h3 { font-size: var(--fs-md); font-weight: 700; color: var(--text); margin-bottom: var(--sp-2); }
.auth-estado.erro h3 { color: var(--red); }
.auth-estado.ok h3 { color: var(--green); }
.auth-estado p { font-size: var(--fs-sm); line-height: 1.5; color: var(--text-muted); margin-bottom: var(--sp-4); }
.auth-estado small { display: block; margin-top: var(--sp-2); font-size: var(--fs-xs); color: var(--text-dim); }

/* Ícones de input legíveis em escuro e claro */
.login-card .input-icon, .pa-card .input-icon { color: #F1F1F1; opacity: .5; }
.login-card .input-wrap:focus-within .input-icon, .pa-card .input-wrap:focus-within .input-icon { opacity: 1; color: var(--teal); }
[data-theme="light"] .login-card .input-icon, [data-theme="light"] .pa-card .input-icon { color: var(--teal); opacity: .9; }
</style>

<script>
// ═══════════════════════════════════════════════════
//  LOGIN VIEW
// ═══════════════════════════════════════════════════

function renderLogin() {
  renderView(
    '<div id="view-login">' +
      '<div class="login-bg"></div>' +
      '<div class="login-wrapper">' +

        '<div class="login-split">' +

        /* ── HEADER ── */
        '<div class="login-header">' +
          '<div class="login-logo-ring">' +
            '<div class="login-logo-icon">' +
              '<span class="brand-mark" style="font-size:var(--fs-lg)">' + brandMarkInner() + '</span>' +
            '</div>' +
          '</div>' +
          '<h1 class="login-church-name">' + escHtml(IDENTIDADE.nome) + '</h1>' +
          '<p class="login-church-sub">Plataforma de Gestão Ministerial</p>' +
        '</div>' +

        '<div class="login-split-divider"></div>' +

        /* ── CARD ── */
        '<div class="login-card">' +
          '<h2 class="login-card-title">Entrar na plataforma</h2>' +
          '<p class="login-card-sub">Acesse com suas credenciais</p>' +

          /* Erro inline */
          '<div class="login-error-msg" id="login-error">' +
            '<i data-lucide="alert-triangle" style="width:13px;height:13px;flex-shrink:0"></i>' +
            '<span id="login-error-text"></span>' +
          '</div>' +

          /* Campo email */
          '<div class="field">' +
            '<label for="login-email">E-mail</label>' +
            '<div class="input-wrap">' +
              '<span class="input-icon" style="color:var(--teal)"><i data-lucide="mail" class="ic-18"></i></span>' +
              '<input type="email" id="login-email" class="has-icon-left" ' +
                'placeholder="seu@email.com" autocomplete="email" autofocus>' +
            '</div>' +
            '<span class="field-error">E-mail inválido.</span>' +
          '</div>' +

          /* Campo senha */
          '<div class="field">' +
            '<label for="login-senha">Senha</label>' +
            '<div class="input-wrap" style="position:relative">' +
              '<span class="input-icon" style="color:var(--teal)"><i data-lucide="lock" class="ic-18"></i></span>' +
              '<input type="password" id="login-senha" class="has-icon-left has-icon-right" ' +
                'placeholder="••••••••" autocomplete="current-password">' +
              '<button type="button" class="pwd-toggle-btn" onclick="togglePwdVisibility(\'login-senha\', this)" tabindex="-1">' +
                '<i data-lucide="eye" class="ic-18"></i>' +
              '</button>' +
            '</div>' +
          '</div>' +

          /* Esqueci senha */
          '<div class="login-forgot-row">' +
            '<button class="forgot-link" onclick="navigateTo(\'recuperar-senha\')">Esqueci minha senha</button>' +
          '</div>' +

          /* Botão entrar */
          '<button class="btn btn-primary btn-full btn-lg" id="btn-login" onclick="handleLogin()">' +
            '<span class="btn-spinner"></span>' +
            '<span class="btn-text">Entrar</span>' +
          '</button>' +

        '</div>' + /* /login-card */

        '</div>' + /* /login-split */

        '<div class="login-footer" style="display:flex;align-items:center;justify-content:center;gap:12px">' +
          '<span>' + escHtml(IDENTIDADE.nome) + ' · Gestão Ministerial</span>' +
          '<button class="theme-toggle-btn btn btn-ghost btn-sm" onclick="toggleTheme()" style="width:32px;height:32px;padding:0;border-radius:8px" title="Alternar tema">' +
            '<i data-lucide="moon" class="ic-16"></i>' +
          '</button>' +
        '</div>' +

      '</div>' + /* /login-wrapper */
    '</div>'   /* /view-login */
  );

  // Enter para submeter
  document.getElementById('login-email').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('login-senha').focus();
  });
  document.getElementById('login-senha').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleLogin();
  });
}

function handleLogin() {
  var emailEl = document.getElementById('login-email');
  var senhaEl = document.getElementById('login-senha');
  var btn     = document.getElementById('btn-login');
  var errBox  = document.getElementById('login-error');
  var errTxt  = document.getElementById('login-error-text');

  var email = emailEl.value.trim();
  var senha = senhaEl.value;

  // Ocultar erro anterior
  errBox.classList.remove('visible');

  // Validações client
  var ok = true;
  var emailField = emailEl.closest('.field');
  var senhaField = senhaEl.closest('.field');
  emailField.classList.remove('has-error');
  senhaField.classList.remove('has-error');

  if (!validateEmail(email)) {
    emailField.classList.add('has-error');
    ok = false;
  }
  if (!senha) {
    senhaField.classList.add('has-error');
    ok = false;
  }
  if (!ok) return;

  setBtnLoading(btn, true);

  sha256(senha).then(function(hash) {
    google.script.run
      .withSuccessHandler(function(res) {
        setBtnLoading(btn, false);
        if (res && res.success) {
          saveSession(res.data);
          if (res.data.primeiroAcesso) {
            navigateTo('primeiro-acesso');
          } else {
            navigateTo('home');
          }
        } else {
          errTxt.textContent = (res && res.error) ? res.error : 'Erro inesperado. Tente novamente.';
          errBox.classList.add('visible');
          senhaEl.value = '';
          senhaEl.focus();
        }
      })
      .withFailureHandler(function(e) {
        setBtnLoading(btn, false);
        errTxt.textContent = 'Erro de conexão. Tente novamente.';
        errBox.classList.add('visible');
      })
      .login(email, hash);
  });
}

function togglePwdVisibility(inputId, btn) {
  var input = document.getElementById(inputId);
  if (!input) return;
  var isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  btn.innerHTML = isHidden
    ? '<i data-lucide="eye-off" class="ic-18"></i>'
    : '<i data-lucide="eye" class="ic-18"></i>';
  if (window.lucide) lucide.createIcons();
}
</script>
