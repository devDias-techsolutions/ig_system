name: deploy-apps-script

# Envia o código para o Apps Script. Roda quando algo entra na main e também sob demanda
# (aba Actions > deploy-apps-script > Run workflow). Só roda se os segredos estiverem configurados.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-apps-script

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes (não envia se falharem)
        run: npm test
      - name: Verifica segredos
        id: segredos
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "Segredos CLASPRC_JSON/SCRIPT_ID ausentes: deploy ignorado (veja docs/DEPLOY.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Monta a pasta de deploy
        if: steps.segredos.outputs.ok == 'true'
        run: node scripts/preparar-deploy.js dist
      - name: Envia ao Apps Script
        if: steps.segredos.outputs.ok == 'true'
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"dist"}\n' "$SCRIPT_ID" > .clasp.json
          npx --yes @google/clasp@2 push --force
          if [ -n "$DEPLOYMENT_ID" ]; then
            npx --yes @google/clasp@2 deploy --deploymentId "$DEPLOYMENT_ID" --description "deploy ${GITHUB_SHA::7}"
          fi
          rm -f "$HOME/.clasprc.json" .clasp.json
